/* ========================================================================
   BULK STAFF IMPORT \u2014 CSV or JSON. Matches existing staff by NID (updates
   in place); a new NID creates a new record. No external library required
   (this app stays fully offline), so XLSX isn't supported directly \u2014 the
   template and instructions ask for CSV, which any spreadsheet program
   (Excel/Sheets/LibreOffice) can save to via "Save As \u2192 CSV".
   ======================================================================== */
function parseAreaAccessString(str){
  const aa = defaultAreaAccess();
  if(!str) return aa;
  String(str).split(/[;|]/).map(s=>s.trim()).filter(Boolean).forEach(tok=>{
    let m;
    if(/^office$/i.test(tok)) aa.office = true;
    else if((m = tok.match(/^ship\s*[:\-]?\s*\(?([^)]*)\)?$/i))){ aa.ship = true; aa.shipName = (m[1]||'').trim(); }
    else if(/^walkway$/i.test(tok)) aa.walkway = true;
    else if(/^outdoor/i.test(tok)) aa.outdoorStorage = true;
    else if(/^indoor/i.test(tok)) aa.indoorStorage = true;
    else if((m = tok.match(/^other\s*[:\-]?\s*(.*)$/i))){ aa.other = true; aa.otherText = (m[1]||'').trim(); }
  });
  return aa;
}
/* Minimal RFC4180-ish CSV parser \u2014 handles quoted fields, escaped quotes, and commas inside quotes. */
function parseCsv(text){
  const rows = []; let field='', row=[], inQuotes=false, i=0;
  const pushField=()=>{ row.push(field); field=''; };
  const pushRow=()=>{ rows.push(row); row=[]; };
  while(i<text.length){
    const c = text[i];
    if(inQuotes){
      if(c==='"'){ if(text[i+1]==='"'){ field+='"'; i+=2; continue; } inQuotes=false; i++; continue; }
      field+=c; i++; continue;
    } else {
      if(c==='"'){ inQuotes=true; i++; continue; }
      if(c===','){ pushField(); i++; continue; }
      if(c==='\r'){ i++; continue; }
      if(c==='\n'){ pushField(); pushRow(); i++; continue; }
      field+=c; i++; continue;
    }
  }
  if(field.length || row.length){ pushField(); pushRow(); }
  if(!rows.length) return [];
  const headers = rows[0].map(h=>h.trim().toLowerCase());
  return rows.slice(1).filter(r=>r.some(c=>(c||'').trim()!=='')).map(r=>{
    const obj = {}; headers.forEach((h,idx)=>obj[h]=(r[idx]||'').trim()); return obj;
  });
}
function normalizeImportRow(obj){
  const get = (...keys)=>{ for(const k of keys){ if(obj[k]!=null && String(obj[k]).trim()!=='') return String(obj[k]).trim(); } return ''; };
  const status = get('status').toLowerCase()==='inactive' ? 'inactive' : 'active';
  return {
    name: get('name','fullname','full name'),
    nid: get('nid','nid number','national id'),
    phone: get('phone','phone number','mobile'),
    department: get('unit','department','dept'),
    designation: get('designation','title','position'),
    areaAccess: get('areaaccess','area access'),
    bloodGroup: get('bloodgroup','blood group'),
    email: get('email'),
    emergencyContact: get('emergencycontact','emergency contact'),
    joiningDate: get('joiningdate','joining date'),
    status
  };
}

      <button class="btn btn-sm" onclick="bulkImportStaffTemplate()">Download CSV Template</button>

      <p class="hint">JSON files should be an array of objects using the same field names (case-insensitive), e.g. <code>[{"name":"...","nid":"...","phone":"...","unit":"...","designation":"...","areaAccess":"Office;Walkway"}]</code>.</p>
    </div>
    <div class="modal-foot">

  `, {wide:true});
}
async function runBulkImportStaff(){
  const input = document.getElementById('bulkImportFile');
  const file = input && input.files[0];
  if(!file){ toast('Choose a CSV or JSON file first.','err'); return; }
  const text = await file.text();
  let rows = [];
  try{
    if(/\.json$/i.test(file.name) || text.trim().startsWith('[')){
      const data = JSON.parse(text);
      rows = (Array.isArray(data)?data:[]).map(o=>{
        const lower = {}; Object.keys(o).forEach(k=>lower[k.toLowerCase()]=o[k]);
        return normalizeImportRow(lower);
      });
    } else {
      rows = parseCsv(text).map(normalizeImportRow);
    }
  }catch(e){ toast('Could not parse the file: '+e.message,'err'); return; }
  rows = rows.filter(r=>r.name && r.nid && r.phone && r.department && r.designation);
  if(!rows.length){ toast('No valid rows found \u2014 Name, NID, Phone, Unit and Designation are required in every row.','err'); return; }
  const ok = await askKey('admin');
  if(!ok) return;
  const staff = DB.get('staff',[]);
  let added=0, updated=0;
  rows.forEach(r=>{
    const id = idFromNid(r.nid);
    const areaAccess = parseAreaAccessString(r.areaAccess);
    const existing = staff.find(s=>s.id===id);
    if(existing){
      Object.assign(existing, {name:r.name, nid:r.nid, department:r.department, designation:r.designation,
        areaAccess, phone:r.phone, bloodGroup:r.bloodGroup||existing.bloodGroup||'', email:r.email||existing.email||'',
        emergencyContact:r.emergencyContact||existing.emergencyContact||'', joiningDate:r.joiningDate||existing.joiningDate||'',
        status:r.status||existing.status||'active'});
      updated++;
    } else {
      staff.unshift({id, type:'staff', nid:r.nid, name:r.name, department:r.department, designation:r.designation,
        areaAccess, phone:r.phone, bloodGroup:r.bloodGroup||'', email:r.email||'', emergencyContact:r.emergencyContact||'',
        joiningDate:r.joiningDate||'', status:r.status||'active', photo:''});
      added++;
    }
  });
  DB.set('staff', staff);
  logAudit('Bulk staff import: '+added+' added, '+updated+' updated', '', 'Admin');
  toast('Bulk import complete \u2014 '+added+' added, '+updated+' updated.', 'ok');
  closeModal();
  renderRoute();
}

   Two simple flows \u2014 no QR codes, no camera scanning, just typed numbers:
   - Type a National ID that isn't a known record -> start visitor registration
   - Type a Staff ID, Visitor ID, or NID that's already in the system -> check-in / check-out
   ======================================================================== */
function homeStartVisitorWithNid(prefillNid){
  newVisitorWizard();
  if(prefillNid) VW.fields.nid = prefillNid;
  openModal(`<div id="wizardRoot"></div>`, {wide:true, persistent:true});
  renderWizard();
}
/* Normalizes a phone number for comparison \u2014 strips everything but digits, and drops a
   leading country/trunk prefix ("+880", "880", or a leading "0") so "01712345678",
   "+8801712345678" and "8801712345678" all match the same stored number. */
function normPhone(p){
  let d = (p||'').replace(/\D/g,'');
  if(d.startsWith('880')) d = d.slice(3);
  else if(d.startsWith('0')) d = d.slice(1);
  return d;
}
async function homeManualSubmit(){
  const input = document.getElementById('homeScanInput');
  const raw = (input.value||'').trim();
  if(!raw){ toast('Scan or type an ID.','err'); return; }
  input.value = '';
  // Use the same normalization as every other NID-based lookup in the app (idFromNid strips
  // internal whitespace too, not just case) — otherwise a record registered with a NID typed as
  // "1234 5678 9012" silently fails to match here if it's later typed back in without the exact
  // same spacing (or vice versa), even though the id it was actually stored under has none.
  const id = idFromNid(raw);
  const rawPhone = normPhone(raw);
  const isPhoneLike = rawPhone.length>=7;
  const staff = DB.get('staff',[]).find(s=>s.id===id || (s.nid||'').toUpperCase()===id
    || (isPhoneLike && normPhone(s.phone)===rawPhone));
  if(staff){
    openLookupModal('STAFF', staff);
    return;
  }
  const visitor = DB.get('visitors',[]).find(v=>v.id===id || (v.nid||'').toUpperCase()===id
    || (isPhoneLike && normPhone(v.phone)===rawPhone));
  if(visitor){
    openLookupModal('VISITOR', visitor);
    return;
  }
  const ok = await confirmDialog('No record found', 'No staff or visitor is registered with \u201c'+escapeHtml(raw)+'\u201d. Start a new visitor registration using this as the NID number?', 'Register Visitor');
  if(ok) homeStartVisitorWithNid(raw);
}

function historyFilteredVisitors(){
  const {from,to,q} = historyState;
  return DB.get('visitors',[]).filter(v=>{
    const d = v.checkIn.slice(0,10);
    if(from && d<from) return false;
    if(to && d>to) return false;
    if(q){
      const hay = [v.id,v.name,v.phone,v.nid,v.company,v.hostName,v.accessLevel].join(' ').toLowerCase();
      if(!hay.includes(q.toLowerCase())) return false;
    }
    return true;
  }).sort((a,b)=> new Date(b.checkIn)-new Date(a.checkIn));
}
function historyFilteredStaffAtt(){
  const {from,to,q,staffCategory} = historyState;
  return DB.get('staffAttendance',[]).filter(a=>{
    const d = a.checkIn.slice(0,10);
    if(from && d<from) return false;
    if(to && d>to) return false;
    if(staffCategory && staffCategory!=='all' && (a.category||'STAFF')!==staffCategory) return false;
    if(q){
      const hay = [a.staffId,a.name,a.department].join(' ').toLowerCase();
      if(!hay.includes(q.toLowerCase())) return false;

    return true;
  }).sort((a,b)=> new Date(b.checkIn)-new Date(a.checkIn));

/* Rewrites (never appends) a single dynamic @page rule right before every print job, so a
   report printed in landscape can never leak into the next badge print (which needs portrait).
   Margin and orientation both come from Settings > Printing so any user can tune them. */
/* Stamps the credit + provenance line that repeats at the foot of every printed sheet.
   sourceLabel says WHICH screen produced the paper, so a page found on a desk can always be
   traced back. Called by every print entry point before window.print(). */
function setPrintSource(sourceLabel){
  const el = document.getElementById('printFootLine');
  if(!el) return;
  const s = S();
  let who = 'gate';
  try { if(sessionRole) who = sessionRole; } catch(e){ /* not unlocked yet */ }
  el.textContent = 'Powered by Hamid Yasir & Co.  |  ' + (s.companyName || 'Mehreen Ship Recycling')
    + '  |  Source: ' + (sourceLabel || 'Gate System')
    + '  |  Printed ' + fmtDT(nowISO()) + ' (' + who + ')';
}
function applyPrintPageStyle(orientation){
  const s = S();
  let marginMm = parseFloat(s.printMarginMm);
  if(!isFinite(marginMm) || marginMm <= 0){
    const legacyIn = parseFloat(s.printMarginIn);
    marginMm = (isFinite(legacyIn) && legacyIn > 0) ? legacyIn * 25.4 : 20;
  }
  marginMm = Math.min(40, Math.max(3, marginMm));
  let el = document.getElementById('dynamicPrintPageStyle');
  if(!el){ el = document.createElement('style'); el.id = 'dynamicPrintPageStyle'; document.head.appendChild(el); }
  el.textContent = `@media print{ @page{ size:A4 ${orientation}; margin:${marginMm.toFixed(2)}mm; } }`;
  return marginMm;
}

function stripPhotosForExport(rec){
  const {facePhoto, frontPhoto, backPhoto, photo, nidFrontPhoto, nidBackPhoto, ...rest} = rec;

function toCsv(rows){
  if(!rows.length) return '';
  const clean = rows.map(stripPhotosForExport);
  const cols = Object.keys(clean[0]);
  const esc = v=>{ const s = v==null?'':String(v); return /[",\n]/.test(s)? '"'+s.replace(/"/g,'""')+'"': s; };
  return cols.join(',')+'\n'+clean.map(r=>cols.map(c=>esc(r[c])).join(',')).join('\n');
}

/* Expands a visitor record into its individual check-in/out sessions (falling back to the
   top-level checkIn/checkOut for older records saved before the sessions array existed). Reports
   must count and list every entry and exit separately \u2014 a visitor who checked in and out
   three times in one day has to appear as three rows, not one, and a multi-day "valid until"
   pass has to show up correctly on EACH day it was actually used, not just the day of the most
   recent session. */
function visitorSessions(v){
  const sessions = Array.isArray(v.sessions) && v.sessions.length ? v.sessions
    : (v.checkIn ? [{checkIn:v.checkIn, checkOut:v.checkOut, gatePassIssued:v.gatePassIssued,
                      gatePassNumber:v.gatePassNumber, exitVehicleType:v.exitVehicleType, exitPlateNumber:v.exitPlateNumber}] : []);
  return sessions.map((s,i)=> ({...s, visitor:v, sessionIndex:i+1, sessionCount:sessions.length}));
}
function reportRows(){
  const {type, date, month} = reportState;
  if(type==='daily-visitor') return DB.get('visitors',[]).flatMap(visitorSessions).filter(s=>s.checkIn.slice(0,10)===date);
  if(type==='staff-attendance') return DB.get('staffAttendance',[]).filter(a=>a.checkIn.slice(0,10)===date);
  if(type==='gate-summary'){
    const vSessions = DB.get('visitors',[]).flatMap(visitorSessions);
    return [
      ...vSessions.filter(s=>s.checkIn.slice(0,10)===date).map(s=>({time:s.checkIn, event:'Visitor Check-in', who:s.visitor.name, detail:s.visitor.accessLevel})),
      ...vSessions.filter(s=>s.checkOut && s.checkOut.slice(0,10)===date).map(s=>({time:s.checkOut, event:'Visitor Check-out', who:s.visitor.name, detail:s.visitor.accessLevel})),
      ...DB.get('staffAttendance',[]).filter(a=>a.checkIn.slice(0,10)===date).map(a=>({time:a.checkIn, event:'Staff Check-in', who:a.name, detail:a.department})),
      ...DB.get('staffAttendance',[]).filter(a=>a.checkOut && a.checkOut.slice(0,10)===date).map(a=>({time:a.checkOut, event:'Staff Check-out', who:a.name, detail:a.department})),
    ].sort((a,b)=> new Date(a.time)-new Date(b.time));
  }
  if(type==='monthly') return {
    // every session counted, not just the most recent per visitor — otherwise a repeat visitor
    // with a multi-day "valid until" pass, or anyone re-checked-in same-day, is undercounted
    visitors: DB.get('visitors',[]).flatMap(visitorSessions).filter(s=>s.checkIn.slice(0,7)===month),
    staffAtt: DB.get('staffAttendance',[]).filter(a=>a.checkIn.slice(0,7)===month)
  };
}
/* Renders the secondary "details" row under each report record: every field that doesn't fit
   in the compact primary row, as label:value chips that wrap normally like prose instead of
   being squeezed into their own table column (which is what caused entries as short as a phone
   number to wrap one digit per line when 16+ columns were forced to share one page width).
   Empty/dash fields are skipped entirely so a record with few optional fields filled in doesn't
   print a row of clutter. */
function reportDetailLine(pairs){
  const chips = pairs
    .filter(([,v]) => v && v!=='\u2014')
    .map(([l,v]) => `<span class="rd-item"><b>${escapeHtml(l)}:</b> ${escapeHtml(String(v))}</span>`)
    .join('');
  return chips ? `<div class="report-detail">${chips}</div>` : `<div class="report-detail small" style="color:#999;">No additional details recorded.</div>`;
}

function monthlyDailyBreakdown(visitors, staffAtt, labourAtt){
  const days = {};
  visitors.forEach(v=>{ const d=v.checkIn.slice(0,10); days[d]=days[d]||{v:0,s:0,l:0}; days[d].v++; });
  staffAtt.forEach(a=>{ const d=a.checkIn.slice(0,10); days[d]=days[d]||{v:0,s:0,l:0}; days[d].s++; });
  (labourAtt||[]).forEach(a=>{ const d=a.checkIn.slice(0,10); days[d]=days[d]||{v:0,s:0,l:0}; days[d].l++; });
  return Object.keys(days).sort().map(d=>({date:d, v:days[d].v, s:days[d].s, l:days[d].l}));
}

/* buildReportHtml()'s daily-visitor rows carry the full nested visitor record (including base64
   photos) for display convenience — exporting that as-is would silently balloon every CSV/JSON/
   XLSX export with embedded photo data and print "[object Object]" for the visitor column. This
   flattens each row to exactly the columns actually shown in the report, for export only. */
function flattenVisitorSessionRow(s){
  const v = s.visitor||{};
  return {
    id:v.id, nid:v.nid||'', name:v.name, session:s.sessionCount>1?(s.sessionIndex+' of '+s.sessionCount):'',
    hostedBy:v.hostName||'', phone:v.phone||'', company:v.company||'', visitorType:v.accessLevel||'',
    purpose:v.purpose||'', escort:v.escort||'', areaAccess:formatAreaAccess(v.areaAccess)||'',
    checkIn:s.checkIn, checkOut:s.checkOut||'', vehicleType:s.exitVehicleType||v.vehicleType||'',
    plateNumber:s.exitPlateNumber||v.plateNumber||'', gatePassIssued:s.gatePassIssued?'Yes':'No',
    gatePassNumber:s.gatePassNumber||'', notes:v.notes||'', issuedBy:v.issuedBy||''
  };
}
function flattenReportRowsForExport(rows){
  if(reportState.type==='daily-visitor') return rows.map(flattenVisitorSessionRow);
  if(reportState.type==='monthly'){
    // rows here is visitor-sessions concatenated with staffAtt entries — a session row always
    // carries a nested .visitor, a staffAtt row never does, so that's how we tell them apart.
    return rows.map(r => r.visitor ? flattenVisitorSessionRow(r) : r);
  }
  return rows;
}
function exportReport(fmt){
  const rowsRaw = reportState.type==='monthly' ? reportRows().visitors.concat(reportRows().staffAtt) : reportRows();
  const rows = flattenReportRowsForExport(Array.isArray(rowsRaw) ? rowsRaw : []);
  const fname = 'report_'+reportState.type+'_'+(reportState.type==='monthly'?reportState.month:reportState.date);
  if(fmt==='json') downloadFile(fname+'.json', JSON.stringify(rows,null,2), 'application/json');
  else if(fmt==='csv') downloadFile(fname+'.csv', toCsv(rows), 'text/csv');
  else if(fmt==='xlsx'){
    const ws = XLSX.utils.json_to_sheet(rows.map(stripPhotosForExport));
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Report');
    XLSX.writeFile(wb, fname+'.xlsx');
  }
  logAudit('Report exported: '+reportState.type+' ('+fmt+')', '', 'Officer');
}

/* Storage usage + a one-click self-test. When a user reports "nothing saves" or "nothing
   prints", this is the screen that says WHICH of those is actually true and why, instead of
   everyone guessing. */
function renderStorageDiagnostics(){
  const u = DB.usage();
  const APPROX_CAP = 5*1024*1024; // conservative: browsers vary, 5MB is the common floor
  const pct = Math.min(100, Math.round((u.total/APPROX_CAP)*100));
  const barColor = pct>85 ? 'var(--red)' : pct>60 ? 'var(--amber)' : 'var(--green)';
  const v = DB.get('visitors',[]), st = DB.get('staff',[]);
  const withPhotos = v.filter(x=>x.facePhoto||x.frontPhoto||x.backPhoto).length
                   + st.filter(x=>x.photo||x.nidFrontPhoto||x.nidBackPhoto).length;
  const photoBytes = photoStoreUsageEstimate();
  return `
    <div class="card card-pad">
      <b>Storage &amp; Diagnostics</b>
      <p class="small" style="margin-bottom:.5em;">Text records (visitors, staff, attendance, audit log) are stored in this browser's localStorage, which allows only about 5&ndash;10MB in total. When that fills, saving stops working.
      ${photoDbAvailable ? ` Photos are stored separately in IndexedDB (<b>${fmtBytes(photoBytes)}</b> used there so far), which has far more room, so they no longer count against the limit below.` : ` This browser does not support IndexedDB, so photos are stored inline here too \u2014 they will count toward the limit below, and this will fill up much faster.`}</p>
      <div style="background:#eef0f3; border-radius:6px; height:14px; overflow:hidden; margin:.6em 0;">
        <div style="width:${pct}%; height:100%; background:${barColor};"></div>
      </div>
      <div class="small"><b>${fmtBytes(u.total)}</b> used &mdash; roughly ${pct}% of a typical 5MB allowance.</div>
      <div class="small" style="color:#666; margin-top:.35em;">
        Visitors ${fmtBytes(u.per.visitors||0)} &middot; Staff ${fmtBytes(u.per.staff||0)} &middot;
        Attendance ${fmtBytes(u.per.staffAttendance||0)} &middot; Audit log ${fmtBytes(u.per.auditLog||0)}<br>
        ${v.length} visitor records, ${st.length} staff records, ${withPhotos} with photos attached.
      </div>
      ${pct>85 ? `<div class="override-note" style="margin-top:.8em;">${ic('shield')}<div><b>Storage is nearly full.</b> Export a backup now, then clear old records, or saving will start failing.</div></div>`:''}
      <div class="row" style="margin-top:.9em; flex-wrap:wrap;">
        <button class="btn" onclick="runSelfTest()">Run Self-Test</button>
        <button class="btn" onclick="renderRoute()">Refresh</button>
      </div>
      <div id="selfTestOut" class="small" style="margin-top:.8em;"></div>
    </div>`;
}
/* Actively tries the things users report as broken and reports pass/fail per item. */
function runSelfTest(){
  const out = document.getElementById('selfTestOut');
  if(!out) return;
  const results = [];
  // 1. can we write at all?
  let writeOk = false, writeErr = '';
  try{
    const k = 'gsms_selftest_'+Date.now();
    localStorage.setItem(k, 'x'.repeat(1024));
    writeOk = localStorage.getItem(k) !== null;
    localStorage.removeItem(k);
  }catch(e){ writeErr = e && e.name || String(e); }
  results.push([writeOk, 'Save to browser storage', writeOk ? 'Working' : ('BLOCKED \u2014 '+(writeErr||'unknown')+'. Nothing you enter will be kept. See the guidance above.')]);
  // 2. can we write something the size of a real record with a photo?
  let bigOk = false, bigErr = '';
  try{
    const k = 'gsms_selftestbig_'+Date.now();
    localStorage.setItem(k, 'x'.repeat(300*1024)); // ~300KB, about one visitor with photos
    bigOk = true;
    localStorage.removeItem(k);
  }catch(e){ bigErr = e && e.name || String(e); }
  results.push([bigOk, 'Room for a new record with photos', bigOk ? 'Enough space' : ('FULL \u2014 '+bigErr+'. Export a backup and clear old records.')]);
  // 3. print plumbing present
  const areaOk = !!document.getElementById('printArea');
  results.push([areaOk, 'Print area present', areaOk ? 'Present' : 'MISSING \u2014 reload the page.']);
  // 4. can we build a badge without throwing?
  let badgeOk = false, badgeErr = '';
  try{
    const sample = DB.get('visitors',[])[0] || {id:'TEST', name:'Test', nid:'123', areaAccess:{}, checkIn:nowISO(), expiry:nowISO()};
    const html = buildBadgeHtml(sample, 'VISITOR');
    badgeOk = !!(html && html.indexOf('badge-card')>=0);
  }catch(e){ badgeErr = String(e && e.message || e); }
  results.push([badgeOk, 'Badge rendering', badgeOk ? 'Working' : ('FAILED \u2014 '+badgeErr)]);
  // 5. print dialog availability (can't verify the dialog opens without opening it)
  const printOk = typeof window.print === 'function';
  results.push([printOk, 'Print function available', printOk ? 'Available (use Print Badge to test for real)' : 'MISSING \u2014 this browser cannot print.']);

  out.innerHTML = `<table class="sessions-table"><tbody>${
    results.map(r=>`<tr><td style="width:1.6em;">${r[0]?'\u2705':'\u274c'}</td><td><b>${escapeHtml(r[1])}</b></td><td>${escapeHtml(r[2])}</td></tr>`).join('')
  }</tbody></table>
  <p class="small" style="margin-top:.6em; color:#666;">If any row shows &#10060;, that is the actual cause &mdash; fix that one first.</p>`;
}
/* Shared by manual export (exportAll) and the auto-backup-to-folder feature below, so both are
   always exactly the same shape and never drift apart. */
function buildFullBackupPayload(){
  return {
    appDataVersion: APP_DATA_VERSION,
    exportedAt: nowISO(),
    settings: S(),
    visitors: DB.get('visitors',[]),
    staff: DB.get('staff',[]),
    staffAttendance: DB.get('staffAttendance',[]),
    counters: DB.get('counters',{}),
    auditLog: DB.get('auditLog',[])
  };
}
/* ---------------------------- AUTO-BACKUP TO A LOCAL FOLDER ----------------------------------
   PC-only. Uses the File System Access API (window.showDirectoryPicker), which only exists in
   Chromium desktop browsers (Chrome, Edge) — NOT Firefox, NOT Safari, NOT any mobile browser.
   Feature-detected throughout; everywhere this is unsupported the UI says so plainly and points
   back at manual Export instead of showing a broken button.
   The chosen folder handle can't go in localStorage (it isn't a string), so it lives in a tiny
   dedicated IndexedDB store, and browsers only remember WRITE permission for a handle across
   reloads if the user re-confirms it — queryPermission() checks silently, requestPermission()
   needs an actual click, which is why reconnecting after a reload needs a button, not just code. */
const AUTOBACKUP_SUPPORTED = typeof window.showDirectoryPicker === 'function';
let autoBackupDirHandle = null;
let autoBackupLastHash = '';
let autoBackupLastAt = null;
let autoBackupLastError = '';

function idbOpen(){
  return new Promise((resolve,reject)=>{
    const req = indexedDB.open('gsms_fsapi', 1);
    req.onupgradeneeded = ()=> req.result.createObjectStore('handles');
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  });
}
async function idbSetHandle(key, val){
  const db = await idbOpen();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction('handles','readwrite');
    tx.objectStore('handles').put(val, key);
    tx.oncomplete = ()=> resolve(true);
    tx.onerror = ()=> reject(tx.error);
  });
}
async function idbGetHandle(key){
  const db = await idbOpen();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction('handles','readonly');
    const req = tx.objectStore('handles').get(key);
    req.onsuccess = ()=> resolve(req.result||null);
    req.onerror = ()=> reject(req.error);
  });
}

/* Verifies (or re-requests) write permission for the remembered folder. queryPermission is
   silent and safe to call any time; requestPermission needs a real user gesture, so it's only
   called from an explicit "Reconnect" button click, never automatically on page load. */
async function verifyAutoBackupPermission(handle, requestIfNeeded){
  try{
    const opts = {mode:'readwrite'};
    let perm = await handle.queryPermission(opts);
    if(perm==='prompt' && requestIfNeeded) perm = await handle.requestPermission(opts);
    return perm==='granted';
  }catch(e){ return false; }
}
/* Restores the remembered folder handle on startup (silent permission check only — never
   force-prompts on load, since that requires a user gesture the page load itself doesn't have). */
async function restoreAutoBackupFolder(){
  if(!AUTOBACKUP_SUPPORTED) return;
  const s = S();
  if(!s.autoBackupEnabled) return;
  try{
    const handle = await idbGetHandle('backupDir');
    if(!handle) return;
    const ok = await verifyAutoBackupPermission(handle, false);
    if(ok){ autoBackupDirHandle = handle; }
    // if not ok, leave autoBackupDirHandle null — the Settings panel will show a Reconnect button
  }catch(e){ /* IndexedDB unavailable or handle stale — Settings panel offers manual reconnect */ }
}
async function reconnectAutoBackupFolder(){
  try{
    const handle = await idbGetHandle('backupDir');
    if(!handle){ toast('No remembered folder — choose one again.','err'); return; }
    const ok = await verifyAutoBackupPermission(handle, true); // this call has the click's user gesture
    if(ok){ autoBackupDirHandle = handle; toast('Reconnected to '+handle.name, 'ok'); await runAutoBackupNow(true); }
    else toast('Permission was not granted for that folder.', 'err');
    renderRoute();
  }catch(e){ toast('Could not reconnect: '+(e&&e.message||e), 'err'); }
}
/* Writes a timestamped backup into the chosen folder and prunes old ones, keeping the most
   recent 20 — enough history to recover from a bad day without the folder growing forever. */
async function runAutoBackupNow(force){
  if(!AUTOBACKUP_SUPPORTED || !autoBackupDirHandle) return;
  try{
    const payload = buildFullBackupPayload();
    const json = JSON.stringify(payload);
    // skip the write entirely if nothing has changed since the last successful backup
    let hash = 0; for(let i=0;i<json.length;i++){ hash = (hash*31 + json.charCodeAt(i)) | 0; }
    if(!force && String(hash)===autoBackupLastHash) return;
    const stamp = new Date().toISOString().replace(/[:.]/g,'-');
    const fh = await autoBackupDirHandle.getFileHandle('gsms_autobackup_'+stamp+'.json', {create:true});
    const writable = await fh.createWritable();
    await writable.write(json);
    await writable.close();
    autoBackupLastHash = String(hash);
    autoBackupLastAt = Date.now();
    autoBackupLastError = '';
    // prune: keep newest 20 gsms_autobackup_*.json files in the folder
    const names = [];
    for await (const [name] of autoBackupDirHandle.entries()){
      if(/^gsms_autobackup_.*\\.json$/.test(name)) names.push(name);
    }
    names.sort(); // ISO-ish timestamp in the name sorts chronologically as a plain string
    const toDelete = names.slice(0, Math.max(0, names.length-20));
    for(const n of toDelete){ try{ await autoBackupDirHandle.removeEntry(n); }catch(e){ /* not fatal */ } }
  }catch(e){
    autoBackupLastError = String(e && e.message || e);
    // permission can be silently revoked by the OS/browser between sessions — surface it in
    // Settings rather than retrying forever in the background
  }
}

async function importAll(input){
  const file = input.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = async ()=>{
    try{
      const data = JSON.parse(reader.result);
      const ok = await confirmDialog('Restore full backup?', 'This replaces all current data (visitors, staff, attendance, settings) with the contents of this file.', 'Restore', true);
      if(!ok){ input.value=''; return; }
      const ok2 = await askKey('admin');
      if(!ok2){ input.value=''; return; }
      if(data.settings) DB.set('settings', Object.assign({}, defaultSettings(), data.settings));
      if(data.visitors) DB.set('visitors', data.visitors);
      if(data.staff) DB.set('staff', data.staff);
      if(data.staffAttendance) DB.set('staffAttendance', data.staffAttendance);
      if(data.counters) DB.set('counters', data.counters);
      if(data.auditLog) DB.set('auditLog', data.auditLog);
      logAudit('Backup restored', '', 'Admin');
      toast('Backup restored.', 'ok');
      renderRoute();
    }catch(e){ toast('Invalid backup file.','err'); }
  };
  reader.readAsText(file);
}

function updateRoleChip(){
  const dot = document.getElementById('roleDot'), lbl = document.getElementById('roleLabel');
  if(!dot||!lbl) return;
  const admin = adminUnlocked || sessionRole==='admin';
  dot.classList.toggle('on', admin);
  const roleLabels = {admin:'Admin mode', security:'Security mode', staffAdd:'Add Staff mode'};
  const mode = admin ? 'Admin unlocked' : (roleLabels[sessionRole] || 'Locked');
  /* Name the officer on shift, so anyone glancing at the screen can see whose badges are
     being issued right now without opening the audit log. */
  lbl.textContent = sessionOfficerName ? (sessionOfficerName+' \u00b7 '+mode) : mode;
}

/* ---------------------------- APP LOCK SCREEN ----------------------------------
   The whole app is gated behind a security code at launch. Any of the three codes
   (Security, Add Staff, or Admin) will unlock it; which one was used just sets the
   role shown in the sidebar chip \u2014 per-action overrides (checkout, settings, etc.)
   still ask for their own code as before. */
let sessionUnlocked = false;
let sessionRole = null; // 'admin' | 'security' | 'staffAdd'
/* Identity of the officer currently on shift. Captured at sign-in, held for the session only
   (never persisted \u2014 a new shift signs in fresh). The name is printed on every badge issued
   this session as "Issued by"; the phone is deliberately NOT on the badge (it's staff contact
   detail, not visitor-facing) but is written into every audit entry so a gate decision can be
   traced back to a reachable person. */
let sessionOfficerName = '';
let sessionOfficerPhone = '';
function attemptUnlock(){
  const nameEl = document.getElementById('lockOfficerName');
  const phoneEl = document.getElementById('lockOfficerPhone');
  const input = document.getElementById('lockCodeInput');
  const errEl = document.getElementById('lockErr');
  const oName = (nameEl.value||'').trim();
  const oPhone = (phoneEl.value||'').trim();
  /* Identity is required, but it is NOT a security control \u2014 it never gates access and is not
     checked against anything. It exists so the audit trail names a person. The code alone still
     decides the role. */
  if(!oName){ errEl.textContent='Enter your name to sign in.'; errEl.style.display='block'; nameEl.focus(); return; }
  if(normPhone(oPhone).length<7){ errEl.textContent='Enter a valid phone number to sign in.'; errEl.style.display='block'; phoneEl.focus(); return; }
  const val = input.value;
  const settings = S();
  let role = null;
  if(val===settings.adminKey) role='admin';
  else if(val===settings.securityKey) role='security';
  else if(val===settings.staffAddKey) role='staffAdd';
  if(role){
    sessionUnlocked = true;
    sessionRole = role;
    sessionOfficerName = oName;
    sessionOfficerPhone = oPhone;
    document.getElementById('lockScreen').classList.add('hidden');
    errEl.style.display='none';
    input.value='';
    logAudit('Gate system signed in', '', role==='admin'?'Admin':role==='staffAdd'?'Add Staff':'Security');
    updateRoleChip();
    setTimeout(checkOverdueAlerts, 800);
  } else {
    errEl.textContent='Incorrect code. Try again.';
    errEl.style.display='block';
    input.value='';
    input.focus();
  }
}
/* Lock = same officer stepping away; the name/phone stay filled so they can resume in one tap. */
function lockApp(){
  sessionUnlocked = false;
  sessionRole = null;
  adminUnlocked = false;
  const lock = document.getElementById('lockScreen');
  lock.classList.remove('hidden');
  const errEl = document.getElementById('lockErr');
  if(errEl) errEl.style.display='none';
  updateRoleChip();
  setTimeout(()=>{ const i=document.getElementById('lockCodeInput'); if(i) i.focus(); }, 60);
}
/* Sign out = end of shift / handover. Clears the officer identity too, so the next person
   cannot issue badges under the previous officer's name without re-entering their own. */
async function signOut(){
  const ok = await confirmDialog('Sign out', 'End this shift and clear the officer name and phone? The next officer will need to sign in with their own details.', 'Sign Out');
  if(!ok) return;
  const who = sessionOfficerName;
  logAudit('Gate system signed out'+(who?(' \u2014 '+who):''), '', sessionRole==='admin'?'Admin':sessionRole==='staffAdd'?'Add Staff':'Security');
  sessionOfficerName = '';
  sessionOfficerPhone = '';
  const n = document.getElementById('lockOfficerName'); if(n) n.value='';
  const p = document.getElementById('lockOfficerPhone'); if(p) p.value='';
  lockApp();
  setTimeout(()=>{ const i=document.getElementById('lockOfficerName'); if(i) i.focus(); }, 60);
}

/* Verify storage actually works BEFORE the officer starts a shift, rather than letting them
   register visitors all morning into a void and discover it on reload. Writes and reads back a
   throwaway key. */
function checkStorageHealthOnStartup(){
  let ok = false, err = null;
  try{
    const probe = 'gsms_probe_'+Date.now();
    localStorage.setItem(probe, 'x');
    ok = localStorage.getItem(probe)==='x';
    localStorage.removeItem(probe);
  }catch(e){ err = e; ok = false; }
  if(!ok){ setTimeout(()=> showStorageUnavailableModal(err||'storage read-back failed'), 400); return; }
  // Storage works, but warn before it becomes a mid-shift emergency.
  const u = DB.usage();
  if(u.total > 3.5*1024*1024){
    setTimeout(()=> toast('Storage is filling up ('+fmtBytes(u.total)+' used). Export a backup and clear old records soon.', 'err'), 900);
  }
}

/* Photos must be loaded into the in-memory cache BEFORE the very first render, because
   rec.facePhoto/etc. are read synchronously everywhere (badges, tables, lookup popups) - none
   of those functions await a promise. This adds a normally-imperceptible delay (a local
   IndexedDB open + read) before the first paint, in exchange for photos never needing every
   render function in this file to be rewritten as async. */
(async function boot(){
  await loadAllPhotosFromIdb();
  if(!location.hash) location.hash = '#dashboard';
  renderRoute();
  checkStorageHealthOnStartup();
  restoreAutoBackupFolder();
  setTimeout(()=>{ const i=document.getElementById('lockCodeInput'); if(i) i.focus(); }, 60);
  setInterval(checkOverdueAlerts, 30000);
  setInterval(checkPresenceAlerts, 60000); // hourly "still on site" awareness check
  setInterval(()=>{ if(sessionUnlocked) runAutoBackupNow(false); }, 3*60000); // auto-backup: check every 3 min, only writes if data actually changed
})();
</script>
