<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MSR Gate Security</title>
<meta name="theme-color" content="#0A2A43">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0A2340;
  --navy-2:#123258;
  --navy-deep:#071A2E;
  --ink:#101418;
  --paper:#F6F7F9;
  --card:#FFFFFF;
  --line:#E3E6EA;
  --muted:#68727E;
  --gold:#C6A15B;
  --green:#1E8E5A;
  --amber:#B9791E;
  --red:#C23B3B;
  --gray:#8A93A0;
  --radius:16px;
  --radius-sm:10px;
  --shadow:0 1px 2px rgba(10,35,64,.05), 0 10px 28px -14px rgba(10,35,64,.2);
  --font: -apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --font-cond: "Arial Narrow","Helvetica Neue Condensed",var(--font);
  --font-logo: "Big Shoulders Display",var(--font-cond);
  --mono: "SF Mono",ui-monospace,"Menlo","Consolas",monospace;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; font-family:var(--font); background:var(--paper); color:var(--ink);
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  font-size:clamp(14px,1.4vw,16px);
}
button,input,select,textarea{font-family:inherit; font-size:inherit;}
input,select,textarea{
  border:1px solid var(--line); border-radius:var(--radius-sm); padding:.68em .85em;
  background:#fff; color:var(--ink); width:100%; outline:none; transition:border-color .15s, box-shadow .15s;
}
input:focus,select:focus,textarea:focus{border-color:var(--navy-2); box-shadow:0 0 0 3px rgba(10,35,64,.12);}
label{display:block; font-size:.8em; font-weight:600; color:var(--muted); margin:0 0 .35em 2px; letter-spacing:.01em;}
.field{margin-bottom:1em;}
.hint{font-size:.78em; color:var(--muted); margin-top:.3em;}
button{cursor:pointer; border:none; border-radius:var(--radius-sm); font-weight:600; letter-spacing:.01em; display:inline-flex; align-items:center; justify-content:center; gap:.5em;}
.btn{padding:.7em 1.2em; background:#fff; border:1px solid var(--line); color:var(--ink); transition:.15s;}
.btn:hover{border-color:var(--navy-2); background:#fbfbfc;}
.btn:active{transform:scale(.98);}
.btn-primary{background:var(--navy); color:#fff; border:1px solid var(--navy);}
.btn-primary:hover{background:var(--navy-2); border-color:var(--navy-2);}
.btn-gold{background:var(--gold); color:#2b210c; border:1px solid var(--gold);}
.btn-danger{background:#fff; color:var(--red); border:1px solid #eecccc;}
.btn-danger:hover{background:#fdf2f2;}
.btn-ghost{background:transparent; border:1px solid transparent; color:var(--muted);}
.btn-ghost:hover{background:#eef0f3;}
.btn-block{width:100%;}
.btn-sm{padding:.4em .8em; font-size:.82em; border-radius:9px;}
.btn-lg{padding:.95em 1.4em; font-size:1.02em; border-radius:13px;}
.row{display:flex; gap:.6em; flex-wrap:wrap;}
.row > *{flex:1;}
.spacer{flex:1;}

/* App shell */
#app{display:flex; min-height:100vh;}
#sidebar{
  width:236px; flex:none; background:linear-gradient(180deg,var(--navy) 0%, var(--navy-deep) 100%);
  color:#fff; display:flex; flex-direction:column; position:sticky; top:0; height:100vh; z-index:40;
}
.brand{display:flex; align-items:center; gap:.6em; padding:1.5em 1.2em 1.2em; border-bottom:1px solid rgba(255,255,255,.08);}
.brand-text{line-height:1.15;}
nav.tabs{padding:.8em .7em; display:flex; flex-direction:column; gap:.15em; overflow-y:auto; flex:1;}
nav.tabs .navbtn{
  display:flex; align-items:center; gap:.7em; padding:.65em .8em; border-radius:10px; color:rgba(255,255,255,.75);
  background:transparent; text-align:left; font-weight:600; font-size:.92em;
}
nav.tabs .navbtn:hover{background:rgba(255,255,255,.06); color:#fff;}
nav.tabs .navbtn.active{background:rgba(255,255,255,.12); color:#fff; box-shadow:inset 3px 0 0 var(--gold);}
nav.tabs .navbtn .ico{width:18px; text-align:center; opacity:.9;}
.sidebar-foot{padding:.9em 1.1em 1.1em; border-top:1px solid rgba(255,255,255,.08); font-size:.7em; color:rgba(255,255,255,.4);}
.role-chip{display:inline-flex; align-items:center; gap:.4em; font-size:.72em; padding:.3em .6em; border-radius:20px; background:rgba(255,255,255,.08); color:#fff; margin:.6em 1.1em 0;}
.role-dot{width:7px;height:7px;border-radius:50%;background:var(--gray);}
.role-dot.on{background:var(--green);}

#main{flex:1; min-width:0; display:flex; flex-direction:column;}
#topbar{
  position:sticky; top:0; z-index:30; background:rgba(246,247,249,.85); backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line); padding:.85em 1.4em; display:flex; align-items:center; gap:.8em;
}
#hamburger{display:none;}
.page-title{font-weight:800; font-size:1.25em; letter-spacing:-.01em;}
.topbar-search{max-width:340px; flex:1;}
#content{padding:1.4em; flex:1;}

.card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow);}
.card-pad{padding:1.2em 1.3em;}
.section-title{font-weight:800; font-size:1.05em; margin:0 0 .8em; letter-spacing:-.01em; display:flex; align-items:center; gap:.5em;}
.grid{display:grid; gap:1em;}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}
@media(max-width:1000px){.grid-4{grid-template-columns:repeat(2,1fr);} .grid-3{grid-template-columns:repeat(2,1fr);}}
@media(max-width:640px){.grid-4,.grid-3,.grid-2{grid-template-columns:1fr;}}

.stat{padding:1.1em 1.2em; border-radius:var(--radius); background:var(--card); border:1px solid var(--line); box-shadow:var(--shadow); position:relative; overflow:hidden;}
.stat .num{font-size:1.9em; font-weight:800; letter-spacing:-.02em; font-family:var(--font-cond);}
.stat .lbl{font-size:.78em; color:var(--muted); font-weight:600; margin-top:.15em;}
.stat .accent{position:absolute; left:0; top:0; bottom:0; width:4px;}
.acc-navy{background:var(--navy);} .acc-green{background:var(--green);} .acc-amber{background:var(--amber);} .acc-red{background:var(--red);} .acc-gold{background:var(--gold);}

table{width:100%; border-collapse:collapse; font-size:.88em;}
th{text-align:left; font-size:.72em; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); padding:.6em .7em; border-bottom:1px solid var(--line); white-space:nowrap;}
td{padding:.62em .7em; border-bottom:1px solid #EEF0F2; vertical-align:middle;}
tr:last-child td{border-bottom:none;}
.table-wrap{overflow-x:auto; -webkit-overflow-scrolling:touch;}
.badge-pill{display:inline-flex; align-items:center; gap:.4em; padding:.28em .65em; border-radius:20px; font-size:.76em; font-weight:700;}
.pill-green{background:#E6F5EC; color:var(--green);}
.pill-amber{background:#FCF1DF; color:var(--amber);}
.pill-red{background:#FBEAEA; color:var(--red);}
.pill-gray{background:#EEF0F3; color:var(--gray);}
.dot{width:8px;height:8px;border-radius:50%;}
.dot-green{background:var(--green);} .dot-amber{background:var(--amber);} .dot-red{background:var(--red);} .dot-gray{background:var(--gray);}

.empty{padding:2.5em 1em; text-align:center; color:var(--muted);}
.empty .big{font-size:2em; margin-bottom:.2em;}

/* Modal */
.modal-backdrop{position:fixed; inset:0; background:rgba(7,26,46,.45); backdrop-filter:blur(2px); z-index:100; display:flex; align-items:flex-start; justify-content:center; padding:3vh 1em; overflow-y:auto;}
.modal{background:#fff; border-radius:18px; width:100%; max-width:640px; box-shadow:0 20px 60px rgba(0,0,0,.3); animation:pop .18s ease; margin-bottom:3vh;}
.modal.wide{max-width:880px;}
.modal.narrow{max-width:420px;}
@keyframes pop{from{opacity:0; transform:translateY(8px) scale(.98);} to{opacity:1; transform:none;}}
.modal-head{display:flex; align-items:center; justify-content:space-between; padding:1.1em 1.3em; border-bottom:1px solid var(--line);}
.modal-head h3{margin:0; font-size:1.08em; font-weight:800;}
.modal-body{padding:1.2em 1.3em; max-height:72vh; overflow-y:auto;}
.modal-foot{display:flex; gap:.6em; padding:1em 1.3em; border-top:1px solid var(--line); justify-content:flex-end;}
.close-x{background:transparent; border:none; font-size:1.3em; color:var(--muted); padding:.1em .4em; border-radius:8px;}
.close-x:hover{background:#f0f1f3;}

.steps{display:flex; gap:.4em; margin-bottom:1.2em;}
.step{flex:1; height:5px; border-radius:4px; background:var(--line);}
.step.on{background:var(--navy);}

.capture-box{aspect-ratio:4/3; background:#0d1b2a; border-radius:12px; overflow:hidden; position:relative; display:flex; align-items:center; justify-content:center;}
.capture-box video{width:100%; height:100%; object-fit:cover;}
.capture-box img{width:100%; height:100%; object-fit:contain; background:#0d1b2a;}
.capture-box .ph{color:rgba(255,255,255,.4); font-size:.85em;}

.chip-toggle{display:inline-flex; align-items:center; gap:.5em; padding:.55em .8em; border:1px solid var(--line); border-radius:10px; cursor:pointer; font-size:.88em; font-weight:600; user-select:none;}
.chip-grid{display:flex; flex-wrap:wrap; gap:.5em; grid-column:1/-1;}
.chip-toggle input{width:auto; margin:0;}

/* Badge front \u2014 clean, print-safe monochrome (no color; prints clean in B&W, minimal ink:
   unfilled white card, black rules and black text only \u2014 no solid fills anywhere). */
/* Portrait CR80 card, 2.125in x 3.375in (54mm x 85.6mm), square corners (no border-radius). */
/* Fixed CR80 size, height:LOCKED (not min-height) \u2014 this must print at exactly 54mm x 85.6mm
   on real pre-cut CR80 card stock, so the card itself can never grow. overflow:hidden is a
   backstop only: scaleBadgeToFit() (see JS) measures the actual content height after render and
   shrinks font-size proportionally (everything below is sized in em off this element) whenever a
   record's content would otherwise be taller than the fixed card, so long names/notes/fields
   shrink to fit instead of silently clipping. */
.badge-card{
  width:54mm; height:85.6mm; flex:none; box-sizing:border-box; font-size:2.65mm;
  border-radius:0; background:#fff; border:1.4px solid #000; box-shadow:var(--shadow);
  font-family:var(--font); position:relative; color:#000;
  display:flex; flex-direction:column; overflow:hidden;
}
/* Top strip \u2014 small wordmark left, a plain outlined (unfilled) kind chip right, one rule
   underneath. The V/S-at-a-glance job belongs to the back panel's giant letter; the front only
   needs to say the word once, clearly. Full company name lives on the back panel only. */
.bdg-top{display:flex; align-items:center; justify-content:space-between; gap:.5em; padding:.38em .6em; flex:0 0 auto; border-bottom:1.4px solid #000;}
.bdg-org{font-family:var(--font-logo); font-weight:800; letter-spacing:.02em; font-size:1.05em; line-height:1; display:flex; align-items:baseline; gap:.14em; color:#000;}
.bdg-kind{font-weight:800; font-size:.55em; letter-spacing:.1em; line-height:1; color:#000; border:1.1px solid #000; border-radius:20px; padding:.3em .6em;}
/* Stamp-size photo \u2014 fixed small footprint, but object-fit:contain on a white backdrop
   guarantees the WHOLE photo is always visible, never cropped/cut off on any side. */
.bdg-photo{
  width:22mm; height:27mm; margin:1.8mm auto 0; flex:0 0 auto;
  background:#fff; border:1px solid #000; display:flex; align-items:center; justify-content:center; overflow:hidden;
}
.bdg-photo img{max-width:100%; max-height:100%; width:auto; height:auto; object-fit:contain; display:block; filter:grayscale(1) contrast(1.05);}
.bdg-photo .no-photo{color:#9aa4b0; font-size:.62em; text-align:center; padding:0 2mm;}
/* Name is the largest thing on the card after the NID \u2014 this is a "who is this person" check
   first, so it gets read before anything else. */
.bdg-name{flex:0 0 auto; font-weight:800; font-size:1.22em; letter-spacing:-.01em; color:#000; line-height:1.16; text-align:center; padding:.45em .55em 0; white-space:normal; overflow-wrap:break-word;}
.bdg-sub{flex:0 0 auto; font-size:.72em; font-weight:600; color:#333; margin-top:.12em; padding:0 .55em; text-align:center; white-space:normal; overflow-wrap:break-word;}
/* Single-column field list \u2014 one row per fact, clearly separated, instead of a dense packed
   grid. Every label is visibly smaller and greyer than its value so the eye separates "what this
   is" from "what it says" at a glance. Short facts sit label-left / value-right on one line;
   Area Access and Notes (genuinely variable-length) stack label-above-value and are free to wrap
   \u2014 never squeezed into a column that clips them. */
.bdg-fields{flex:1 1 auto; min-width:0; min-height:0; overflow:hidden; padding:.5em .6em .15em; display:flex; flex-direction:column; gap:.3em;}
.bdg-row{display:flex; align-items:baseline; gap:.5em;}
.bdg-row .l{flex:0 0 auto; font-size:.56em; letter-spacing:.02em; color:#555; font-weight:700; white-space:nowrap;}
.bdg-row .v{flex:1 1 auto; min-width:0; font-size:.74em; color:#000; font-weight:700; line-height:1.16; text-align:right; white-space:normal; overflow-wrap:break-word; word-break:break-word;}
.bdg-block{display:flex; flex-direction:column; gap:.14em;}
.bdg-block .l{font-size:.56em; letter-spacing:.02em; color:#555; font-weight:700;}
.bdg-block .v{font-size:.74em; color:#000; font-weight:600; line-height:1.25; white-space:normal; overflow-wrap:break-word; word-break:break-word;}
/* Free-text notes can be any length. On the card the value is clamped to 2 lines so one rambling
   entry can't push the card meaningfully taller; the untruncated text is always on the record
   slip, the info popups and every export. */
.bdg-block .v.bdg-clamp{display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
/* Big, centered ID block replacing the old QR code \u2014 the NID number IS the person's ID
   number; security reads it (or the gate clerk types it) instead of scanning anything. The
   largest element on the card, since it's the one thing actually read on every single check. */
.bdg-id{flex:0 0 auto; border-top:1.4px solid #000; border-bottom:1.4px solid #000; background:#fff; text-align:center; padding:.42em .3em;}
.bdg-id .l{font-size:.52em; letter-spacing:.15em; color:#000; font-weight:800;}
.bdg-id .v{font-size:1.3em; font-weight:800; letter-spacing:.02em; color:#000; font-family:var(--mono); word-break:break-all; margin-top:.1em; line-height:1.15;}
.bdg-foot{background:#fff; color:#000; text-align:center; font-size:.58em; font-weight:700; padding:.28em .3em; letter-spacing:.02em; flex:0 0 auto; line-height:1.3;}
/* Who issued this badge. Deliberately the smallest, lightest text on the card \u2014 it's for
   accountability after the fact, not something the gate needs to read at a glance. Name only;
   the officer's phone stays in the audit log and never goes on a visitor-held card. */
.bdg-issuer{font-weight:600; color:#444; font-size:.86em; letter-spacing:0;}

/* Fold-over badge pair \u2014 front (buildBadgeHtml) + back (buildBadgeBackHtml) side by side,
   touching at the center fold seam. Both panels print normally (no rotation, no mirroring) since
   they land on the same side of the same sheet of paper \u2014 the fold seam is just a visual guide
   for where to fold, not a print-orientation flip. Card size is fixed on both sides (never grows). */
.badge-pair{display:flex; align-items:flex-start; justify-content:center;}
.fold-seam{width:0; flex:none; align-self:stretch; position:relative; border-left:1px dashed #999;}
.fold-seam .fold-tag{position:absolute; top:-3.4mm; left:50%; transform:translateX(-50%); background:#fff; font-size:6pt; color:#777; white-space:nowrap; padding:0 1mm;}
.badge-back{
  height:85.6mm; flex:none; box-sizing:border-box;
  border-radius:0; background:#fff; border:1.4px solid #000; box-shadow:var(--shadow);
  font-family:var(--font-cond); color:#000;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3mm;
  padding:4mm 3mm; overflow:hidden;
}
.badge-back .bb-letter{font-weight:900; font-size:34mm; line-height:1; font-family:var(--font-logo);}
.badge-back .bb-word{font-weight:800; font-size:7mm; letter-spacing:.14em;}
.badge-back .bb-company{font-weight:700; font-size:4mm; text-align:center; letter-spacing:.02em;}
.badge-back .bb-hotline{font-size:3mm; color:#333; text-align:center;}

/* Print sheet \u2014 a front|back pair is ~108mm wide, nearly the full printable A4 width, so only
   one column fits. Each printed record (badge pair + cut line + stub) is one self-contained
   block; records stack down the page rather than grouping all badges then all stubs. */
#printArea{display:none;}
@media print{
  html, body{margin:0; padding:0; height:auto; background:#fff !important;}
  /* Removing the rest of the app from layout flow entirely (not just visibility:hidden) is what
     stops stray blank pages \u2014 an invisible-but-still-in-flow #app of dashboard/table height was
     previously inflating the printed page count. */
  #lockScreen, #app, #toastHost, #modalHost{display:none !important;}
  #printArea{display:block !important; position:static; width:100%; margin:0; padding:0;}
  *{ -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  @page{size:A4; margin:10mm;} /* 1cm fallback; JS overwrites this per-job from Settings > Printing */
  /* INK SAVER: nothing in a print job carries a background fill. Every printed surface is bare
     white paper with black rules and black text. Photos are <img> elements, so they are untouched. */
  #printArea, #printArea *{background:transparent !important; box-shadow:none !important;}
  #printArea .badge-card, #printArea .badge-back{background:#fff !important;}
  /* position:fixed repeats on every printed sheet in Chrome/Firefox/Edge, so the credit +
     source line lands at the foot of every page of every print job. */
  #printFootLine{display:block !important; position:fixed; left:0; right:0; bottom:0;
    font-family:var(--font-cond); font-size:7.5pt; color:#000; text-align:center;
    padding-top:1mm; border-top:.4pt solid #000; background:#fff !important;}
  #printArea{padding-bottom:9mm; padding-top:2mm;}
  /* Badges must never start a print job partway down a page or get their dashed cut-outline
     sliced by the page edge \u2014 keep every badge block whole and pinned clear of the boundary. */
  .record-block, .badge-card, .badge-back, .badge-pair{break-inside:avoid; page-break-inside:avoid;}
  .record-block:first-child{break-before:avoid; page-break-before:avoid;}
}
#printFootLine{display:none;}
.sheet{display:flex; flex-direction:column; align-items:center; gap:7mm;}
.record-block{width:100%; max-width:100%; break-inside:avoid;}
.sheet .badge-card{outline:.2mm dashed #999; outline-offset:2mm;}
.sheet .badge-back{outline:.2mm dashed #999; outline-offset:2mm;}
.hist-print-table{width:100%; max-width:100%; border-collapse:collapse; font-size:9pt; table-layout:auto;}
/* Report tables (Daily Visitor / Staff Attendance): a compact primary row that always has enough
   room to stay on one line (short, fixed-format fields only — ID, name, times, category), plus a
   details row underneath holding everything else as wrapping label:value prose. This replaced a
   single 16-18 column table that, even with table-layout:auto, had nowhere near enough page width
   to go around — the browser shrank every column including short numeric ones until IDs and NIDs
   were wrapping one digit per line. */
.report-table td, .report-table th{white-space:normal; overflow-wrap:break-word;}
.report-table > tbody > tr:not(.report-detail-row) > td{border-bottom:none; padding-bottom:.2em;}
.report-detail-row > td{border-top:none; padding-top:0; padding-bottom:.6em;}
.report-detail{font-size:.82em; color:#444; line-height:1.6;}
.report-detail .rd-item{display:inline-block; margin-right:1.4em; white-space:nowrap;}
.report-detail .rd-item b{color:#000; font-weight:700;}
@media print{
  .report-detail .rd-item{white-space:normal;} /* on paper, let long values wrap rather than overflow the margin */
}
.hist-print-table th, .hist-print-table td{border:.3pt solid #999; padding:3pt 5pt; word-break:break-word; overflow-wrap:anywhere;}
.hist-print-table thead{display:table-header-group;}
.hist-print-table tr{break-inside:avoid;}

/* Visitor cut-and-keep stub \u2014 the NID photocopy is pasted under/behind this slip and filed by security */
.visitor-stub{width:100%; max-width:100%; margin:6mm auto 0; font-family:var(--font-cond); color:#000;}
.stub-fit-outer{overflow:hidden;}
.stub-fit-inner{width:100%;}
.stub-cutline{display:flex; align-items:center; gap:.5em; font-size:9pt; color:#666; margin-bottom:3mm; white-space:nowrap; overflow:hidden;}
.stub-cutline .dash{flex:1; border-top:1px dashed #999;}
.stub-box{border:1.2px solid #000; padding:4mm 5mm;}
.stub-title{font-weight:800; font-size:11pt; letter-spacing:.02em; margin-bottom:2.5mm; display:flex; justify-content:space-between; align-items:baseline;}
.stub-title span{font-weight:600; font-size:.7em; color:#444;}
.stub-table{width:100%; border-collapse:collapse; font-size:9.5pt;}
.stub-table td{padding:1.6mm 2mm; border:.3pt solid #ccc; vertical-align:top;}
.stub-table td.k{width:26mm; font-weight:700; color:#000; background:#fff;}
.stub-note{margin-top:2.5mm; font-size:8.5pt; color:#444; font-style:italic;}
.sessions-block{margin-top:1em;}
.sessions-title{font-weight:700; font-size:.85em; margin-bottom:.35em;}
.sessions-table{width:100%; border-collapse:collapse; font-size:.85em;}
.sessions-table th, .sessions-table td{padding:.3em .5em; border:.5px solid #ccc; text-align:left;}
.sessions-table th{background:#f4f5f7; font-weight:700;}
.visitor-stub .sessions-block{margin-top:3mm;}
.visitor-stub .sessions-title{font-size:9.5pt;}
.visitor-stub .sessions-table{font-size:8.5pt;}
.visitor-stub .sessions-table th, .visitor-stub .sessions-table td{padding:1mm 1.6mm; border:.3pt solid #ccc;}
.nid-stub-imgs{display:grid; grid-template-columns:1fr 1fr; gap:4mm; margin-top:3mm;}
.nid-stub-img-wrap{width:100%;}

<script>
/* =========================================================================
   MSR GATE SECURITY MANAGEMENT SYSTEM
   Single-file, offline-first, vanilla JS. Data lives in localStorage only.
   ========================================================================= */

/* Bump this when a future update changes how data is stored, so the app (or a human) can
   tell which shape a given backup file or browser's localStorage is in. Backups always
   record the version they were exported from; nothing currently branches on it, but it's
   here so an upgrade never has to guess. */
const APP_DATA_VERSION = 1;

/* ---------------------------- PHOTO STORE (IndexedDB) ----------------------------------------
   Photos used to be stored as base64 strings directly inside the visitor/staff records that
   live in localStorage, which has a hard ~5-10MB quota shared by EVERYTHING the app saves. A
   handful of photos could fill that entirely and silently break every save (visitors, staff,
   attendance, audit log alike).
   IndexedDB has a much larger quota (typically hundreds of MB or more, tied to disk space) and
   is built for exactly this kind of larger binary/blob data. So now: the actual photo bytes live
   in IndexedDB, and localStorage only ever holds a short reference key in their place (e.g.
   "@idbph:kx3f2a1_0"). This swap happens transparently inside DB.get()/DB.set() below, so every
   other function in this app that reads rec.facePhoto/rec.photo/etc. and expects a ready-to-use
   image value keeps working completely unchanged.
   Everything here is still 100% local to this device/browser - IndexedDB is a standard built-in
   browser API, not a network service, so nothing about where data lives or who can reach it
   changes; there's just far more room for it. */
const PHOTO_FIELDS = ['facePhoto','frontPhoto','backPhoto','photo','nidFrontPhoto','nidBackPhoto'];
const PHOTO_REF_PREFIX = '@idbph:';
let photoCache = {};                 // refKey -> data URL, preloaded once at startup
let dataUrlToRefKey = new Map();     // reverse index so re-saving an unchanged photo reuses its
                                      // existing key instead of writing a fresh duplicate every time
let photoDbAvailable = false;        // set once, during startup, before any real save can happen
let __photoDbWarned = false;
let __photoIdbOpenPromise = null;
function openPhotoDB(){
  if(__photoIdbOpenPromise) return __photoIdbOpenPromise;
  __photoIdbOpenPromise = new Promise((resolve)=>{
    if(!('indexedDB' in window)){ resolve(null); return; }
    try{
      const req = indexedDB.open('gsms_photos', 1);
      req.onupgradeneeded = ()=>{ req.result.createObjectStore('photos'); };
      req.onsuccess = ()=> resolve(req.result);
      req.onerror = ()=> resolve(null);
    }catch(e){ resolve(null); }
  });
  return __photoIdbOpenPromise;
}
/* Loads every stored photo into the in-memory cache once, at startup, so every later read
   (rendering a badge, a table thumbnail, a lookup popup) stays perfectly synchronous - none of
   this app's render functions were written to await a promise, so photos must already be in
   memory before renderRoute() first runs. Called from the startup sequence below, gated ahead
   of the first render. */
async function loadAllPhotosFromIdb(){
  const db = await openPhotoDB();
  photoDbAvailable = !!db;
  if(!db) return;
  await new Promise((resolve)=>{
    try{
      const store = db.transaction('photos','readonly').objectStore('photos');
      const req = store.openCursor();
      req.onsuccess = (e)=>{
        const cursor = e.target.result;
        if(cursor){ photoCache[cursor.key] = cursor.value; dataUrlToRefKey.set(cursor.value, cursor.key); cursor.continue(); }
        else resolve();
      };
      req.onerror = ()=> resolve();
    }catch(e){ resolve(); }
  });
}
/* Fire-and-forget write: the in-memory cache updates immediately (so the very next render sees
   it), and the bytes are pushed to IndexedDB in the background. If that background write ever
   fails, the photo is still safe for this session (it's in photoCache) and the user gets a
   one-time warning to export a backup, rather than a silent loss. */
function putPhotoIdb(refKey, dataUrl){
  photoCache[refKey] = dataUrl;
  dataUrlToRefKey.set(dataUrl, refKey);
  openPhotoDB().then(db=>{
    if(!db) return;
    try{
      const tx = db.transaction('photos','readwrite');
      tx.objectStore('photos').put(dataUrl, refKey);
      tx.onerror = ()=> warnPhotoDbFailure();
    }catch(e){ warnPhotoDbFailure(); }
  });
}
function warnPhotoDbFailure(){
  if(__photoDbWarned) return;
  __photoDbWarned = true;
  try{ toast('Photo storage had a problem saving in the background. Export a backup soon to be safe.', 'err'); }catch(e){}
}
let __photoRefSeq = 0;
function newPhotoRefKey(){ return PHOTO_REF_PREFIX + Date.now().toString(36) + '_' + (__photoRefSeq++); }
/* Called just before a visitors/staff array is written to localStorage. Any record field that
   is still a raw "data:image/..." string gets moved into IndexedDB and swapped for a short
   reference key. Identical photo content (e.g. an unchanged photo re-saved because some other
   field on the record changed) reuses its existing key via dataUrlToRefKey, so this never grows
   without bound just from ordinary re-saves. If IndexedDB isn't available in this browser at
   all, this is skipped entirely and records keep their photos inline exactly as before - no
   regression for that (rare) case. */
function offloadPhotosForStorage(list){
  if(!photoDbAvailable || !Array.isArray(list)) return list;
  return list.map(rec=>{
    if(!rec || typeof rec!=='object') return rec;
    let changed = false, copy = rec;
    for(const f of PHOTO_FIELDS){
      const v = rec[f];
      if(typeof v==='string' && v.indexOf('data:')===0){
        if(!changed){ copy = {...rec}; changed = true; }
        let refKey = dataUrlToRefKey.get(v);
        if(!refKey){ refKey = newPhotoRefKey(); putPhotoIdb(refKey, v); }
        copy[f] = refKey;
      }
    }
    return copy;
  });
}
/* Called just after a visitors/staff array is read back from localStorage. Any reference key
   gets swapped back for the real data URL from the in-memory cache, so every existing render
   function - which all expect rec.facePhoto etc. to already be a usable <img src> value -
   keeps working completely unchanged. */
function rehydratePhotosFromStorage(list){
  if(!Array.isArray(list)) return list;
  return list.map(rec=>{
    if(!rec || typeof rec!=='object') return rec;
    let changed = false, copy = rec;
    for(const f of PHOTO_FIELDS){
      const v = rec[f];
      if(typeof v==='string' && v.indexOf(PHOTO_REF_PREFIX)===0){
        if(!changed){ copy = {...rec}; changed = true; }
        copy[f] = photoCache[v] || ''; // '' only if the cache genuinely has no such photo
      }
    }
    return copy;
  });
}
/* Wipes every stored photo. Used by "Clear all data" so that action actually frees everything
   it promises to, not just the localStorage portion. */
async function clearAllPhotosIdb(){
  photoCache = {};
  dataUrlToRefKey = new Map();
  const db = await openPhotoDB();
  if(!db) return;
  try{ db.transaction('photos','readwrite').objectStore('photos').clear(); }catch(e){}
}
/* Rough total size (bytes) of everything currently held in the photo cache, for diagnostics. */
function photoStoreUsageEstimate(){
  let total = 0;
  for(const k in photoCache){ const v = photoCache[k]; if(typeof v==='string') total += v.length; }
  return total;
}

/* ---------------------------- DB LAYER ---------------------------------- */
const DB = {
  get(key, fallback){
    try{
      const v = localStorage.getItem('gsms_'+key);
      if(v===null) return fallback;
      const parsed = JSON.parse(v);
      return (key==='visitors' || key==='staff') ? rehydratePhotosFromStorage(parsed) : parsed;
    }
    catch(e){ return fallback; }
  },
  /* A failed write used to just toast and return false, and EVERY caller ignored the return
     value - so a full or unavailable localStorage looked exactly like a successful save until
     the user reloaded and found their work gone ("nothing saves"). Now a failure is raised
     loudly, with the two causes distinguished because the fixes are completely different:
     quota exceeded (delete old records / export a backup) vs storage unavailable (browser is
     blocking storage entirely - private window, file:// restrictions, or site data disabled). */
  set(key, val){
    try{
      const toStore = (key==='visitors' || key==='staff') ? offloadPhotosForStorage(val) : val;
      localStorage.setItem('gsms_'+key, JSON.stringify(toStore));
      return true;
    }catch(e){
      const quota = e && (e.name==='QuotaExceededError' || e.name==='NS_ERROR_DOM_QUOTA_REACHED' || e.code===22 || e.code===1014);
      if(quota) showStorageFullModal(key);
      else showStorageUnavailableModal(e);
      return false;
    }
  },
  /* Rough size of everything this app has stored, so the user can see trouble coming instead of
     hitting the wall mid-shift. Returns bytes (UTF-16 chars ~2 bytes, but base64 is ASCII so
     char count is a close enough estimate of real usage). Photos now live in IndexedDB, not
     localStorage, so they no longer count against this - see photoStoreUsageEstimate() for that
     separately. */
  usage(){
    let total = 0, per = {};
    try{
      for(const k of ['settings','visitors','staff','staffAttendance','counters','auditLog']){
        const v = localStorage.getItem('gsms_'+k);
        const n = v ? v.length : 0;
        per[k] = n; total += n;
      }
    }catch(e){ /* storage unavailable; report zero */ }
    return {total, per};
  }
};
function fmtBytes(n){
  if(n < 1024) return n+' B';
  if(n < 1024*1024) return (n/1024).toFixed(0)+' KB';
  return (n/(1024*1024)).toFixed(1)+' MB';
}
let __storageModalUp = false;
function showStorageFullModal(key){
  if(__storageModalUp) return; // one write failure usually cascades; don't stack modals
  __storageModalUp = true;
  const u = DB.usage();
  openModal(`
    ${modalHeader('\u26a0 Storage Full \u2014 That Did Not Save')}
    <div class="modal-body">
      <p style="margin-top:0;"><b>The last change was NOT saved.</b> This browser's storage for this app is full, so nothing more can be written until space is freed.</p>
      <p class="small">Currently stored: <b>${fmtBytes(u.total)}</b> (visitors ${fmtBytes(u.per.visitors||0)}, staff ${fmtBytes(u.per.staff||0)}, attendance ${fmtBytes(u.per.staffAttendance||0)}, audit log ${fmtBytes(u.per.auditLog||0)}). Browsers typically allow only about 5\u201310MB in total for this part of storage. Photos are stored separately${photoDbAvailable?' (in IndexedDB, which has far more room)':''} and are not counted above.</p>
      <p class="small"><b>Do this now, in order:</b></p>
      <ol class="small">
        <li><b>Export a full backup first</b> (Settings \u2192 Data \u2192 Export Full Backup) so nothing is lost.</li>
        <li>Then clear old records you no longer need at the gate (Settings \u2192 Data).</li>
        <li>Re-enter the change that just failed.</li>
      </ol>
      <p class="small">This is very unusual once photos are out of the way \u2014 it usually means a very large number of text records have built up. If this keeps happening, clear out old attendance/audit history after exporting a backup.</p>
    </div>
    <div class="modal-foot">
      <button class="btn btn-primary" onclick="closeModal(); __storageModalUp=false; go('settings');">Open Settings</button>
      <button class="btn" onclick="closeModal(); __storageModalUp=false;">Dismiss</button>
    </div>
  `, {});
}
function showStorageUnavailableModal(err){
  if(__storageModalUp) return;
  __storageModalUp = true;
  openModal(`
    ${modalHeader('\u26a0 Storage Blocked \u2014 Nothing Can Be Saved')}
    <div class="modal-body">
      <p style="margin-top:0;"><b>This browser is refusing to store data, so nothing entered here will be kept.</b> Records will vanish as soon as the page is reloaded.</p>
      <p class="small">Usual causes, most likely first:</p>
      <ol class="small">
        <li><b>Private / Incognito window</b> \u2014 open the app in a normal window instead.</li>
        <li><b>Site data or cookies blocked</b> for this page in browser settings.</li>
        <li>Opened straight from a USB stick or e-mail attachment in a browser that restricts local files. Copy <code>index.html</code> to the PC's own Documents folder and open it from there.</li>
      </ol>
      <p class="small">Fix this before using the gate system for real work \u2014 until it is fixed, every check-in will be lost.</p>
      <p class="small" style="color:#666;">Technical detail: ${escapeHtml(String(err && err.name || err || 'unknown'))}</p>
    </div>
    <div class="modal-foot"><button class="btn btn-primary btn-block" onclick="closeModal(); __storageModalUp=false;">I Understand</button></div>
  `, {});
}

/* ---------------------------- ICONS (inline SVG, stroke-style) ---------------------------------- */
const ICONS = {
  home: '<path d="M4 11.5 12 4l8 7.5"/><path d="M6 10v9a1 1 0 0 0 1 1h3v-6h4v6h3a1 1 0 0 0 1-1v-9"/>',
  scan: '<path d="M4 8V6a2 2 0 0 1 2-2h2"/><path d="M4 16v2a2 2 0 0 0 2 2h2"/><path d="M20 8V6a2 2 0 0 0-2-2h-2"/><path d="M20 16v2a2 2 0 0 1-2 2h-2"/><line x1="4" y1="12" x2="20" y2="12"/>',
  idcard: '<rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="11" r="1.7"/><path d="M5.5 16c.6-1.7 2-2.6 3-2.6s2.4.9 3 2.6"/><line x1="14" y1="9.5" x2="18.5" y2="9.5"/><line x1="14" y1="13" x2="18.5" y2="13"/>',
  radio: '<circle cx="12" cy="12" r="2.3"/><path d="M8.3 8.3a5.2 5.2 0 0 0 0 7.4M15.7 8.3a5.2 5.2 0 0 1 0 7.4M5.3 5.3a9.7 9.7 0 0 0 0 13.4M18.7 5.3a9.7 9.7 0 0 1 0 13.4"/>',

/* One-shot upgrade for browsers that already saved settings under an older build. S() layers
   saved values ON TOP of defaults, so a stale saved adminKey/securityKey/margin would otherwise
   silently outrank the new default forever. This rewrites only the legacy values, and only once. */
function migrateSettings(){
  const raw = DB.get('settings', null);
  if(!raw) return;
  let changed = false;
  if(raw.adminKey === 'msr2026' || raw.adminKey === 'msr2026#*'){ raw.adminKey = 'msr2026#'; changed = true; }
  if(raw.adminKey === 'msr2026#'){ raw.adminKey = 'msr2026admin#'; changed = true; }
  if(raw.securityKey === '2026' || raw.securityKey === 'msr2026' || raw.securityKey === 'msrsecurity26*#'){ raw.securityKey = 'msr2026#'; changed = true; }
  if(raw.staffAddKey === 'staff2026'){ raw.staffAddKey = 'msr2026staff#'; changed = true; }
  // A prior edit accidentally migrated Add-Staff onto the exact same value as Security
  // ('msr2026#'), silently erasing the trust boundary between them (anyone with the Security
  // code could then also register new staff). Anyone who picked up that broken pairing gets
  // moved onto a distinct value here; a user's own deliberately-matching custom codes are not
  // touched since this only fires on that exact known-broken default pair.
  if(raw.staffAddKey === 'msr2026#' && raw.staffAddKey === raw.securityKey){ raw.staffAddKey = 'msr2026staff#'; changed = true; }
  // Anyone who already used this app has printMarginMm:20 saved, so the "== null" branch below
  // never fires for them and they'd keep the old 2cm margin forever. 20mm is the exact previous
  // default, so moving it to the new 1cm default is safe; a user who deliberately chose some
  // other value (15, 25...) keeps it untouched.
  if(raw.printMarginMm === 20){ raw.printMarginMm = 10; changed = true; }
  if(raw.printMarginMm == null){
    // legacy inches value, or nothing at all -> land on the new 1cm default
    raw.printMarginMm = (raw.printMarginIn != null && isFinite(parseFloat(raw.printMarginIn)) && parseFloat(raw.printMarginIn) !== 0.5)
      ? Math.round(parseFloat(raw.printMarginIn) * 25.4 * 10) / 10
      : 10;
    delete raw.printMarginIn;
    changed = true;
  }
  if(raw.badgeFields && raw.badgeFields.notes === undefined){ raw.badgeFields.notes = true; changed = true; }
  if(changed) DB.set('settings', raw);
}

function ensureInit(){
  if(DB.get('settings',null)===null) DB.set('settings', defaultSettings());
  migrateSettings();

   automatically pick up any new settings fields added by a later version, instead of

   IS the person's record id everywhere in this app. idFromNid() just normalizes it (trim,

/* VISITOR TYPE ------------------------------------------------------------------
   The dropdown is fed from Settings > Visitor Types, plus a permanent "Other" entry that
   reveals a free-text box so the gate can record a type nobody listed yet. What gets STORED
   on the record is always the final plain-text type (never the literal word "Other"), so every
   badge, slip, table, report and export shows the real thing.
   splitVisitorType() runs that in reverse: given a stored type it works out whether the
   dropdown should sit on a listed option or on "Other" with the text box pre-filled. */
function visitorTypeOptions(settings){
  return (settings.accessLevels||[]).map(l=>l.name).filter(x=>x && x.toLowerCase()!=='other');
}
function splitVisitorType(stored, settings){
  const val = (stored||'').trim();
  if(!val) return {sel:'', other:''};
  return visitorTypeOptions(settings).indexOf(val) >= 0 ? {sel:val, other:''} : {sel:'Other', other:val};
}
function resolveVisitorType(d){
  return d.accessLevel === 'Other' ? (d.accessLevelOther||'').trim() : d.accessLevel;
}
function defaultAreaAccess(){ return {office:false, ship:false, shipName:'', walkway:false, outdoorStorage:false, indoorStorage:false, other:false, otherText:''}; }
function areaAccessAny(aa){ return !!(aa && (aa.office||aa.ship||aa.walkway||aa.outdoorStorage||aa.indoorStorage||aa.other)); }
function formatAreaAccess(aa){
  if(!aa) return '';
  const parts = [];
  if(aa.office) parts.push('Office');
  if(aa.ship) parts.push('Ship'+(aa.shipName?' ('+aa.shipName+')':''));
  if(aa.walkway) parts.push('Walkway');
  if(aa.outdoorStorage) parts.push('Outdoor Open Storage');
  if(aa.indoorStorage) parts.push('Indoor Storage');
  if(aa.other) parts.push(aa.otherText? 'Other: '+aa.otherText : 'Other');
  return parts.join(', ');
}

/* ---------------------------- MODALS ---------------------------------- */
let modalStack = [];
function openModal(innerHtml, opts){
  opts = opts||{};
  const host = document.getElementById('modalHost');
  const wrap = document.createElement('div');
  wrap.className = 'modal-backdrop';
  wrap.innerHTML = `<div class="modal ${opts.wide?'wide':''} ${opts.narrow?'narrow':''}">${innerHtml}</div>`;
  wrap.addEventListener('mousedown', (e)=>{ if(e.target===wrap && !opts.persistent) closeModal(); });
  host.appendChild(wrap);
  modalStack.push(wrap);
  return wrap;
}
function closeModal(){
  const el = modalStack.pop();
  if(el) el.remove();
  stopAllCameraStreams();
}
function modalHeader(title){
  return `<div class="modal-head"><h3>${title}</h3><button class="close-x" onclick="closeModal()">&times;</button></div>`;
}

    setTimeout(()=>{ const i=document.getElementById('keyInput'); if(i) i.focus(); }, 60);

      else { document.getElementById('keyErr').style.display='block'; document.getElementById('keyInput').value=''; document.getElementById('keyInput').focus(); }
    };
  });
}

/* ---------------------------- CAMERA ---------------------------------- */
const activeStreams = {};
async function startCamera(videoEl, key){
  try{
    const stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}, audio:false});
    activeStreams[key] = stream;
    videoEl.srcObject = stream;
    await videoEl.play();
    return true;
  }catch(e){
    toast('Camera unavailable: '+e.message, 'err');
    return false;
  }
}
function stopCamera(key){
  const s = activeStreams[key];
  if(s){ s.getTracks().forEach(t=>t.stop()); delete activeStreams[key]; }
}
function stopAllCameraStreams(){ Object.keys(activeStreams).forEach(stopCamera); }
/* ---------------------------- IMAGE SIZING (CRITICAL FOR STORAGE) ----------------------------
   Every photo in this app ends up as a base64 string inside localStorage, which has a HARD
   browser quota of roughly 5-10MB for the ENTIRE app. A single modern phone photo is 3-5MB, and
   base64 adds ~37% on top. Storing even one uploaded photo at original resolution can therefore
   blow the whole quota, after which EVERY save fails - visitors, staff, settings, audit log -
   which presents to the user as "nothing saves any more".
   So nothing is ever stored at original size: every capture and upload is downscaled to a
   sensible max dimension and re-encoded as JPEG before it is ever put in a record.
   FACE ~40KB, NID ~90KB => a visitor with all three images costs ~0.2MB instead of ~20MB. */
const IMG_LIMITS = {
  face: {maxW: 480, maxH: 480, quality: 0.82},   // small headshot, prints at ~22x27mm
  nid:  {maxW: 1000, maxH: 1000, quality: 0.78}, // must stay legible enough to read an NID number
};
function shrinkImage(src, limit){
  return new Promise((resolve)=>{
    let done = false;
    const finish = (v)=>{ if(!done){ done = true; resolve(v); } };
    // Hard timeout: if the browser never fires load OR error (rare, but it strands the whole
    // check-in flow when it happens, because the caller is awaiting this), fall back to storing
    // the original rather than hanging forever with no photo and no error.
    setTimeout(()=> finish(src), 4000);
    const img = new Image();
    img.onload = ()=>{
      try{
        let {width:w, height:h} = img;
        if(!w || !h){ finish(src); return; }
        const scale = Math.min(1, limit.maxW/w, limit.maxH/h);
        const c = document.createElement('canvas');
        c.width = Math.max(1, Math.round(w*scale));
        c.height = Math.max(1, Math.round(h*scale));
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#fff'; ctx.fillRect(0,0,c.width,c.height); // flatten alpha; JPEG has none
        ctx.drawImage(img, 0, 0, c.width, c.height);
        finish(c.toDataURL('image/jpeg', limit.quality));
      }catch(e){ finish(src); } // never lose the photo just because resizing failed
    };
    img.onerror = ()=> finish(src);
    img.src = src;
  });
}
/* Reads a picked file AND shrinks it. Every photo <input> in this app must go through this,
   never through fileToDataUrl directly, or the quota problem above comes straight back. */
async function fileToStoredImage(file, kind){
  const raw = await fileToDataUrl(file);
  return shrinkImage(raw, IMG_LIMITS[kind] || IMG_LIMITS.nid);
}
function snapFromVideo(videoEl, kind){
  const limit = IMG_LIMITS[kind] || IMG_LIMITS.nid;
  const vw = videoEl.videoWidth||640, vh = videoEl.videoHeight||480;
  // Cap capture resolution the same way uploads are capped - a 1080p or 4K webcam frame is far
  // larger than anything this app displays or prints, and goes straight into the storage quota.
  const scale = Math.min(1, limit.maxW/vw, limit.maxH/vh);
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(vw*scale));
  c.height = Math.max(1, Math.round(vh*scale));
  c.getContext('2d').drawImage(videoEl,0,0,c.width,c.height);
  return c.toDataURL('image/jpeg', limit.quality);
}
function fileToDataUrl(file){
  return new Promise((resolve,reject)=>{
    const r = new FileReader();
    r.onload = ()=>resolve(r.result);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}

function buildBadgeHtml(rec, kind){
  // rec: visitor or staff record ; kind: 'VISITOR' or 'STAFF'
  // No QR code, no scanning \u2014 the visible NID number IS this person's ID number.
  // Security reads it (or the gate clerk types it into Home Scan Console) to check
  // someone in or out. Every field below is a full, plainly-labeled row \u2014 nothing
  // is abbreviated away or hidden behind a scan.
  const settings = S();
  const bf = settings.badgeFields || defaultSettings().badgeFields;
  const photo = rec.facePhoto || rec.photo || '';
  const name = rec.name || '\u2014';
  const idStr = rec.id;
  const isVisitor = kind==='VISITOR';
  const subLine = bf.subline ? (isVisitor ? (rec.company||'') : (rec.designation||'')) : '';
  const rows = [];
  if(isVisitor){
    if(bf.hostedBy) rows.push({l:'HOSTED BY', v:rec.hostName||'\u2014'});
    rows.push({l:'VISITOR TYPE', v:rec.accessLevel||'\u2014'});
    if(bf.areaAccess) rows.push({l:'AREA ACCESS', v:formatAreaAccess(rec.areaAccess)||'\u2014', wide:true});
    if(bf.purpose) rows.push({l:'PURPOSE', v:rec.purpose||'\u2014'});
    if(bf.escort && rec.escort) rows.push({l:'ESCORT', v:rec.escort});
    if(bf.checkIn) rows.push({l:'CHECK-IN', v:fmtDT(rec.checkIn)});
    if(bf.expiry) rows.push({l:'EXPIRY', v:fmtDT(rec.expiry)});
    /* Items carried in are printed on the card itself so the gate officer on the way OUT can
       check them off against what is being carried out, without opening the app. */
    if(bf.notes!==false && rec.notes) rows.push({l:'ITEMS IN / NOTES', v:rec.notes, wide:true, clamp:true});
  } else {
    rows.push({l:'UNIT', v:rec.department||'\u2014'});
    if(bf.areaAccess) rows.push({l:'AREA ACCESS', v:formatAreaAccess(rec.areaAccess)||'\u2014', wide:true});
    rows.push({l:'EXPIRES', v: rec.expiryDate ? fmtDateOnly(rec.expiryDate) : '\u2014'});
  }
  const wMm = settings.badgeWidthMm || 54;
  const hMm = settings.badgeHeightMm || 85.6;
  /* Prefer the issuer stored on the record at creation time. A badge reprinted weeks later by a
     different officer must still name whoever originally issued it \u2014 otherwise the printed card
     contradicts the audit log. Falls back to the current officer for records created before this
     field existed. */
  const issuedBy = rec.issuedBy || sessionOfficerName || '';
  const cardStyle = ` style="width:${wMm}mm; height:${hMm}mm;"`;
  return `
  <div class="badge-card" data-badge-id="${escapeHtml(idStr)}"${cardStyle}>
    <div class="bdg-top">
      <span class="bdg-org"><span class="wheel">&#9096;</span>${escapeHtml(settings.badgeWordmark||'MSR')}</span>
      <span class="bdg-kind">${isVisitor?'VISITOR':(rec.category==='LABOURER'?'LABOUR':'STAFF')}</span>
    </div>
    ${bf.photo!==false ? `<div class="bdg-photo">
      ${photo ? `<img src="${photo}">` : `<div class="no-photo">No Photo</div>`}
    </div>` : ''}
    <div class="bdg-name">${escapeHtml(name)}</div>
    ${subLine? `<div class="bdg-sub">${escapeHtml(subLine)}</div>`:''}
    <div class="bdg-fields">
      ${rows.map(r=> r.wide
        ? `<div class="bdg-block"><span class="l">${escapeHtml(r.l)}</span><span class="v${r.clamp?' bdg-clamp':''}">${escapeHtml(r.v)}</span></div>`
        : `<div class="bdg-row"><span class="l">${escapeHtml(r.l)}</span><span class="v">${escapeHtml(r.v)}</span></div>`
      ).join('')}
    </div>
    <div class="bdg-id">
      <div class="l">NID NUMBER</div>
      <div class="v">${escapeHtml(rec.nid||'\u2014')}</div>
    </div>
    <div class="bdg-foot">
      <div>Hotline: ${escapeHtml(settings.hotline||'')}</div>
      ${issuedBy? `<div class="bdg-issuer">Issued by: ${escapeHtml(issuedBy)}</div>`:''}
    </div>
  </div>`;
}

/* One printed fold-over pair \u2014 front + back, side by side, touching at a vertical fold seam
   (front on the left, back on the right, card size locked \u2014 no resizing, no rotating the card
   itself). When settings.badgeFoldBack is off, prints the front panel alone (no seam, no back). */
/* Badge is CR80-fixed (see .badge-card CSS: height, not min-height) \u2014 it must print at exactly
   54mm x 85.6mm on real pre-cut card stock, so the card itself never grows. If real content would
   be taller than that fixed frame, shrink font-size instead (everything on the badge is sized in
   em relative to .badge-card, by design, precisely so this works) rather than let overflow:hidden
   silently clip the NID box or hotline off the bottom. A couple of passes because line-wrapping
   can change once text reflows smaller, so one ratio isn't always precise on the first try. */
function scaleBadgeToFit(cardEl){
  if(!cardEl) return;
  const PX_PER_MM = 96/25.4;
  const baseFontMm = 2.65; // must match .badge-card{font-size:2.65mm} in CSS
  const floorFontMm = baseFontMm * 0.6; // never shrink below 60% of the base size, for legibility
  const fixedHeightMm = parseFloat(cardEl.style.height) || 85.6;
  const targetPx = fixedHeightMm * PX_PER_MM;
  cardEl.style.fontSize = baseFontMm+'mm';
  for(let pass=0; pass<3; pass++){
    const naturalPx = cardEl.scrollHeight;
    if(naturalPx <= targetPx + 1) return; // fits, 1px rounding slack
    const currentMm = parseFloat(cardEl.style.fontSize) || baseFontMm;
    // Clamp the ABSOLUTE result (not just this pass's multiplier) against the floor, so the
    // floor holds regardless of how many passes it takes to converge \u2014 a per-pass-only clamp
    // can still compound below 60% of the true base after repeated passes.
    const nextMm = Math.max(floorFontMm, currentMm * (targetPx / naturalPx) * 0.985);
    cardEl.style.fontSize = nextMm.toFixed(3)+'mm';
    if(nextMm <= floorFontMm) return; // hit the legibility floor, stop iterating
  }
}
/* Info/record-slip section can be any length depending on notes, fields and NID photos. After
   the fixed-size badge above it on the same page, whatever vertical space is left is all it
   gets \u2014 shrink IT (never the badge) to fit that space so a single record's badge+info never
   spills onto a second page. Uses mm units directly since this app already renders those at the
   same physical size on screen and on paper (no separate print-preview measurement pass needed). */
/* Shrink the info/record slip so the whole record (fixed CR80 badge + slip) lands on ONE page.
   The previous version estimated available space as "page minus margins minus badge height",
   which ignored the repeating page footer, #printArea's own padding, the .sheet gap and the
   slip's top margin. It therefore over-estimated the room by ~30mm, concluded a slip that did
   NOT fit actually did, scaled nothing, and let the slip spill onto page 2.
   Now the slip's real top offset within the print area is measured directly, so every one of
   those contributions is included automatically no matter how the CSS above it changes. */
function fitStubToPage(block, marginMm, area){
  const outer = block.querySelector('.stub-fit-outer');
  if(!outer) return;
  const inner = outer.querySelector('.stub-fit-inner');
  if(!inner) return;
  const PX_PER_MM = 96/25.4;
  const pageHeightMm = 297;      // A4 portrait — badge jobs always print portrait
  const footerReserveMm = 12;    // #printFootLine is position:fixed at the bottom of every sheet
  const bufferMm = 4;            // print-engine rounding; better slightly small than one line over

  // reset any previous scaling before measuring, or we'd measure an already-shrunk slip
  inner.style.transform = 'none';
  outer.style.height = 'auto';

  const areaTop = (area || block.parentElement).getBoundingClientRect().top;
  const stubTopMm = (outer.getBoundingClientRect().top - areaTop) / PX_PER_MM; // everything above the slip
  const stubNaturalMm = inner.getBoundingClientRect().height / PX_PER_MM;
  if(stubNaturalMm <= 0) return; // nothing measurable (e.g. not laid out) — leave it alone

  const usablePageMm = pageHeightMm - (marginMm*2) - footerReserveMm - bufferMm;
  const availableMm = usablePageMm - stubTopMm;
  if(availableMm > 0 && stubNaturalMm > availableMm){
    const factor = Math.max(0.45, availableMm / stubNaturalMm);
    inner.style.transform = 'scale('+factor.toFixed(4)+')';
    inner.style.transformOrigin = 'top left';
    // transform alone shrinks paint but NOT layout height — the explicit height is what actually
    // reclaims the space and stops the page break.
    outer.style.height = (stubNaturalMm*factor).toFixed(2)+'mm';
  }
}
function fitAllStubsToPage(area, marginMm){
  area.querySelectorAll('.record-block').forEach(block=> fitStubToPage(block, marginMm, area));
}
/* #printArea is display:none outside of an actual print, and a display:none element has NO
   layout - every getBoundingClientRect()/scrollHeight/clientHeight inside it reads exactly 0.
   Measuring in that state silently makes both fit routines below do nothing at all (0 is never
   "too tall", so nothing ever shrinks). So for the measuring pass only, the area is forced into
   a rendered-but-invisible state off-screen: laid out for real, never seen by the user, never
   affecting the on-screen page. Restored immediately afterwards. */
function withPrintAreaMeasurable(area, fn){
  const prev = {display: area.style.display, position: area.style.position, left: area.style.left,
                top: area.style.top, visibility: area.style.visibility, width: area.style.width};
  area.style.display = 'block';
  area.style.position = 'absolute';
  area.style.left = '-10000px';
  area.style.top = '0';
  area.style.visibility = 'hidden';
  area.style.width = '210mm'; // measure at real A4 width, not the viewport's
  try{ fn(); }
  finally{
    area.style.display = prev.display;
    area.style.position = prev.position;
    area.style.left = prev.left;
    area.style.top = prev.top;
    area.style.visibility = prev.visibility;
    area.style.width = prev.width;
  }
}

function buildNidStubImagesHtml(rec){

}
/* Same badge can be checked in/out multiple times during one day before it expires (e.g. a
   contractor stepping out for lunch and back). Every one of those cycles is recorded as its own
   entry in rec.sessions \u2014 this renders that full list so it's actually visible somewhere,
   instead of only ever showing the single most recent check-in/check-out like the top-level
   rec.checkIn/rec.checkOut fields do. */
function buildSessionsHtml(rec){
  const sessions = Array.isArray(rec.sessions) && rec.sessions.length ? rec.sessions
    : (rec.checkIn ? [{checkIn:rec.checkIn, checkOut:rec.checkOut}] : []);
  if(sessions.length<=1) return '';
  const rows = sessions.map((s,i)=>`<tr><td>${i+1}</td><td>${fmtDT(s.checkIn)}</td><td>${s.checkOut?fmtDT(s.checkOut):'\u2014 (onsite)'}</td></tr>`).join('');
  return `
  <div class="sessions-block">
    <div class="sessions-title">Check-In / Check-Out History for This Badge (${sessions.length} sessions)</div>
    <table class="sessions-table"><thead><tr><th>#</th><th>Check-In</th><th>Check-Out</th></tr></thead><tbody>${rows}</tbody></table>
  </div>`;
}

function submitIdentity(){
  if(!VW.fields.hostName.trim()){ toast('Hosted By is required \u2014 enter who the visitor is here to see.','err'); return; }
  if(!VW.fields.name.trim() || !VW.fields.phone.trim() || !VW.fields.nid.trim()){ toast('Name, phone number and NID number are required.','err'); return; }
  VW.editingId = null; // always re-derive fresh from whatever NID is currently in the field
  const nidKey = idFromNid(VW.fields.nid);
  const visitors = DB.get('visitors',[]);
  const existing = visitors.find(v=>v.id===nidKey);
  if(existing){
    if(existing.status==='onsite'){
      toast(existing.name+' is already checked in with this NID. Use Check Out from their record instead of registering again.','err');
      closeModal();
      openLookupModal('VISITOR', existing);
      return;
    }
    // Returning visitor, currently checked out — pull up their profile instead of creating a duplicate.
    // Jump straight to the Details step so security can review/update access & purpose for this visit.
    VW.editingId = existing.id;
    VW.fields = {hostName: VW.fields.hostName||existing.hostName||'', name: existing.name, nid: existing.nid, phone: existing.phone};
    VW.face.photo = existing.facePhoto || null;
    VW.face.override = existing.faceOverride || false;
    VW.face.overrideReason = existing.faceOverrideReason || '';
    VW.nidPhotos = {front: existing.frontPhoto||null, back: existing.backPhoto||null};
    const vtE = splitVisitorType(existing.accessLevel, S());
    VW.details = {
      company: existing.company||'', escort: existing.escort||'', accessLevel: vtE.sel, accessLevelOther: vtE.other,
      areaAccess: existing.areaAccess ? {...defaultAreaAccess(), ...existing.areaAccess} : defaultAreaAccess(),
      purpose:'', purposeOther:'', durationH:1, durationM:0, validityMode:'duration', validUntil:'', ppe:existing.ppe||false, safety:existing.safety||false,
      notes:'', vehicleType: existing.vehicleType||'', plateNumber: existing.plateNumber||''
    };
    toast('Returning visitor found \u2014 profile loaded. Review and update access & purpose for this visit.', 'ok');
    VW.step = 3;
    renderWizard();
    return;
  }
  const staffMatch = DB.get('staff',[]).find(s=>s.id===nidKey);
  if(staffMatch) toast('Note: this NID belongs to a registered staff member ('+staffMatch.name+').', 'err');
  const phoneNorm = normPhone(VW.fields.phone);
  const phoneMatch = phoneNorm.length>=7 ? visitors.find(v=>normPhone(v.phone)===phoneNorm) : null;
  if(phoneMatch) toast('Note: this phone number is already on file for '+phoneMatch.name+' (NID '+(phoneMatch.nid||'\u2014')+').', 'err');
  wizardNext();
}

async function finalizeVisitor(){
  const f = VW.fields, d = VW.details;
  if(VW.editingId){
    const ok = await askKey('security');
    if(!ok) return;
  }
  const id = VW.editingId || idFromNid(f.nid);
  const now = nowISO();
  const today = now.slice(0,10);
  /* Two ways a pass can expire: a duration from now, or a fixed end date for repeat visitors
     (long contracts, regular deliveries) who come and go for days without re-registering.
     A multi-day pass runs to the END of its last day (23:59:59 local), not the moment of issue. */
  const useUntil = d.validityMode==='until' && d.validUntil;
  const durMins = useUntil ? 0 : (d.durationH*60 + d.durationM);
  const expiry = useUntil
    ? new Date(d.validUntil+'T23:59:59').toISOString()
    : new Date(Date.now()+durMins*60000).toISOString();
  const visitors = DB.get('visitors',[]);
  /* Same badge reused all day: only regenerate (new badgeDate, cleared sessions) when the
     visitor is new, the face photo changed, the calendar date changed, or the prior badge was
     reported lost. Otherwise this re-check-in just appends a new session to the existing badge. */
  const prev = VW.editingId ? visitors.find(v=>v.id===VW.editingId) : null;
  const sameBadge = !!(prev && prev.badgeDate===today && (prev.facePhoto||'')===(VW.face.photo||'') && !prev.badgeLost);
  const sessions = sameBadge ? (prev.sessions ? [...prev.sessions] : (prev.checkIn ? [{checkIn:prev.checkIn, checkOut:prev.checkOut}] : [])) : [];
  sessions.push({checkIn: now, checkOut: null});
  const rec = {
    id, type:'visitor',
    hostName: f.hostName, name: f.name, nid: f.nid, phone: f.phone,
    facePhoto: VW.face.photo||'', faceOverride: VW.face.override, faceOverrideReason: VW.face.overrideReason||'',
    frontPhoto: VW.nidPhotos.front||'', backPhoto: VW.nidPhotos.back||'',
    company: d.company||'', escort: d.escort||'', accessLevel: resolveVisitorType(d), areaAccess: {...d.areaAccess},
    purpose: d.purpose==='Other'?d.purposeOther:d.purpose,
    vehicleType: d.vehicleType||'', plateNumber: d.plateNumber||'',
    durationMins: durMins, validityMode: useUntil?'until':'duration', validUntil: useUntil?d.validUntil:'',
    ppe: d.ppe, safety: d.safety, notes: d.notes||'',
    issuedBy: sessionOfficerName||'', issuedByPhone: sessionOfficerPhone||'',
    checkIn: now, expiry, checkOut: null, status: 'onsite',
    badgeDate: sameBadge ? prev.badgeDate : today, badgeLost: false, sessions
  };
  if(VW.editingId){
    const idx = visitors.findIndex(v=>v.id===VW.editingId);
    if(idx>=0) visitors[idx] = rec; else visitors.unshift(rec);
    logAudit(sameBadge ? 'Visitor re-checked in (same badge reused, session #'+sessions.length+')' : 'Visitor re-checked in (new badge issued)', id, 'Officer');
  } else {
    visitors.unshift(rec);
    logAudit('Visitor checked in', id, 'Officer');
  }
  DB.set('visitors', visitors);
  if(VW.face.override) logAudit('Face photo override used: '+VW.face.overrideReason, id, 'Security');
  closeModal();
  showBadgeModal(rec, 'VISITOR', true, sameBadge);
  renderRoute();
}

/* ---------------------------- BADGE MODAL / PRINT / WHATSAPP ---------------------------------- */
/* Bank-SMS-style formatted update: fixed labeled lines so the office always sees the same
   shape regardless of which action triggered it. Any field with no value is skipped rather
   than printed as a blank/dash line \u2014 keeps short events (e.g. registration) short. */
function categoryLabel(rec, kind){
  if(kind!=='VISITOR') return rec.category==='LABOURER' ? 'Labourer' : 'Staff';
  return 'Visitor';
}
function buildWhatsAppMessage(rec, kind, status, extra){
  extra = extra || {};
  const isVisitor = kind==='VISITOR';
  const checkIn = extra.checkIn!==undefined ? extra.checkIn : rec.checkIn;
  const checkOut = extra.checkOut!==undefined ? extra.checkOut : rec.checkOut;
  const notes = extra.notes!==undefined ? extra.notes : rec.notes;
  const roleLabel = {admin:'Admin', security:'Security', staffAdd:'Add Staff'}[sessionRole] || '';
  const dateBasis = checkIn || nowISO();
  const lines = [
    `*${(S().companyName||'Mehreen Ship Recycling')} \u2013 Gate Update*`,
    `Status: ${status}`,
    `Name: ${rec.name||'\u2014'}`,
    `Category: ${categoryLabel(rec, kind)}`,
    `Badge ID: ${rec.id||'\u2014'}`,
    `Date: ${fmtDateOnly(dateBasis)}`,
  ];
  if(isVisitor) lines.push(`Host/Department: ${rec.hostName||'\u2014'}`);
  else lines.push(`Host/Department: ${rec.department||'\u2014'}`);
  if(isVisitor) lines.push(`Purpose: ${rec.purpose||'\u2014'}`);
  if(checkIn) lines.push(`Check-In: ${fmtDT(checkIn)}`);
  if(checkOut) lines.push(`Check-Out: ${fmtDT(checkOut)}`);
  if(notes) lines.push(`Notes: ${notes}`);
  if(roleLabel) lines.push(`Authorized Via: ${roleLabel}`);
  return lines.join('\n');
}
function showBadgeModal(rec, kind, justCheckedIn, reused){
  const settings = S();
  const status = justCheckedIn==='registered' ? 'Registered' : (justCheckedIn ? (reused ? 'Checked In (Same Badge)' : 'Checked In') : 'Checked Out');
  const waMsg = buildWhatsAppMessage(rec, kind, status);
  openModal(`
    ${modalHeader((kind==='VISITOR'?'Visitor':'Staff')+' Badge \u2014 '+rec.id)}
    <div class="modal-body center">
      <div id="badgeHolder" style="display:inline-block;">${buildBadgeHtml(rec, kind)}</div>
      ${reused ? `<div class="hint" style="margin-top:.6em;">Same badge reused for today (session #${(rec.sessions||[]).length}) \u2014 no need to print a new card unless this one is lost.</div>` : ''}
      ${(settings.badgeFoldBack!==false) ? `<div class="hint" style="margin-top:.6em;">Back panel (big ${kind==='VISITOR'?'V':'S'} + hotline) prints automatically beside this on the fold-over sheet.</div>` : ''}
      <div class="row" style="margin-top:1.1em; justify-content:center; flex-wrap:wrap;">
        <button class="btn btn-primary" onclick="printSingleBadge('${rec.id}','${kind}','badge')">Print Badge Only</button>

        <button class="btn btn-primary" onclick="printSingleBadge('${rec.id}','${kind}','both')">Print Badge + Info Page</button>
        <button class="btn" onclick="saveBadgeAsPng('${rec.id}','${kind}')">Save ID as PNG</button>
        <button class="btn" onclick="sendWhatsApp('${settings.whatsappNumber}', ${JSON.stringify(waMsg).replace(/"/g,'&quot;')})">Send via WhatsApp</button>
        <button class="btn btn-ghost" onclick="promptWhatsAppOther(${JSON.stringify(waMsg).replace(/"/g,'&quot;')})">Send to other number</button>
      </div>
    </div>
    <div class="modal-foot"><button class="btn btn-block" onclick="closeModal()">Done</button></div>
  `, {});
  const cardEl = document.querySelector('#badgeHolder .badge-card');

  const url = 'https://wa.me/'+number.replace(/[^\d]/g,'')+'?text='+encodeURIComponent(msg);

function printSingleBadge(id, kind, mode){
  const rec = kind==='VISITOR' ? DB.get('visitors',[]).find(v=>v.id===id) : DB.get('staff',[]).find(s=>s.id===id);
  if(!rec) return;

/* mode: 'badge' = card only, 'info' = record slip only, 'both' (default) = card + slip.
   Resolves once every <img> in the print area has finished loading (or errored/timed out) \u2014
   large base64 NID/face photos can still be decoding when window.print() would otherwise fire
   on a fixed short timer, which silently prints them blank. */
function waitForPrintImages(container, timeoutMs){
  const imgs = Array.from(container.querySelectorAll('img'));
  if(!imgs.length) return Promise.resolve();
  return Promise.race([
    Promise.all(imgs.map(img=> (img.complete && img.naturalWidth>0) ? Promise.resolve() : new Promise(res=>{ img.onload=res; img.onerror=res; }))),
    new Promise(res=> setTimeout(res, timeoutMs||1500))
  ]);
}
function printBadges(items, mode){
  mode = mode || 'both';
  const area = document.getElementById('printArea');
  if(!area){ toast('Print area missing — reload the page and try again.','err'); return; }
  if(!items || !items.length){ toast('Nothing to print.','err'); return; }
  const blocks = items.map(it=>{
    const badgeHtml = mode==='info' ? '' : buildBadgeUnitHtml(it.rec, it.kind);
    const stub = mode==='badge' ? '' : (it.kind==='VISITOR' ? buildVisitorStubHtml(it.rec) : buildStaffStubHtml(it.rec));
    const stubWrapped = stub ? `<div class="stub-fit-outer"><div class="stub-fit-inner">${stub}</div></div>` : '';
    return `<div class="record-block">${badgeHtml}${stubWrapped}</div>`;
  }).join('');
  area.innerHTML = `<div class="sheet">${blocks}</div>`;
  setPrintSource(mode==='badge' ? 'ID Badge Only' : mode==='info' ? 'Information Page Only' : 'ID Badge / Record Slip');
  const marginMm = applyPrintPageStyle('portrait');
  // Every step from here is individually guarded: whatever else goes wrong, the print dialog
  // must still open. A silently-swallowed error here is indistinguishable to the user from
  // "the print button does nothing".
  waitForPrintImages(area).catch(()=>{}).then(()=>{
    try{
      withPrintAreaMeasurable(area, ()=>{
        area.querySelectorAll('.badge-card').forEach(scaleBadgeToFit);
        if(mode!=='badge') fitAllStubsToPage(area, marginMm);
      });
    }catch(e){ console.error('Badge/stub fitting failed; printing unfitted.', e); }
    setTimeout(()=>{
      try{ window.print(); }
      catch(e){ toast('Your browser blocked the print dialog. Use the browser menu → Print.','err'); }
    }, 30);
  });
}
/* Renders a single badge card to a PNG file using html2canvas (loaded lazily from CDN, same
   trust level as the existing SheetJS CDN tag). Off-screen clone at 3x scale for print-quality
   output; the visible card/UI is never modified. */
async function ensureHtml2Canvas(){
  if(window.html2canvas) return;
  await new Promise((resolve, reject)=>{
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
    s.onload = resolve; s.onerror = ()=>reject(new Error('Could not load PNG export library \u2014 check internet connection.'));
    document.head.appendChild(s);
  });
}
async function saveBadgeAsPng(id, kind){
  const rec = kind==='VISITOR' ? DB.get('visitors',[]).find(v=>v.id===id) : DB.get('staff',[]).find(s=>s.id===id);
  if(!rec) return;
  toast('Preparing PNG\u2026', 'ok');
  try{
    await ensureHtml2Canvas();
    const holder = document.createElement('div');
    holder.style.cssText = 'position:fixed; left:-9999px; top:0; background:#fff;';
    holder.innerHTML = buildBadgeHtml(rec, kind);
    document.body.appendChild(holder);
    await waitForPrintImages(holder, 2000);
    const canvas = await window.html2canvas(holder.firstElementChild, {scale:3, backgroundColor:'#ffffff'});
    document.body.removeChild(holder);
    const a = document.createElement('a');
    a.href = canvas.toDataURL('image/png');
    a.download = (kind==='VISITOR'?'visitor-badge-':'staff-badge-')+rec.id+'.png';
    a.click();
    logAudit('Badge saved as PNG', rec.id, 'Officer');
  }catch(e){
    toast(e.message || 'Could not generate PNG.', 'err');
  }
}

async function checkoutVisitor(id){

  const ok = await askKey('security');
  if(!ok) return;
  rec.checkOut = nowISO();
  rec.status = 'checked_out';
  rec.totalMins = minutesBetween(rec.checkIn, rec.checkOut);
  if(Array.isArray(rec.sessions) && rec.sessions.length) rec.sessions[rec.sessions.length-1].checkOut = rec.checkOut;
  const gp = await promptGatePass();
  rec.gatePassIssued = gp.gatePassIssued;
  rec.gatePassNumber = gp.gatePassNumber;
  rec.exitVehicleType = gp.exitVehicleType||'';
  rec.exitPlateNumber = gp.exitPlateNumber||'';

    ls.gatePassNumber = gp.gatePassNumber;
    ls.exitVehicleType = gp.exitVehicleType||'';
    ls.exitPlateNumber = gp.exitPlateNumber||'';
  }
  DB.set('visitors', visitors);
  logAudit('Visitor checked out', id, 'Security');
  toast('Visitor '+rec.name+' checked out.', 'ok');
  renderRoute();
  showCheckoutInfoModal(rec, 'VISITOR');
}

function visitorStatusInfo(rec){

/* ========================================================================
   OVERDUE CHECKOUT ALERTS \u2014 pop-up + sound when a visitor's time is up
   and they still haven't checked out. Runs on a timer; if more than one
   visitor is overdue at once it lists them all and lets security decide,
   per visitor, whether to check them out, view their details, or ignore
   them for a while. "Ignore" only snoozes that one visitor \u2014 it never
   turns the feature off, and the alert keeps re-checking in the background.
   ======================================================================== */
let overdueAlertOpen = false;
let overdueSnoozeUntil = {}; // visitor id -> timestamp (ms) until which we won't re-alert
function getOverdueVisitors(){
  const now = Date.now();
  return DB.get('visitors',[]).filter(v=>
    v.status==='onsite' &&
    new Date(v.expiry).getTime() < now &&
    !(overdueSnoozeUntil[v.id] && overdueSnoozeUntil[v.id] > now)
  );
}
function playOverdueAlertSound(){
  try{
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if(!Ctx) return;
    const ctx = new Ctx();
    let t = ctx.currentTime;
    for(let i=0;i<3;i++){
      const osc = ctx.createOscillator(), gain = ctx.createGain();
      osc.type = 'sine'; osc.frequency.setValueAtTime(880, t);
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.exponentialRampToValueAtTime(0.35, t+0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, t+0.3);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(t); osc.stop(t+0.32);
      t += 0.42;
    }
    setTimeout(()=>{ try{ ctx.close(); }catch(e){} }, 1500);
  }catch(e){}
}
/* ---------------------------- "STILL HERE" PRESENCE ALERT ----------------------------------
   Separate from the overdue alert. Overdue = "this person's pass has EXPIRED, act on it".
   Presence = "this person is still inside after N hours", purely so the gate is aware — nobody
   has done anything wrong, and it must never read like an alarm. Fires once per whole hour
   crossed (at 1h, 2h, 3h...) per person, covering both visitors and checked-in staff, and is
   deliberately suppressed while an overdue alert is up so the two never stack. */
let presenceAlertedHour = {}; // "V:id" / "S:id" -> highest whole hour already announced
let presenceAlertOpen = false;
function getLongStayPeople(){
  const now = Date.now();
  const out = [];
  const minHours = 1;
  DB.get('visitors',[]).forEach(v=>{
    if(v.status!=='onsite' || !v.checkIn) return;
    const hrs = Math.floor((now - new Date(v.checkIn).getTime())/3600000);
    if(hrs < minHours) return;
    if((presenceAlertedHour['V:'+v.id]||0) >= hrs) return;
    out.push({kind:'VISITOR', id:v.id, name:v.name, detail:v.company||v.accessLevel||'', since:v.checkIn, hours:hrs});
  });
  const staff = DB.get('staff',[]);
  DB.get('staffAttendance',[]).forEach(a=>{
    if(a.checkOut || !a.checkIn) return;
    const hrs = Math.floor((now - new Date(a.checkIn).getTime())/3600000);
    if(hrs < minHours) return;
    if((presenceAlertedHour['S:'+a.staffId]||0) >= hrs) return;
    const st = staff.find(x=>x.id===a.staffId);
    out.push({kind:(a.category==='LABOURER'?'LABOURER':'STAFF'), id:a.staffId, name:a.name,
              detail:(st&&st.designation)||a.department||'', since:a.checkIn, hours:hrs});
  });
  return out.sort((a,b)=> b.hours-a.hours);
}
function checkPresenceAlerts(){
  if(!sessionUnlocked || presenceAlertOpen || overdueAlertOpen) return;
  const settings = S();
  if(settings.presenceAlertsEnabled===false) return;
  const list = getLongStayPeople();
  if(!list.length) return;
  // mark before showing, so a long-running tab doesn't re-announce the same hour repeatedly
  list.forEach(p=>{ presenceAlertedHour[(p.kind==='VISITOR'?'V:':'S:')+p.id] = p.hours; });
  presenceAlertOpen = true;
  if(settings.overdueAlertSoundEnabled!==false) playOverdueAlertSound();
  const rows = list.map(p=>`<tr>
      <td><b>${escapeHtml(p.name)}</b><div class="small mono">${escapeHtml(p.id)}</div></td>
      <td>${p.kind==='VISITOR'?'Visitor':(p.kind==='LABOURER'?'Labourer':'Staff')}</td>
      <td>${escapeHtml(p.detail||'\u2014')}</td>
      <td>${fmtDT(p.since)}</td>
      <td><span class="badge-pill pill-gray">${p.hours}h on site</span></td>
    </tr>`).join('');
  openModal(`
    ${modalHeader('\u23F1 Still On Site \u2014 '+list.length+' Person'+(list.length>1?'s':''))}
    <div class="modal-body">
      <p class="small" style="margin-top:0;">For your awareness only \u2014 no action is required and nothing here is overdue. ${list.length>1?'These people have':'This person has'} been inside for over an hour.</p>
      <div class="table-wrap"><table class="hist-print-table" style="width:100%;">
        <thead><tr><th>Name</th><th>Type</th><th>Unit / Company</th><th>Entered</th><th>Time inside</th></tr></thead>
        <tbody>${rows}</tbody>
      </table></div>
    </div>
    <div class="modal-foot"><button class="btn btn-primary btn-block" onclick="presenceAlertOpen=false; closeModal();">Acknowledged</button></div>
  `, {wide:true});
}
function checkOverdueAlerts(){
  if(!sessionUnlocked || overdueAlertOpen) return;
  const settings = S();
  if(settings.overdueAlertsEnabled===false) return;
  const list = getOverdueVisitors();
  if(!list.length) return;
  overdueAlertOpen = true;
  if(settings.overdueAlertSoundEnabled!==false) playOverdueAlertSound();
  renderOverdueAlertModal();
}
function renderOverdueAlertModal(){
  const list = getOverdueVisitors();
  if(!list.length){ overdueAlertOpen = false; closeModal(); return; }
  const rows = list.map(v=>{
    const mins = Math.max(0, Math.round((Date.now() - new Date(v.expiry).getTime())/60000));
    return `<tr>
      <td><b>${escapeHtml(v.name)}</b><div class="small mono">${escapeHtml(v.id)}</div></td>
      <td>${escapeHtml(v.company||'\u2014')}</td>
      <td><span class="badge-pill pill-red">${mins} min over</span></td>

  if(aa.other && !aa.otherText.trim()){ toast('Specify the other area access.','err'); return; }
  const staff = DB.get('staff',[]);
  const nidKey = idFromNid(nid);
  if(!existingId){
    const dup = staff.find(s=>s.id===nidKey);

  if(phoneDup) toast('Note: this phone number is already on file for '+phoneDup.name+' ('+phoneDup.id+').', 'err');

  if(!ok) return;

  if(existingId){
    const rec = staff.find(s=>s.id===existingId);
    if(nidKey !== existingId){
      const collide = staff.find(s=>s.id===nidKey && s!==rec);
      if(collide){ toast('Another staff member already uses this NID: '+collide.name+' ('+collide.id+').','err'); return; }
      DB.set('staffAttendance', DB.get('staffAttendance',[]).map(a=> a.staffId===existingId ? {...a, staffId:nidKey} : a));

    toast('Staff record updated.','ok');

      bloodGroup:document.getElementById('stBg').value.trim(), email:document.getElementById('stEmail').value.trim(),

      expiryDate:document.getElementById('stExpiry').value,

      issuedBy: sessionOfficerName||'', issuedByPhone: sessionOfficerPhone||''};
    staff.unshift(rec);
    logAudit('Staff added', rec.id, 'Admin');
    toast('Staff added: '+rec.id,'ok');
    newRec = rec;
  }
  DB.set('staff', staff);
  closeModal();
  renderRoute();
  if(newRec) showBadgeModal(newRec, 'STAFF', 'registered');

function downloadFile(filename, content, mime){
