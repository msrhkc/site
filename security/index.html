<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MSR Gate Security</title>
<meta name="theme-color" content="#0A2A43">
<style>
:root{
  --navy:#0A2340;
  --navy-2:#123258;
  --navy-deep:#071A2E;
  --ink:#101418;
  --paper:#F6F7F9;
  --card:#FFFFFF;
  --line:#E3E6EA;
  --muted:#68727E;
  --gold:#C6A15B;
  --green:#1E8E5A;
  --amber:#B9791E;
  --red:#C23B3B;
  --gray:#8A93A0;
  --radius:16px;
  --radius-sm:10px;
  --shadow:0 1px 2px rgba(10,35,64,.05), 0 10px 28px -14px rgba(10,35,64,.2);
  --font: -apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --font-cond: "Arial Narrow","Helvetica Neue Condensed",var(--font);
  --mono: "SF Mono",ui-monospace,"Menlo","Consolas",monospace;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; font-family:var(--font); background:var(--paper); color:var(--ink);
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  font-size:clamp(14px,1.4vw,16px);
}
button,input,select,textarea{font-family:inherit; font-size:inherit;}
input,select,textarea{
  border:1px solid var(--line); border-radius:var(--radius-sm); padding:.68em .85em;
  background:#fff; color:var(--ink); width:100%; outline:none; transition:border-color .15s, box-shadow .15s;
}
input:focus,select:focus,textarea:focus{border-color:var(--navy-2); box-shadow:0 0 0 3px rgba(10,35,64,.12);}
label{display:block; font-size:.8em; font-weight:600; color:var(--muted); margin:0 0 .35em 2px; letter-spacing:.01em;}
.field{margin-bottom:1em;}
.hint{font-size:.78em; color:var(--muted); margin-top:.3em;}
button{cursor:pointer; border:none; border-radius:var(--radius-sm); font-weight:600; letter-spacing:.01em; display:inline-flex; align-items:center; justify-content:center; gap:.5em;}
.btn{padding:.7em 1.2em; background:#fff; border:1px solid var(--line); color:var(--ink); transition:.15s;}
.btn:hover{border-color:var(--navy-2); background:#fbfbfc;}
.btn:active{transform:scale(.98);}
.btn-primary{background:var(--navy); color:#fff; border:1px solid var(--navy);}
.btn-primary:hover{background:var(--navy-2); border-color:var(--navy-2);}
.btn-gold{background:var(--gold); color:#2b210c; border:1px solid var(--gold);}
.btn-danger{background:#fff; color:var(--red); border:1px solid #eecccc;}
.btn-danger:hover{background:#fdf2f2;}
.btn-ghost{background:transparent; border:1px solid transparent; color:var(--muted);}
.btn-ghost:hover{background:#eef0f3;}
.btn-block{width:100%;}
.btn-sm{padding:.4em .8em; font-size:.82em; border-radius:9px;}
.btn-lg{padding:.95em 1.4em; font-size:1.02em; border-radius:13px;}
.row{display:flex; gap:.6em; flex-wrap:wrap;}
.row > *{flex:1;}
.spacer{flex:1;}

/* App shell */
#app{display:flex; min-height:100vh;}
#sidebar{
  width:236px; flex:none; background:linear-gradient(180deg,var(--navy) 0%, var(--navy-deep) 100%);
  color:#fff; display:flex; flex-direction:column; position:sticky; top:0; height:100vh; z-index:40;
}
.brand{display:flex; align-items:center; gap:.6em; padding:1.5em 1.2em 1.2em; border-bottom:1px solid rgba(255,255,255,.08);}
.brand-text{line-height:1.15;}
nav.tabs{padding:.8em .7em; display:flex; flex-direction:column; gap:.15em; overflow-y:auto; flex:1;}
nav.tabs .navbtn{
  display:flex; align-items:center; gap:.7em; padding:.65em .8em; border-radius:10px; color:rgba(255,255,255,.75);
  background:transparent; text-align:left; font-weight:600; font-size:.92em;
}
nav.tabs .navbtn:hover{background:rgba(255,255,255,.06); color:#fff;}
nav.tabs .navbtn.active{background:rgba(255,255,255,.12); color:#fff; box-shadow:inset 3px 0 0 var(--gold);}
nav.tabs .navbtn .ico{width:18px; text-align:center; opacity:.9;}
.sidebar-foot{padding:.9em 1.1em 1.1em; border-top:1px solid rgba(255,255,255,.08); font-size:.7em; color:rgba(255,255,255,.4);}
.role-chip{display:inline-flex; align-items:center; gap:.4em; font-size:.72em; padding:.3em .6em; border-radius:20px; background:rgba(255,255,255,.08); color:#fff; margin:.6em 1.1em 0;}
.role-dot{width:7px;height:7px;border-radius:50%;background:var(--gray);}
.role-dot.on{background:var(--green);}

#main{flex:1; min-width:0; display:flex; flex-direction:column;}
#topbar{
  position:sticky; top:0; z-index:30; background:rgba(246,247,249,.85); backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line); padding:.85em 1.4em; display:flex; align-items:center; gap:.8em;
}
#hamburger{display:none;}
.page-title{font-weight:800; font-size:1.25em; letter-spacing:-.01em;}
.topbar-search{max-width:340px; flex:1;}
#content{padding:1.4em; flex:1;}

.card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow);}
.card-pad{padding:1.2em 1.3em;}
.section-title{font-weight:800; font-size:1.05em; margin:0 0 .8em; letter-spacing:-.01em; display:flex; align-items:center; gap:.5em;}
.grid{display:grid; gap:1em;}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}
@media(max-width:1000px){.grid-4{grid-template-columns:repeat(2,1fr);} .grid-3{grid-template-columns:repeat(2,1fr);}}
@media(max-width:640px){.grid-4,.grid-3,.grid-2{grid-template-columns:1fr;}}

.stat{padding:1.1em 1.2em; border-radius:var(--radius); background:var(--card); border:1px solid var(--line); box-shadow:var(--shadow); position:relative; overflow:hidden;}
.stat .num{font-size:1.9em; font-weight:800; letter-spacing:-.02em; font-family:var(--font-cond);}
.stat .lbl{font-size:.78em; color:var(--muted); font-weight:600; margin-top:.15em;}
.stat .accent{position:absolute; left:0; top:0; bottom:0; width:4px;}
.acc-navy{background:var(--navy);} .acc-green{background:var(--green);} .acc-amber{background:var(--amber);} .acc-red{background:var(--red);} .acc-gold{background:var(--gold);}

table{width:100%; border-collapse:collapse; font-size:.88em;}
th{text-align:left; font-size:.72em; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); padding:.6em .7em; border-bottom:1px solid var(--line); white-space:nowrap;}
td{padding:.62em .7em; border-bottom:1px solid #EEF0F2; vertical-align:middle;}
tr:last-child td{border-bottom:none;}
.table-wrap{overflow-x:auto; -webkit-overflow-scrolling:touch;}
.badge-pill{display:inline-flex; align-items:center; gap:.4em; padding:.28em .65em; border-radius:20px; font-size:.76em; font-weight:700;}
.pill-green{background:#E6F5EC; color:var(--green);}
.pill-amber{background:#FCF1DF; color:var(--amber);}
.pill-red{background:#FBEAEA; color:var(--red);}
.pill-gray{background:#EEF0F3; color:var(--gray);}
.dot{width:8px;height:8px;border-radius:50%;}
.dot-green{background:var(--green);} .dot-amber{background:var(--amber);} .dot-red{background:var(--red);} .dot-gray{background:var(--gray);}

.empty{padding:2.5em 1em; text-align:center; color:var(--muted);}
.empty .big{font-size:2em; margin-bottom:.2em;}

/* Modal */
.modal-backdrop{position:fixed; inset:0; background:rgba(7,26,46,.45); backdrop-filter:blur(2px); z-index:100; display:flex; align-items:flex-start; justify-content:center; padding:3vh 1em; overflow-y:auto;}
.modal{background:#fff; border-radius:18px; width:100%; max-width:640px; box-shadow:0 20px 60px rgba(0,0,0,.3); animation:pop .18s ease; margin-bottom:3vh;}
.modal.wide{max-width:880px;}
.modal.narrow{max-width:420px;}
@keyframes pop{from{opacity:0; transform:translateY(8px) scale(.98);} to{opacity:1; transform:none;}}
.modal-head{display:flex; align-items:center; justify-content:space-between; padding:1.1em 1.3em; border-bottom:1px solid var(--line);}
.modal-head h3{margin:0; font-size:1.08em; font-weight:800;}
.modal-body{padding:1.2em 1.3em; max-height:72vh; overflow-y:auto;}
.modal-foot{display:flex; gap:.6em; padding:1em 1.3em; border-top:1px solid var(--line); justify-content:flex-end;}
.close-x{background:transparent; border:none; font-size:1.3em; color:var(--muted); padding:.1em .4em; border-radius:8px;}
.close-x:hover{background:#f0f1f3;}

.steps{display:flex; gap:.4em; margin-bottom:1.2em;}
.step{flex:1; height:5px; border-radius:4px; background:var(--line);}
.step.on{background:var(--navy);}

.method-choice{display:flex; gap:1em;}
.method-card{flex:1; border:1.5px solid var(--line); border-radius:14px; padding:1.4em 1em; text-align:center; cursor:pointer; transition:.15s;}
.method-card:hover{border-color:var(--navy-2); background:#fafbfc;}
.method-card .ico{margin-bottom:.4em; display:flex; align-items:center; justify-content:center; color:var(--navy);}
.method-card b{display:block; margin-bottom:.2em;}
.method-card span{font-size:.8em; color:var(--muted);}

.capture-box{aspect-ratio:4/3; background:#0d1b2a; border-radius:12px; overflow:hidden; position:relative; display:flex; align-items:center; justify-content:center;}
.capture-box video, .capture-box img{width:100%; height:100%; object-fit:cover;}
.capture-box .ph{color:rgba(255,255,255,.4); font-size:.85em;}

.chip-toggle{display:inline-flex; align-items:center; gap:.5em; padding:.55em .8em; border:1px solid var(--line); border-radius:10px; cursor:pointer; font-size:.88em; font-weight:600; user-select:none;}
.chip-toggle input{width:auto; margin:0;}

/* Badge */
.badge-card{
  width:243px; /* ~54x86mm at 96dpi approx scaled for screen preview, actual print uses mm */
  border-radius:12px; overflow:hidden; background:#fff; border:1px solid var(--line); box-shadow:var(--shadow);
  font-family:var(--font-cond); position:relative;
}
.badge-head{background:linear-gradient(135deg,var(--navy) 0%,var(--navy-deep) 100%); color:#fff; padding:.5em .7em .4em; text-align:center;}
.badge-head .wm{font-weight:900; letter-spacing:.03em; font-size:1.05em;}
.badge-head .wm .wheel{color:var(--gold);}
.badge-head .kind{font-size:.6em; letter-spacing:.18em; color:var(--gold); font-weight:700; margin-top:.1em;}
.badge-photo-wrap{position:relative; background:#e7e9ec;}
.badge-photo-wrap img{width:100%; display:block; aspect-ratio:1/1; object-fit:cover;}
.badge-name-panel{
  position:absolute; left:0; right:0; bottom:0; background:#fff; padding:.4em .6em .35em;
  clip-path:polygon(0 22%, 100% 0, 100% 100%, 0% 100%);
}
.badge-name-panel .nm{font-weight:900; font-size:.92em; letter-spacing:-.01em; color:var(--ink); line-height:1.05;}
.badge-body{padding:.55em .7em .3em;}
.badge-body .lab{font-size:.56em; letter-spacing:.1em; color:var(--muted); font-weight:800;}
.badge-body .val{font-size:.74em; font-weight:700; margin-bottom:.4em; color:var(--ink);}
.badge-codes{display:flex; align-items:center; justify-content:center; gap:.4em; padding:.3em .5em .1em; flex-direction:column;}
.badge-codes canvas{max-width:100%;}
.badge-foot{background:var(--navy); color:rgba(255,255,255,.85); text-align:center; font-size:.6em; padding:.35em; letter-spacing:.03em;}
.badge-id-tag{position:absolute; top:.5em; right:.5em; background:rgba(0,0,0,.45); color:#fff; font-size:.55em; padding:.15em .5em; border-radius:20px; font-family:var(--mono); letter-spacing:.02em;}

/* Print sheet */
#printArea{display:none;}
@media print{
  body *{visibility:hidden;}
  #printArea, #printArea *{visibility:visible;}
  #printArea{display:block; position:absolute; left:0; top:0; width:100%; margin:0; padding:0;}
  @page{size:A4; margin:8mm;}
}
.sheet{display:grid; grid-template-columns:repeat(3,54mm); gap:4mm; justify-content:center;}
.sheet .badge-card{width:54mm; break-inside:avoid; position:relative; outline:.2mm dashed #999; outline-offset:2mm;}
.hist-print-table{width:100%; border-collapse:collapse; font-size:9pt;}
.hist-print-table th, .hist-print-table td{border:.3pt solid #999; padding:3pt 5pt;}
.hist-print-table thead{display:table-header-group;}

/* toast */
#toastHost{position:fixed; bottom:1.2em; right:1.2em; z-index:200; display:flex; flex-direction:column; gap:.5em;}
.toast{background:var(--ink); color:#fff; padding:.75em 1.1em; border-radius:10px; font-size:.88em; box-shadow:0 8px 24px rgba(0,0,0,.3); animation:pop .18s ease; max-width:320px;}
.toast.err{background:var(--red);}
.toast.ok{background:var(--green);}

/* mobile */
@media(max-width:880px){
  #sidebar{position:fixed; left:0; top:0; bottom:0; transform:translateX(-100%); transition:transform .2s ease; width:250px; box-shadow:20px 0 40px rgba(0,0,0,.2);}
  #sidebar.open{transform:none;}
  #hamburger{display:flex; align-items:center; justify-content:center; width:38px; height:38px; border-radius:10px; background:#fff; border:1px solid var(--line);}
  .page-title{font-size:1.08em;}
  .topbar-search{display:none;}
  #scrim{position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:39; display:none;}
  #scrim.show{display:block;}
  .method-choice{flex-direction:column;}
}
.small{font-size:.8em; color:var(--muted);}
.mono{font-family:var(--mono);}
.center{text-align:center;}
.hidden{display:none !important;}
hr.sep{border:none; border-top:1px solid var(--line); margin:1.1em 0;}
.kv{display:flex; justify-content:space-between; padding:.4em 0; border-bottom:1px solid #EEF0F2; font-size:.9em;}
.kv b{font-weight:700;}
.tag-input{display:flex; flex-wrap:wrap; gap:.4em; border:1px solid var(--line); border-radius:var(--radius-sm); padding:.5em; background:#fff;}
.tag-chip{background:#EEF0F3; padding:.3em .6em; border-radius:20px; font-size:.8em; display:flex; align-items:center; gap:.4em;}
.tag-chip button{background:none; border:none; color:var(--muted); font-weight:900; padding:0; cursor:pointer;}
.subtabs{display:flex; gap:.3em; border-bottom:1px solid var(--line); margin-bottom:1em;}
.subtab{padding:.6em 1em; font-weight:700; font-size:.88em; color:var(--muted); border-bottom:2px solid transparent; background:none;}
.subtab.active{color:var(--navy); border-color:var(--navy);}

/* ---------------------------- ICONS ---------------------------------- */
.icon{width:1.15em; height:1.15em; display:inline-block; vertical-align:-.22em; flex:none;}
.icon-lg{width:1.6em; height:1.6em;}
nav.tabs .navbtn .icon{width:18px; height:18px; vertical-align:-.3em;}
.empty .icon{width:2.1em; height:2.1em; opacity:.35; margin-bottom:.3em;}

/* ---------------------------- WORDMARK / BRANDING ---------------------------------- */
.wordmark{display:inline-flex; align-items:baseline; gap:.28em; font-family:var(--font-cond); font-weight:800; letter-spacing:.01em;}
.wordmark .helm{color:var(--gold); font-weight:400;}
.brand .wordmark{font-size:1.34em; color:#fff;}
.brand-sub{font-size:.66em; color:rgba(255,255,255,.5); letter-spacing:.14em; text-transform:uppercase; margin-top:.2em;}

/* ---------------------------- HOME / SCAN CONSOLE ---------------------------------- */
.scan-hero{padding:1.5em; margin-bottom:1.3em;}
.scan-hero-inner{display:grid; grid-template-columns:1fr 1fr; gap:1em;}
.scan-tile{
  border:1.5px solid var(--line); border-radius:18px; padding:1.6em 1.3em; cursor:pointer; text-align:center;
  display:flex; flex-direction:column; align-items:center; gap:.55em; transition:.15s; background:var(--paper);
}
.scan-tile:hover{border-color:var(--navy-2); background:#fff; transform:translateY(-1px); box-shadow:var(--shadow);}
.scan-tile:active{transform:scale(.99);}
.scan-tile-ico{width:52px; height:52px; border-radius:50%; background:var(--navy); color:#fff; display:flex; align-items:center; justify-content:center;}
.scan-tile-ico .icon{width:1.5em; height:1.5em;}
.scan-tile b{font-size:1.05em; letter-spacing:-.01em;}
.scan-tile span{font-size:.82em; color:var(--muted);}
.scan-manual{display:flex; gap:.6em; margin-top:1.2em;}
@media(max-width:640px){.scan-hero-inner{grid-template-columns:1fr;} .scan-manual{flex-direction:column;}}

/* ---------------------------- HELP ---------------------------------- */
.help-item{padding:1.1em 0; border-bottom:1px solid var(--line);}
.help-item:last-child{border-bottom:none;}
.help-item h4{margin:0 0 .35em; display:flex; align-items:center; gap:.55em; font-size:1em;}
.help-item p{margin:0; color:var(--muted); font-size:.92em; line-height:1.55;}
.override-note{display:flex; gap:.6em; align-items:flex-start; background:#FBF6EB; border:1px solid #EFDFB8; border-radius:12px; padding:.9em 1em; font-size:.88em; color:#5c4a1f;}
.override-note .icon{color:var(--gold); margin-top:.1em;}
</style>
</head>
<body>

<div id="app">
  <div id="scrim" onclick="toggleSidebar(false)"></div>
  <aside id="sidebar">
    <div class="brand">
      <div class="brand-text">
        <div class="wordmark" id="brandNameSidebar"><span class="helm">&#9096;</span>MSR.</div>
        <div class="brand-sub">Gate Security</div>
      </div>
    </div>
    <div class="role-chip"><span class="role-dot" id="roleDot"></span><span id="roleLabel">Officer mode</span></div>
    <nav class="tabs" id="navTabs"></nav>
    <div class="sidebar-foot">Powered by Hamid Yasir &amp; Co.</div>
  </aside>

  <div id="main">
    <div id="topbar">
      <button id="hamburger" onclick="toggleSidebar()"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
      <div class="page-title" id="pageTitle">Home</div>
      <div class="spacer"></div>
      <div class="field topbar-search" style="margin:0;">
        <input id="globalSearch" placeholder="Search name, ID, phone, NID, company..." oninput="onGlobalSearch(this.value)">
      </div>
    </div>
    <div id="content"></div>
  </div>
</div>

<div id="printArea"></div>
<div id="toastHost"></div>
<div id="modalHost"></div>

<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
/* =========================================================================
   MSR GATE SECURITY MANAGEMENT SYSTEM
   Single-file, offline-first, vanilla JS. Data lives in localStorage only.
   ========================================================================= */

/* ---------------------------- DB LAYER ---------------------------------- */
const DB = {
  get(key, fallback){
    try{ const v = localStorage.getItem('gsms_'+key); return v===null? fallback : JSON.parse(v); }
    catch(e){ return fallback; }
  },
  set(key, val){
    try{ localStorage.setItem('gsms_'+key, JSON.stringify(val)); return true; }
    catch(e){ toast('Storage error — data may not have saved.', 'err'); return false; }
  }
};

/* ---------------------------- ICONS (inline SVG, stroke-style) ---------------------------------- */
const ICONS = {
  home: '<path d="M4 11.5 12 4l8 7.5"/><path d="M6 10v9a1 1 0 0 0 1 1h3v-6h4v6h3a1 1 0 0 0 1-1v-9"/>',
  scan: '<path d="M4 8V6a2 2 0 0 1 2-2h2"/><path d="M4 16v2a2 2 0 0 0 2 2h2"/><path d="M20 8V6a2 2 0 0 0-2-2h-2"/><path d="M20 16v2a2 2 0 0 1-2 2h-2"/><line x1="4" y1="12" x2="20" y2="12"/>',
  idcard: '<rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="11" r="1.7"/><path d="M5.5 16c.6-1.7 2-2.6 3-2.6s2.4.9 3 2.6"/><line x1="14" y1="9.5" x2="18.5" y2="9.5"/><line x1="14" y1="13" x2="18.5" y2="13"/>',
  radio: '<circle cx="12" cy="12" r="2.3"/><path d="M8.3 8.3a5.2 5.2 0 0 0 0 7.4M15.7 8.3a5.2 5.2 0 0 1 0 7.4M5.3 5.3a9.7 9.7 0 0 0 0 13.4M18.7 5.3a9.7 9.7 0 0 1 0 13.4"/>',

function uid(){ return Math.random().toString(36).slice(2,9); }
function pad(n,len){ return String(n).padStart(len,'0'); }
function nowISO(){ return new Date().toISOString(); }
function fmtDT(iso){ if(!iso) return '\u2014'; const d=new Date(iso); return d.toLocaleDateString(undefined,{month:'short',day:'2-digit',year:'numeric'})+' '+d.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'}); }
function fmtDateOnly(iso){ if(!iso) return '\u2014'; const d=new Date(iso); return d.toLocaleDateString(undefined,{month:'short',day:'2-digit',year:'numeric'}); }
function fmtTimeOnly(iso){ if(!iso) return '\u2014'; const d=new Date(iso); return d.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'}); }
function escapeHtml(str){ return String(str==null?'':str).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function minutesBetween(a,b){ return Math.round((new Date(b)-new Date(a))/60000); }
function durationLabel(mins){
  if(mins==null) return '\u2014';
  const h=Math.floor(mins/60), m=mins%60;
  if(h<=0) return m+'m';
  if(m===0) return h+'h';
  return h+'h '+m+'m';
}

/* ---------------------------- CAMERA ---------------------------------- */
const activeStreams = {};
async function startCamera(videoEl, key){
  try{
    const stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}, audio:false});
    activeStreams[key] = stream;
    videoEl.srcObject = stream;
    await videoEl.play();
    return true;
  }catch(e){
    toast('Camera unavailable: '+e.message, 'err');
    return false;
  }
}
function stopCamera(key){
  const s = activeStreams[key];
  if(s){ s.getTracks().forEach(t=>t.stop()); delete activeStreams[key]; }
}
function stopAllCameraStreams(){ Object.keys(activeStreams).forEach(stopCamera); }
function snapFromVideo(videoEl){
  const c = document.createElement('canvas');
  c.width = videoEl.videoWidth||640; c.height = videoEl.videoHeight||480;
  c.getContext('2d').drawImage(videoEl,0,0,c.width,c.height);
  return c.toDataURL('image/jpeg', 0.85);
}
function fileToDataUrl(file){
  return new Promise((resolve,reject)=>{
    const r = new FileReader();
    r.onload = ()=>resolve(r.result);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}

/* ---------------------------- OCR (lazy-loaded Tesseract.js) ---------------------------------- */
let tesseractLoading = null;
function loadTesseract(){
  if(window.Tesseract) return Promise.resolve();
  if(tesseractLoading) return tesseractLoading;
  tesseractLoading = new Promise((resolve,reject)=>{
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
    s.onload = resolve;
    s.onerror = ()=>reject(new Error('Could not load OCR engine (no internet?)'));
    document.head.appendChild(s);
  });
  return tesseractLoading;
}
async function runOCR(dataUrl, statusEl){
  try{
    if(statusEl) statusEl.textContent = 'Loading OCR engine\u2026';
    await loadTesseract();
    if(statusEl) statusEl.textContent = 'Reading card\u2026 this can take a few seconds.';
    const res = await Tesseract.recognize(dataUrl, 'eng');
    if(statusEl) statusEl.textContent = '';
    return res.data.text || '';
  }catch(e){
    if(statusEl) statusEl.textContent = 'OCR failed \u2014 enter details manually below.';
    return '';
  }
}
function guessFieldsFromOcr(text){
  // Best-effort heuristic parse of a Bangladesh NID OCR dump. Always needs officer review.
  const out = {name:'', nid:'', dob:''};
  if(!text) return out;
  const lines = text.split('\n').map(l=>l.trim()).filter(Boolean);
  const nidMatch = text.match(/\b\d{10}\b|\b\d{13}\b|\b\d{17}\b/);
  if(nidMatch) out.nid = nidMatch[0];
  const dobMatch = text.match(/\b\d{1,2}[\s\/\-][A-Za-z]{3,9}[\s\/\-]\d{4}\b|\b\d{2}[\/\-]\d{2}[\/\-]\d{4}\b/);
  if(dobMatch) out.dob = dobMatch[0];
  const nameLine = lines.find(l=>/^name/i.test(l));
  if(nameLine) out.name = nameLine.replace(/^name\s*[:\-]?\s*/i,'').trim();
  else{
    const cand = lines.find(l=>/^[A-Z][A-Za-z\.\s]{3,40}$/.test(l) && !/bangladesh|republic|national|identity|card/i.test(l));
    if(cand) out.name = cand;
  }
  return out;
}

/* ---------------------------- QR / BARCODE RENDERING ---------------------------------- */
function renderQR(canvas, text){
  if(!window.QRCode){ return; }
  QRCode.toCanvas(canvas, text, {width:150, margin:1, color:{dark:'#0A2340', light:'#FFFFFF'}}, function(err){
    if(err) return;
    // Watermark: small logo/wheel chip in the center
    const ctx = canvas.getContext('2d');
    const cx = canvas.width/2, cy = canvas.height/2, r=16;
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(cx,cy,r,0,7); ctx.fill();
    ctx.strokeStyle = '#0A2340'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(cx,cy,r,0,7); ctx.stroke();
    ctx.fillStyle = '#0A2340'; ctx.font='bold 13px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('M', cx, cy+1);
  });
}
function renderBarcode(svg, text){
  if(!window.JsBarcode) return;
  try{ JsBarcode(svg, text, {format:'CODE128', width:1.6, height:34, displayValue:true, fontSize:11, margin:2}); }
  catch(e){ /* invalid text, ignore */ }
}

        ? `Gate Entry \u2013 Visitor ID Issued: ${rec.name} \u2013 ${rec.phone} \u2013 ${rec.accessLevel} \u2013 ${rec.purpose} \u2013 ${durationLabel(rec.durationMins)}`

/* ---------------------------- VISITOR CHECKOUT ---------------------------------- */
async function checkoutVisitor(id){
  const visitors = DB.get('visitors',[]);
  const rec = visitors.find(v=>v.id===id);
  if(!rec || rec.status==='checked_out'){ toast('Visitor already checked out.','err'); return; }
  const ok = await askKey('security');
  if(!ok) return;
  rec.checkOut = nowISO();
  rec.status = 'checked_out';
  rec.totalMins = minutesBetween(rec.checkIn, rec.checkOut);
  DB.set('visitors', visitors);
  logAudit('Visitor checked out', id, 'Security');
  toast('Visitor '+rec.name+' checked out.', 'ok');
  renderRoute();
  showBadgeModal(rec, 'VISITOR', false);
}
function visitorStatusInfo(rec){
  if(rec.status==='checked_out') return {label:'Checked Out', cls:'gray'};
  const now = Date.now(), exp = new Date(rec.expiry).getTime();
  if(now > exp) return {label:'Overdue', cls:'red'};
  if(exp - now < 15*60000) return {label:'Near Expiry', cls:'amber'};
  return {label:'On Site', cls:'green'};
}

async function saveStaff(existingId){
  const name = document.getElementById('stName').value.trim();
  const emp = document.getElementById('stEmp').value.trim();
  const dept = document.getElementById('stDept').value.trim();
  const desig = document.getElementById('stDesig').value.trim();
  const phone = document.getElementById('stPhone').value.trim();
  if(!name||!emp||!dept||!desig||!phone){ toast('Please fill all required fields.','err'); return; }
  const ok = await askKey('admin');
  if(!ok) return;
  const staff = DB.get('staff',[]);
  if(existingId){
    const rec = staff.find(s=>s.id===existingId);
    Object.assign(rec, {name, employeeNo:emp, department:dept, designation:desig, phone,
      bloodGroup:document.getElementById('stBg').value.trim(), email:document.getElementById('stEmail').value.trim(),
      emergencyContact:document.getElementById('stEc').value.trim(), joiningDate:document.getElementById('stJoin').value,
      status:document.getElementById('stStatus').value, photo: window.__staffPhotoTemp||rec.photo||''});
    logAudit('Staff edited', existingId, 'Admin');
    toast('Staff record updated.','ok');
  } else {
    const id = nextStaffId();
    const rec = {id, type:'staff', employeeNo:emp, name, department:dept, designation:desig, phone,
      bloodGroup:document.getElementById('stBg').value.trim(), email:document.getElementById('stEmail').value.trim(),
      emergencyContact:document.getElementById('stEc').value.trim(), joiningDate:document.getElementById('stJoin').value,
      status:document.getElementById('stStatus').value, photo: window.__staffPhotoTemp||''};
    staff.unshift(rec);
    logAudit('Staff added', id, 'Admin');
    toast('Staff added: '+id,'ok');
  }
  DB.set('staff', staff);
  closeModal();
  renderRoute();
}
async function deleteStaff(id){
  const ok1 = await confirmDialog('Delete staff record?', 'This removes '+id+' permanently. Attendance history for this staff member is kept for records.', 'Delete', true);
  if(!ok1) return;
  const ok2 = await askKey('admin');
  if(!ok2) return;
  let staff = DB.get('staff',[]);
  staff = staff.filter(s=>s.id!==id);
  DB.set('staff', staff);
  logAudit('Staff deleted', id, 'Admin');
  toast('Staff record deleted.','ok');
  renderRoute();
}
function staffCurrentlyOnsite(id){
  const att = DB.get('staffAttendance',[]);
  return att.find(a=>a.staffId===id && !a.checkOut) || null;
}
async function staffCheckIn(id){
  const staff = DB.get('staff',[]);
  const rec = staff.find(s=>s.id===id || s.employeeNo===id);
  if(!rec){ toast('Staff ID not found.','err'); return; }
  if(staffCurrentlyOnsite(rec.id)){ toast(rec.name+' is already checked in.','err'); return; }
  const settings = S();
  const now = new Date();
  const isLate = now.getHours() > settings.workStartHour || (now.getHours()===settings.workStartHour && now.getMinutes()>0);
  const att = DB.get('staffAttendance',[]);
  const entry = {id: uid(), staffId: rec.id, name: rec.name, department: rec.department, checkIn: nowISO(), checkOut:null, late: isLate, earlyDeparture:false, overtimeMins:0, workedMins:0};
  att.unshift(entry);
  DB.set('staffAttendance', att);
  logAudit('Staff checked in', rec.id, 'Officer');
  toast(rec.name+' checked in.', 'ok');
  renderRoute();
  showBadgeModal(rec, 'STAFF', true);
}
async function staffCheckOut(id){
  const staff = DB.get('staff',[]);
  const rec = staff.find(s=>s.id===id || s.employeeNo===id);
  if(!rec){ toast('Staff ID not found.','err'); return; }
  const entry = staffCurrentlyOnsite(rec.id);
  if(!entry){ toast(rec.name+' is not currently checked in.','err'); return; }
  const ok = await askKey('security');
  if(!ok) return;
  const settings = S();
  const now = new Date();
  entry.checkOut = nowISO();
  entry.workedMins = minutesBetween(entry.checkIn, entry.checkOut);
  entry.earlyDeparture = now.getHours() < settings.workEndHour;
  const expectedEnd = new Date(entry.checkIn);
  expectedEnd.setHours(settings.workEndHour,0,0,0);
  entry.overtimeMins = Math.max(0, minutesBetween(expectedEnd.toISOString(), entry.checkOut));
  DB.set('staffAttendance', DB.get('staffAttendance',[]).map(a=>a.id===entry.id?entry:a));
  logAudit('Staff checked out', rec.id, 'Security');
  toast(rec.name+' checked out.', 'ok');
  renderRoute();
  showBadgeModal(rec, 'STAFF', false);
}
function exportStaffJson(){
  const data = {staff: DB.get('staff',[]), counters: DB.get('counters',{})};
  downloadFile('staff.json', JSON.stringify(data,null,2), 'application/json');
  logAudit('Staff database exported', '', 'Admin');
}
function importStaffJson(input){
  const file = input.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = async ()=>{
    try{
      const data = JSON.parse(reader.result);
      const ok = await askKey('admin');
      if(!ok) return;
      if(Array.isArray(data.staff)){
        DB.set('staff', data.staff);
        if(data.counters) DB.set('counters', {...DB.get('counters',{}), staff:data.counters.staff||0});
        logAudit('Staff database imported', '', 'Admin');
        toast('Staff database imported.','ok');
        renderRoute();
      } else toast('File does not look like a staff export.','err');
    }catch(e){ toast('Invalid JSON file.','err'); }
  };
  reader.readAsText(file);
}
function downloadFile(filename, content, mime){
  const blob = new Blob([content], {type:mime||'text/plain'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 3000);
}

/* ========================================================================
   HOME SCAN CONSOLE
   Two simple flows:
   - Scan / enter a National ID  -> not a known record -> start visitor registration
   - Scan / enter a Staff or Visitor barcode that's already in the system -> check-in / check-out
   ======================================================================== */
function homeStartNidScan(prefillNid){
  newVisitorWizard();
  if(prefillNid){ VW.method='manual'; VW.fields.nid = prefillNid; VW.step = 2; }
  else { VW.method='scan'; VW.step = 2; }
  openModal(`<div id="wizardRoot"></div>`, {wide:true, persistent:true});
  renderWizard();
}
async function homeManualSubmit(){
  const input = document.getElementById('homeScanInput');
  const raw = (input.value||'').trim();
  if(!raw){ toast('Scan or type an ID.','err'); return; }
  input.value = '';
  const id = raw.toUpperCase();
  const staff = DB.get('staff',[]).find(s=>s.id===id || (s.employeeNo||'').toUpperCase()===id);
  if(staff){
    if(staffCurrentlyOnsite(staff.id)) staffCheckOut(staff.id); else staffCheckIn(staff.id);
    return;
  }
  const visitor = DB.get('visitors',[]).find(v=>v.id===id);
  if(visitor){
    if(visitor.status==='onsite') checkoutVisitor(visitor.id);
    else toast(visitor.name+' is already checked out.', 'err');
    return;
  }
  const ok = await confirmDialog('No record found', 'No staff or visitor is registered with \u201c'+escapeHtml(raw)+'\u201d. Start a new visitor registration using this as the NID number?', 'Register Visitor');
  if(ok) homeStartNidScan(raw);
}
function homeStartBadgeScan(){
  if(!('BarcodeDetector' in window)){
    toast('Barcode camera scanning isn\u2019t supported on this browser \u2014 type the ID instead.', 'err');
    return;
  }
  const box = document.getElementById('homeScanBox');
  box.innerHTML = `<div class="capture-box" id="homeScanCamBox" style="max-width:320px; margin:.9em auto 0;"><video id="homeScanVideo" playsinline muted></video></div><div class="center" style="margin-top:.5em;"><button class="btn btn-sm" onclick="stopHomeBadgeScan()">${ic('x')} Stop Scanning</button></div>`;
  const video = document.getElementById('homeScanVideo');
  startCamera(video, 'homescan').then(ok=>{
    if(!ok) return;
    const detector = new BarcodeDetector({formats:['code_128']});
    window.__homeScanTimer = setInterval(async ()=>{
      try{
        const codes = await detector.detect(video);
        if(codes.length){
          const val = codes[0].rawValue;
          stopHomeBadgeScan();
          document.getElementById('homeScanInput').value = val;
          homeManualSubmit();
        }
      }catch(e){}
    }, 400);
  });
}
function stopHomeBadgeScan(){
  clearInterval(window.__homeScanTimer);
  stopCamera('homescan');
  const box = document.getElementById('homeScanBox');
  if(box) box.innerHTML='';
}

function historyFilteredVisitors(){
  const {from,to,q} = historyState;
  return DB.get('visitors',[]).filter(v=>{
    const d = v.checkIn.slice(0,10);

    if(to && d>to) return false;
    if(q){
      const hay = [v.id,v.name,v.phone,v.nid,v.company,v.accessLevel].join(' ').toLowerCase();
      if(!hay.includes(q.toLowerCase())) return false;

    return true;
  }).sort((a,b)=> new Date(b.checkIn)-new Date(a.checkIn));

    if(to && d>to) return false;
    if(q){

function exportHistory(fmt){
  const isV = historyState.tab==='visitor';
  const rows = isV ? historyFilteredVisitors() : historyFilteredStaffAtt();
  const fname = (isV?'visitor_history_':'staff_attendance_')+historyState.from+'_to_'+historyState.to;
  if(fmt==='json'){ downloadFile(fname+'.json', JSON.stringify(rows,null,2), 'application/json'); }
  else if(fmt==='csv'){ downloadFile(fname+'.csv', toCsv(rows), 'text/csv'); }
  else if(fmt==='xlsx'){
    const ws = XLSX.utils.json_to_sheet(rows.map(stripPhotosForExport));
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, isV?'Visitor History':'Staff Attendance');
    XLSX.writeFile(wb, fname+'.xlsx');
  }
  logAudit((isV?'Visitor history':'Staff attendance')+' exported ('+fmt+')', '', 'Officer');
}
function stripPhotosForExport(rec){
  const {facePhoto, frontPhoto, backPhoto, photo, ...rest} = rec;
  return rest;
}
function toCsv(rows){
  if(!rows.length) return '';
  const clean = rows.map(stripPhotosForExport);
  const cols = Object.keys(clean[0]);
  const esc = v=>{ const s = v==null?'':String(v); return /[",\n]/.test(s)? '"'+s.replace(/"/g,'""')+'"': s; };
  return cols.join(',')+'\n'+clean.map(r=>cols.map(c=>esc(r[c])).join(',')).join('\n');
}

function reportRows(){
  const {type, date, month} = reportState;
  if(type==='daily-visitor') return DB.get('visitors',[]).filter(v=>v.checkIn.slice(0,10)===date);
  if(type==='staff-attendance') return DB.get('staffAttendance',[]).filter(a=>a.checkIn.slice(0,10)===date);
  if(type==='gate-summary') return [
    ...DB.get('visitors',[]).filter(v=>v.checkIn.slice(0,10)===date).map(v=>({time:v.checkIn, event:'Visitor Check-in', who:v.name, detail:v.accessLevel})),
    ...DB.get('visitors',[]).filter(v=>v.checkOut && v.checkOut.slice(0,10)===date).map(v=>({time:v.checkOut, event:'Visitor Check-out', who:v.name, detail:v.accessLevel})),
    ...DB.get('staffAttendance',[]).filter(a=>a.checkIn.slice(0,10)===date).map(a=>({time:a.checkIn, event:'Staff Check-in', who:a.name, detail:a.department})),
    ...DB.get('staffAttendance',[]).filter(a=>a.checkOut && a.checkOut.slice(0,10)===date).map(a=>({time:a.checkOut, event:'Staff Check-out', who:a.name, detail:a.department})),
  ].sort((a,b)=> new Date(a.time)-new Date(b.time));
  if(type==='monthly') return {
    visitors: DB.get('visitors',[]).filter(v=>v.checkIn.slice(0,7)===month),

function buildReportHtml(){
  const {type} = reportState;
  if(type==='monthly'){
    const {visitors, staffAtt} = reportRows();
    return `

  }
  if(type==='staff-attendance'){
    return `<div class="table-wrap"><table><thead><tr><th>Staff ID</th><th>Name</th><th>Dept</th><th>Check In</th><th>Check Out</th><th>Worked</th><th>Late</th><th>Overtime</th></tr></thead>
    <tbody>${rows.map(a=>`<tr><td>${escapeHtml(a.staffId)}</td><td>${escapeHtml(a.name)}</td><td>${escapeHtml(a.department||'\u2014')}</td><td>${fmtTimeOnly(a.checkIn)}</td><td>${a.checkOut?fmtTimeOnly(a.checkOut):'\u2014'}</td><td>${a.workedMins?durationLabel(a.workedMins):'\u2014'}</td><td>${a.late?'Yes':'\u2014'}</td><td>${a.overtimeMins?durationLabel(a.overtimeMins):'\u2014'}</td></tr>`).join('')}</tbody></table></div>`;
  }
  if(type==='gate-summary'){
    return `<div class="table-wrap"><table><thead><tr><th>Time</th><th>Event</th><th>Who</th><th>Detail</th></tr></thead>
    <tbody>${rows.map(r=>`<tr><td>${fmtTimeOnly(r.time)}</td><td>${r.event}</td><td>${escapeHtml(r.who)}</td><td>${escapeHtml(r.detail||'')}</td></tr>`).join('')}</tbody></table></div>`;
  }

function monthlyDailyBreakdown(visitors, staffAtt){
  const days = {};
  visitors.forEach(v=>{ const d=v.checkIn.slice(0,10); days[d]=days[d]||{v:0,s:0}; days[d].v++; });
  staffAtt.forEach(a=>{ const d=a.checkIn.slice(0,10); days[d]=days[d]||{v:0,s:0}; days[d].s++; });
  return Object.keys(days).sort().map(d=>({date:d, v:days[d].v, s:days[d].s}));
}

            <button class="btn btn-sm" onclick="printSingleBadge('${s.id}','STAFF')">Card</button>
            <button class="btn btn-sm btn-danger" onclick="deleteStaff('${s.id}')">Delete</button>
          </td>
        </tr>`).join('')}</tbody>
    </table></div>` : `<div class="empty">${ic('users')}<br>No staff added yet.</div>`}
  `;
}
function renderAuditLog(){
  const log = DB.get('auditLog',[]).slice(0,300);
  return `<div class="table-wrap"><table>
    <thead><tr><th>Timestamp</th><th>Action</th><th>Record</th><th>Role</th></tr></thead>
    <tbody>${log.map(l=>`<tr><td>${fmtDT(l.ts)}</td><td>${escapeHtml(l.action)}</td><td class="mono">${escapeHtml(l.recordId)}</td><td>${escapeHtml(l.role)}</td></tr>`).join('')}</tbody>
  </table></div>${!log.length?`<div class="empty">No audit entries yet.</div>`:''}`;
}
function exportAll(){
  const data = {
    exportedAt: nowISO(),
    settings: S(),
    visitors: DB.get('visitors',[]),
    staff: DB.get('staff',[]),
    staffAttendance: DB.get('staffAttendance',[]),
    counters: DB.get('counters',{}),
    auditLog: DB.get('auditLog',[])
  };
  downloadFile('gsms_backup_'+new Date().toISOString().slice(0,10)+'.json', JSON.stringify(data,null,2), 'application/json');
  logAudit('Full backup exported', '', 'Admin');
}
function exportVisitorsOnly(){
  downloadFile('visitors_'+new Date().toISOString().slice(0,10)+'.json', JSON.stringify(DB.get('visitors',[]),null,2), 'application/json');
  logAudit('Visitors exported', '', 'Admin');
}
async function importAll(input){
  const file = input.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = async ()=>{
    try{
      const data = JSON.parse(reader.result);
      const ok = await confirmDialog('Restore full backup?', 'This replaces all current data (visitors, staff, attendance, settings) with the contents of this file.', 'Restore', true);
      if(!ok){ input.value=''; return; }
      const ok2 = await askKey('admin');
      if(!ok2){ input.value=''; return; }
      if(data.settings) DB.set('settings', data.settings);
      if(data.visitors) DB.set('visitors', data.visitors);
      if(data.staff) DB.set('staff', data.staff);
      if(data.staffAttendance) DB.set('staffAttendance', data.staffAttendance);
      if(data.counters) DB.set('counters', data.counters);
      if(data.auditLog) DB.set('auditLog', data.auditLog);
      logAudit('Backup restored', '', 'Admin');
      toast('Backup restored.', 'ok');
      renderRoute();
    }catch(e){ toast('Invalid backup file.','err'); }
  };
  reader.readAsText(file);
}
async function clearAllData(){
  const ok1 = await confirmDialog('Clear all data?', 'This permanently deletes every visitor, staff, attendance and audit record on this device. This cannot be undone.', 'Clear Everything', true);
  if(!ok1) return;
  const ok2 = await askKey('admin');
  if(!ok2) return;
  const ok3 = await confirmDialog('Are you absolutely sure?', 'Type-to-confirm is skipped here, but this really is your last chance to cancel.', 'Yes, delete everything', true);
  if(!ok3) return;
  DB.set('visitors', []); DB.set('staff', []); DB.set('staffAttendance', []);
  DB.set('counters', {visitor:0, staff:0}); DB.set('auditLog', []);
  toast('All data cleared.', 'ok');
  renderRoute();
}

/* ========================================================================
   GLOBAL SEARCH
   ======================================================================== */
let searchDebounce = null;
function onGlobalSearch(q){
  clearTimeout(searchDebounce);
  searchDebounce = setTimeout(()=>doGlobalSearch(q), 180);
}
function doGlobalSearch(q){
  const existing = document.getElementById('searchResultsDrop');
  if(existing) existing.remove();
  q = q.trim().toLowerCase();
  if(!q) return;
  const visitors = DB.get('visitors',[]).filter(v=>[v.id,v.name,v.phone,v.nid,v.company].join(' ').toLowerCase().includes(q)).slice(0,6);
  const staff = DB.get('staff',[]).filter(s=>[s.id,s.name,s.phone,s.employeeNo,s.department].join(' ').toLowerCase().includes(q)).slice(0,6);
  if(!visitors.length && !staff.length) return;
  const input = document.getElementById('globalSearch');
  const rect = input.getBoundingClientRect();
  const drop = document.createElement('div');
  drop.id = 'searchResultsDrop';
  drop.className = 'card';
  drop.style.cssText = `position:fixed; top:${rect.bottom+6}px; left:${rect.left}px; width:${Math.max(rect.width,320)}px; z-index:150; max-height:60vh; overflow-y:auto;`;
  drop.innerHTML = `
    ${visitors.length? `<div class="small" style="padding:.6em .9em .2em; font-weight:700;">Visitors</div>`+visitors.map(v=>`
      <div class="kv" style="padding:.5em .9em; cursor:pointer;" onmousedown="closeSearchDrop(); viewVisitorRecord('${v.id}')"><span>${escapeHtml(v.name)} <span class="small mono">${escapeHtml(v.id)}</span></span><span class="small">${escapeHtml(v.phone)}</span></div>`).join(''):''}
    ${staff.length? `<div class="small" style="padding:.6em .9em .2em; font-weight:700;">Staff</div>`+staff.map(s=>`
      <div class="kv" style="padding:.5em .9em; cursor:pointer;" onmousedown="closeSearchDrop(); go('gate');"><span>${escapeHtml(s.name)} <span class="small mono">${escapeHtml(s.id)}</span></span><span class="small">${escapeHtml(s.department||'')}</span></div>`).join(''):''}
  `;
  document.body.appendChild(drop);
}
function closeSearchDrop(){ const d=document.getElementById('searchResultsDrop'); if(d) d.remove(); }
document.addEventListener('click', (e)=>{
  if(e.target.id!=='globalSearch') closeSearchDrop();
});
