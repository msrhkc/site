<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MSR Gate Security</title>
<meta name="theme-color" content="#0A2A43">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0A2340;
  --navy-2:#123258;
  --navy-deep:#071A2E;
  --ink:#101418;
  --paper:#F6F7F9;
  --card:#FFFFFF;
  --line:#E3E6EA;
  --muted:#68727E;
  --gold:#C6A15B;
  --green:#1E8E5A;
  --amber:#B9791E;
  --red:#C23B3B;
  --gray:#8A93A0;
  --radius:16px;
  --radius-sm:10px;
  --shadow:0 1px 2px rgba(10,35,64,.05), 0 10px 28px -14px rgba(10,35,64,.2);
  --font: -apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --font-cond: "Arial Narrow","Helvetica Neue Condensed",var(--font);
  --font-logo: "Big Shoulders Display",var(--font-cond);
  --mono: "SF Mono",ui-monospace,"Menlo","Consolas",monospace;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; font-family:var(--font); background:var(--paper); color:var(--ink);
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  font-size:clamp(14px,1.4vw,16px);
}
button,input,select,textarea{font-family:inherit; font-size:inherit;}
input,select,textarea{
  border:1px solid var(--line); border-radius:var(--radius-sm); padding:.68em .85em;
  background:#fff; color:var(--ink); width:100%; outline:none; transition:border-color .15s, box-shadow .15s;
}
input:focus,select:focus,textarea:focus{border-color:var(--navy-2); box-shadow:0 0 0 3px rgba(10,35,64,.12);}
label{display:block; font-size:.8em; font-weight:600; color:var(--muted); margin:0 0 .35em 2px; letter-spacing:.01em;}
.field{margin-bottom:1em;}
.hint{font-size:.78em; color:var(--muted); margin-top:.3em;}
button{cursor:pointer; border:none; border-radius:var(--radius-sm); font-weight:600; letter-spacing:.01em; display:inline-flex; align-items:center; justify-content:center; gap:.5em;}
.btn{padding:.7em 1.2em; background:#fff; border:1px solid var(--line); color:var(--ink); transition:.15s;}
.btn:hover{border-color:var(--navy-2); background:#fbfbfc;}
.btn:active{transform:scale(.98);}
.btn-primary{background:var(--navy); color:#fff; border:1px solid var(--navy);}
.btn-primary:hover{background:var(--navy-2); border-color:var(--navy-2);}
.btn-gold{background:var(--gold); color:#2b210c; border:1px solid var(--gold);}
.btn-danger{background:#fff; color:var(--red); border:1px solid #eecccc;}
.btn-danger:hover{background:#fdf2f2;}
.btn-ghost{background:transparent; border:1px solid transparent; color:var(--muted);}
.btn-ghost:hover{background:#eef0f3;}
.btn-block{width:100%;}
.btn-sm{padding:.4em .8em; font-size:.82em; border-radius:9px;}
.btn-lg{padding:.95em 1.4em; font-size:1.02em; border-radius:13px;}
.row{display:flex; gap:.6em; flex-wrap:wrap;}
.row > *{flex:1;}
.spacer{flex:1;}

/* App shell */
#app{display:flex; min-height:100vh;}
#sidebar{
  width:236px; flex:none; background:linear-gradient(180deg,var(--navy) 0%, var(--navy-deep) 100%);
  color:#fff; display:flex; flex-direction:column; position:sticky; top:0; height:100vh; z-index:40;
}
.brand{display:flex; align-items:center; gap:.6em; padding:1.5em 1.2em 1.2em; border-bottom:1px solid rgba(255,255,255,.08);}
.brand-text{line-height:1.15;}
nav.tabs{padding:.8em .7em; display:flex; flex-direction:column; gap:.15em; overflow-y:auto; flex:1;}
nav.tabs .navbtn{
  display:flex; align-items:center; gap:.7em; padding:.65em .8em; border-radius:10px; color:rgba(255,255,255,.75);
  background:transparent; text-align:left; font-weight:600; font-size:.92em;
}
nav.tabs .navbtn:hover{background:rgba(255,255,255,.06); color:#fff;}
nav.tabs .navbtn.active{background:rgba(255,255,255,.12); color:#fff; box-shadow:inset 3px 0 0 var(--gold);}
nav.tabs .navbtn .ico{width:18px; text-align:center; opacity:.9;}
.sidebar-foot{padding:.9em 1.1em 1.1em; border-top:1px solid rgba(255,255,255,.08); font-size:.7em; color:rgba(255,255,255,.4);}
.role-chip{display:inline-flex; align-items:center; gap:.4em; font-size:.72em; padding:.3em .6em; border-radius:20px; background:rgba(255,255,255,.08); color:#fff; margin:.6em 1.1em 0;}
.role-dot{width:7px;height:7px;border-radius:50%;background:var(--gray);}
.role-dot.on{background:var(--green);}

#main{flex:1; min-width:0; display:flex; flex-direction:column;}
#topbar{
  position:sticky; top:0; z-index:30; background:rgba(246,247,249,.85); backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line); padding:.85em 1.4em; display:flex; align-items:center; gap:.8em;
}
#hamburger{display:none;}
.page-title{font-weight:800; font-size:1.25em; letter-spacing:-.01em;}
.topbar-search{max-width:340px; flex:1;}
#content{padding:1.4em; flex:1;}

.card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow);}
.card-pad{padding:1.2em 1.3em;}
.section-title{font-weight:800; font-size:1.05em; margin:0 0 .8em; letter-spacing:-.01em; display:flex; align-items:center; gap:.5em;}
.grid{display:grid; gap:1em;}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}
@media(max-width:1000px){.grid-4{grid-template-columns:repeat(2,1fr);} .grid-3{grid-template-columns:repeat(2,1fr);}}
@media(max-width:640px){.grid-4,.grid-3,.grid-2{grid-template-columns:1fr;}}

.stat{padding:1.1em 1.2em; border-radius:var(--radius); background:var(--card); border:1px solid var(--line); box-shadow:var(--shadow); position:relative; overflow:hidden;}
.stat .num{font-size:1.9em; font-weight:800; letter-spacing:-.02em; font-family:var(--font-cond);}
.stat .lbl{font-size:.78em; color:var(--muted); font-weight:600; margin-top:.15em;}
.stat .accent{position:absolute; left:0; top:0; bottom:0; width:4px;}
.acc-navy{background:var(--navy);} .acc-green{background:var(--green);} .acc-amber{background:var(--amber);} .acc-red{background:var(--red);} .acc-gold{background:var(--gold);}

table{width:100%; border-collapse:collapse; font-size:.88em;}
th{text-align:left; font-size:.72em; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); padding:.6em .7em; border-bottom:1px solid var(--line); white-space:nowrap;}
td{padding:.62em .7em; border-bottom:1px solid #EEF0F2; vertical-align:middle;}
tr:last-child td{border-bottom:none;}
.table-wrap{overflow-x:auto; -webkit-overflow-scrolling:touch;}
.badge-pill{display:inline-flex; align-items:center; gap:.4em; padding:.28em .65em; border-radius:20px; font-size:.76em; font-weight:700;}
.pill-green{background:#E6F5EC; color:var(--green);}
.pill-amber{background:#FCF1DF; color:var(--amber);}
.pill-red{background:#FBEAEA; color:var(--red);}
.pill-gray{background:#EEF0F3; color:var(--gray);}
.dot{width:8px;height:8px;border-radius:50%;}
.dot-green{background:var(--green);} .dot-amber{background:var(--amber);} .dot-red{background:var(--red);} .dot-gray{background:var(--gray);}

.empty{padding:2.5em 1em; text-align:center; color:var(--muted);}
.empty .big{font-size:2em; margin-bottom:.2em;}

/* Modal */
.modal-backdrop{position:fixed; inset:0; background:rgba(7,26,46,.45); backdrop-filter:blur(2px); z-index:100; display:flex; align-items:flex-start; justify-content:center; padding:3vh 1em; overflow-y:auto;}
.modal{background:#fff; border-radius:18px; width:100%; max-width:640px; box-shadow:0 20px 60px rgba(0,0,0,.3); animation:pop .18s ease; margin-bottom:3vh;}
.modal.wide{max-width:880px;}
.modal.narrow{max-width:420px;}
@keyframes pop{from{opacity:0; transform:translateY(8px) scale(.98);} to{opacity:1; transform:none;}}
.modal-head{display:flex; align-items:center; justify-content:space-between; padding:1.1em 1.3em; border-bottom:1px solid var(--line);}
.modal-head h3{margin:0; font-size:1.08em; font-weight:800;}
.modal-body{padding:1.2em 1.3em; max-height:72vh; overflow-y:auto;}
.modal-foot{display:flex; gap:.6em; padding:1em 1.3em; border-top:1px solid var(--line); justify-content:flex-end;}
.close-x{background:transparent; border:none; font-size:1.3em; color:var(--muted); padding:.1em .4em; border-radius:8px;}
.close-x:hover{background:#f0f1f3;}

.steps{display:flex; gap:.4em; margin-bottom:1.2em;}
.step{flex:1; height:5px; border-radius:4px; background:var(--line);}
.step.on{background:var(--navy);}

.capture-box{aspect-ratio:4/3; background:#0d1b2a; border-radius:12px; overflow:hidden; position:relative; display:flex; align-items:center; justify-content:center;}
.capture-box video, .capture-box img{width:100%; height:100%; object-fit:cover;}
.capture-box .ph{color:rgba(255,255,255,.4); font-size:.85em;}

.chip-toggle{display:inline-flex; align-items:center; gap:.5em; padding:.55em .8em; border:1px solid var(--line); border-radius:10px; cursor:pointer; font-size:.88em; font-weight:600; user-select:none;}
.chip-grid{display:flex; flex-wrap:wrap; gap:.5em; grid-column:1/-1;}
.chip-toggle input{width:auto; margin:0;}

/* Badge \u2014 professional, print-safe monochrome (no color; prints clean in B&W) */
/* Portrait CR80 card, exact size 2.125in x 3.375in (54mm x 85.6mm), square corners (no border-radius) */
/* height is a floor (min-height), never a ceiling \u2014 the card grows taller instead of
   clipping content whenever a record has more fields or longer values than the base
   CR80 size allows. Nothing on this badge is ever cut off. */
.badge-card{
  width:54mm; height:85.6mm; flex:none; box-sizing:border-box; font-size:2.6mm;
  border-radius:0; background:#fff; border:1.4px solid #000; box-shadow:var(--shadow);
  font-family:var(--font-cond); position:relative; color:#000;
  display:flex; flex-direction:column; overflow:hidden;
}
.badge-head{background:#000; color:#fff; padding:.35em .5em; flex:0 0 auto; display:flex; flex-direction:column; gap:.1em;}
.badge-head .wm{font-family:var(--font-logo); font-weight:800; letter-spacing:.02em; font-size:1.2em; line-height:1; display:flex; align-items:baseline; gap:.3em; min-width:0;}
.badge-head .wm .wheel{color:#fff;}
.badge-head .full{font-size:.5em; letter-spacing:.03em; text-transform:uppercase; color:rgba(255,255,255,.85); font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
/* Kind indicator bar \u2014 big bold letter + word, high-contrast so it reads instantly at a glance.
   The small record reference on the right is for internal filing only (not the person's ID). */
.badge-kindbar{display:flex; align-items:center; gap:.35em; padding:.12em .5em; flex:0 0 auto; border-bottom:1.6px solid #000;}
.badge-kindbar.kb-v{background:#000; color:#fff;}
.badge-kindbar.kb-s{background:#fff; color:#000;}
.badge-kindbar .kb-letter{font-weight:900; font-size:1.6em; line-height:1; font-family:var(--font-logo);}
.badge-kindbar .kb-word{font-weight:800; font-size:.62em; letter-spacing:.14em;}
.badge-main{flex:1 1 auto; display:flex; flex-direction:column; min-height:0;}
/* Stamp-size photo box \u2014 fixed small footprint, but object-fit:contain on a white backdrop
   guarantees the WHOLE photo is always visible, never cropped/cut off on any side. */
.badge-photo-wrap{
  width:24mm; height:30mm; margin:2mm auto 0; flex:0 0 auto;
  background:#fff; border:1px solid #000; display:flex; align-items:center; justify-content:center; overflow:hidden;
}
.badge-photo-wrap img{max-width:100%; max-height:100%; width:auto; height:auto; object-fit:contain; display:block; filter:grayscale(1) contrast(1.05);}
.badge-photo-wrap .no-photo{color:#9aa4b0; font-size:.62em; text-align:center; padding:0 2mm;}
/* The card size is fixed and never grows. badge-info has flex-shrink:0 so it is NEVER squeezed
   smaller than its own content \u2014 it still grows to fill any leftover space (flex-grow:1) so
   the NID box/footer stay pinned to the bottom, but it can't be crushed to the point of hiding
   whole rows. overflow:hidden on the card is a last-resort clip only, not the normal fit path;
   the fixed font-size + compact grid above are sized to fit real records without ever reaching it. */
.badge-info{flex:1 0 auto; min-width:0; padding:.3em .55em .25em; display:flex; flex-direction:column;}
.badge-info .nm{flex:0 0 auto; font-weight:900; font-size:1.02em; letter-spacing:-.01em; color:#000; line-height:1.22; text-align:center; white-space:normal; overflow-wrap:break-word;}
.badge-info .sub{flex:0 0 auto; font-size:.7em; font-weight:700; color:#333; margin-top:.12em; text-align:center; white-space:normal; overflow-wrap:break-word;}
/* Compact 2-column field grid \u2014 stacked label-over-value cells pack two fields per row instead
   of one, roughly halving the vertical space the old single-column list needed, so everything
   fits inside the fixed card height without clipping. Area Access is a must-show field, so it
   always gets its own full-width, visually distinct row (never squeezed into a 2-up cell). */
.badge-table{flex:0 0 auto; margin-top:.3em; display:grid; grid-template-columns:1fr 1fr; gap:.3em .5em;}
.badge-table .row-field{display:flex; flex-direction:column; gap:.06em; min-width:0;}
.badge-table .lab{font-size:.42em; letter-spacing:.04em; color:#555; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.badge-table .val{font-size:.6em; font-weight:700; color:#000; line-height:1.18; white-space:normal; overflow-wrap:break-word; word-break:break-word;}
.badge-table .row-wide{grid-column:1/-1; background:#f0f0f0; border-left:2px solid #000; padding:.14em .35em; margin:.03em 0;}
.badge-table .row-wide .lab{font-size:.46em;}
.badge-table .row-wide .val{font-size:.74em;}
/* Big, centered ID block replacing the old QR code \u2014 the NID number IS the person's ID
   number; security reads it (or the gate clerk types it) instead of scanning anything. */
.badge-nidbox{flex:0 0 auto; border-top:1.4px solid #000; border-bottom:1.4px solid #000; background:#f0f0f0; text-align:center; padding:.4em .3em;}
.badge-nidbox .nid-lab{font-size:.5em; letter-spacing:.14em; color:#333; font-weight:800;}
.badge-nidbox .nid-val{font-size:1.2em; font-weight:900; letter-spacing:.03em; color:#000; font-family:var(--mono); word-break:break-all; margin-top:.08em;}
.badge-foot{background:#000; color:#fff; text-align:center; font-size:.52em; padding:.22em; letter-spacing:.03em; flex:0 0 auto;}

/* Fold-over badge pair \u2014 front (buildBadgeHtml) + back (buildBadgeBackHtml) side by side,
   touching at the center fold seam. Both panels print normally (no rotation, no mirroring) since
   they land on the same side of the same sheet of paper \u2014 the fold seam is just a visual guide
   for where to fold, not a print-orientation flip. Card size is fixed on both sides (never grows). */
.badge-pair{display:flex; align-items:flex-start; justify-content:center;}
.fold-seam{width:0; flex:none; align-self:stretch; position:relative; border-left:1px dashed #999;}
.fold-seam .fold-tag{position:absolute; top:-3.4mm; left:50%; transform:translateX(-50%); background:#fff; font-size:6pt; color:#777; white-space:nowrap; padding:0 1mm;}
.badge-back{
  height:85.6mm; flex:none; box-sizing:border-box;
  border-radius:0; background:#fff; border:1.4px solid #000; box-shadow:var(--shadow);
  font-family:var(--font-cond); color:#000;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3mm;
  padding:4mm 3mm; overflow:hidden;
}
.badge-back .bb-letter{font-weight:900; font-size:34mm; line-height:1; font-family:var(--font-logo);}
.badge-back .bb-word{font-weight:800; font-size:7mm; letter-spacing:.14em;}
.badge-back .bb-company{font-weight:700; font-size:4mm; text-align:center; letter-spacing:.02em;}
.badge-back .bb-hotline{font-size:3mm; color:#333; text-align:center;}

/* Print sheet \u2014 a front|back pair is ~108mm wide, nearly the full printable A4 width, so only
   one column fits. Each printed record (badge pair + cut line + stub) is one self-contained
   block; records stack down the page rather than grouping all badges then all stubs. */
#printArea{display:none;}
@media print{
  html, body{margin:0; padding:0; height:auto;}
  /* Removing the rest of the app from layout flow entirely (not just visibility:hidden) is what
     stops stray blank pages \u2014 an invisible-but-still-in-flow #app of dashboard/table height was
     previously inflating the printed page count. */
  #lockScreen, #app, #toastHost, #modalHost{display:none !important;}
  #printArea{display:block !important; position:static; width:100%; margin:0; padding:0;}
  *{ -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  @page{size:A4; margin:12.7mm;} /* 0.5in fallback; JS overwrites this per-job from Settings > Printing */
}
.sheet{display:flex; flex-direction:column; align-items:center; gap:7mm;}
.record-block{width:100%; max-width:100%; break-inside:avoid;}
.sheet .badge-card{outline:.2mm dashed #999; outline-offset:2mm;}
.sheet .badge-back{outline:.2mm dashed #999; outline-offset:2mm;}
.hist-print-table{width:100%; max-width:100%; border-collapse:collapse; font-size:9pt; table-layout:auto;}
.hist-print-table th, .hist-print-table td{border:.3pt solid #999; padding:3pt 5pt; word-break:break-word; overflow-wrap:anywhere;}
.hist-print-table thead{display:table-header-group;}
.hist-print-table tr{break-inside:avoid;}

/* Visitor cut-and-keep stub \u2014 the NID photocopy is pasted under/behind this slip and filed by security */
.visitor-stub{width:100%; max-width:100%; margin:6mm auto 0; font-family:var(--font-cond); color:#000;}
.stub-cutline{display:flex; align-items:center; gap:.5em; font-size:9pt; color:#666; margin-bottom:3mm; white-space:nowrap; overflow:hidden;}
.stub-cutline .dash{flex:1; border-top:1px dashed #999;}
.stub-box{border:1.2px solid #000; padding:4mm 5mm;}
.stub-title{font-weight:800; font-size:11pt; letter-spacing:.02em; margin-bottom:2.5mm; display:flex; justify-content:space-between; align-items:baseline;}
.stub-title span{font-weight:600; font-size:.7em; color:#444;}
.stub-table{width:100%; border-collapse:collapse; font-size:9.5pt;}
.stub-table td{padding:1.6mm 2mm; border:.3pt solid #ccc; vertical-align:top;}
.stub-table td.k{width:26mm; font-weight:700; color:#444; background:#f5f5f5;}
.stub-note{margin-top:2.5mm; font-size:8.5pt; color:#444; font-style:italic;}

/* toast */
#toastHost{position:fixed; bottom:1.2em; right:1.2em; z-index:200; display:flex; flex-direction:column; gap:.5em;}
.toast{background:var(--ink); color:#fff; padding:.75em 1.1em; border-radius:10px; font-size:.88em; box-shadow:0 8px 24px rgba(0,0,0,.3); animation:pop .18s ease; max-width:320px;}
.toast.err{background:var(--red);}
.toast.ok{background:var(--green);}

/* mobile */
@media(max-width:880px){
  #sidebar{position:fixed; left:0; top:0; bottom:0; transform:translateX(-100%); transition:transform .2s ease; width:250px; box-shadow:20px 0 40px rgba(0,0,0,.2);}
  #sidebar.open{transform:none;}
  #hamburger{display:flex; align-items:center; justify-content:center; width:38px; height:38px; border-radius:10px; background:#fff; border:1px solid var(--line);}
  .page-title{font-size:1.08em;}
  .topbar-search{display:none;}
  #scrim{position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:39; display:none;}
  #scrim.show{display:block;}
}
.small{font-size:.8em; color:var(--muted);}
.mono{font-family:var(--mono);}
.center{text-align:center;}
.hidden{display:none !important;}
hr.sep{border:none; border-top:1px solid var(--line); margin:1.1em 0;}
.kv{display:flex; justify-content:space-between; padding:.4em 0; border-bottom:1px solid #EEF0F2; font-size:.9em;}
.kv b{font-weight:700;}
.tag-input{display:flex; flex-wrap:wrap; gap:.4em; border:1px solid var(--line); border-radius:var(--radius-sm); padding:.5em; background:#fff;}
.tag-chip{background:#EEF0F3; padding:.3em .6em; border-radius:20px; font-size:.8em; display:flex; align-items:center; gap:.4em;}
.tag-chip button{background:none; border:none; color:var(--muted); font-weight:900; padding:0; cursor:pointer;}
.subtabs{display:flex; gap:.3em; border-bottom:1px solid var(--line); margin-bottom:1em;}
.subtab{padding:.6em 1em; font-weight:700; font-size:.88em; color:var(--muted); border-bottom:2px solid transparent; background:none;}
.subtab.active{color:var(--navy); border-color:var(--navy);}

/* ---------------------------- ICONS ---------------------------------- */
.icon{width:1.15em; height:1.15em; display:inline-block; vertical-align:-.22em; flex:none;}
.icon-lg{width:1.6em; height:1.6em;}
nav.tabs .navbtn .icon{width:18px; height:18px; vertical-align:-.3em;}
.empty .icon{width:2.1em; height:2.1em; opacity:.35; margin-bottom:.3em;}

/* ---------------------------- WORDMARK / BRANDING ---------------------------------- */
.wordmark{display:inline-flex; align-items:baseline; gap:.28em; font-family:var(--font-logo); font-weight:800; letter-spacing:.01em;}
.wordmark .helm{color:var(--gold); font-weight:400;}
.brand .wordmark{font-size:1.34em; color:#fff;}
.brand-sub{font-size:.66em; color:rgba(255,255,255,.5); letter-spacing:.14em; text-transform:uppercase; margin-top:.2em;}

/* ---------------------------- HOME / SCAN CONSOLE ---------------------------------- */
.scan-hero{padding:1.5em; margin-bottom:1.3em;}
.scan-hero-inner{display:grid; grid-template-columns:1fr 1fr; gap:1em;}
.scan-tile{
  border:1.5px solid var(--line); border-radius:18px; padding:1.6em 1.3em; cursor:pointer; text-align:center;
  display:flex; flex-direction:column; align-items:center; gap:.55em; transition:.15s; background:var(--paper);
}
.scan-tile:hover{border-color:var(--navy-2); background:#fff; transform:translateY(-1px); box-shadow:var(--shadow);}
.scan-tile:active{transform:scale(.99);}
.scan-tile-ico{width:52px; height:52px; border-radius:50%; background:var(--navy); color:#fff; display:flex; align-items:center; justify-content:center;}
.scan-tile-ico .icon{width:1.5em; height:1.5em;}
.scan-tile b{font-size:1.05em; letter-spacing:-.01em;}
.scan-tile span{font-size:.82em; color:var(--muted);}
.scan-manual{display:flex; gap:.6em; margin-top:1.2em;}
@media(max-width:640px){.scan-hero-inner{grid-template-columns:1fr;} .scan-manual{flex-direction:column;}}

/* ---------------------------- HELP ---------------------------------- */
.help-item{padding:1.1em 0; border-bottom:1px solid var(--line);}
.help-item:last-child{border-bottom:none;}
.help-item h4{margin:0 0 .35em; display:flex; align-items:center; gap:.55em; font-size:1em;}
.help-item p{margin:0; color:var(--muted); font-size:.92em; line-height:1.55;}
.override-note{display:flex; gap:.6em; align-items:flex-start; background:#FBF6EB; border:1px solid #EFDFB8; border-radius:12px; padding:.9em 1em; font-size:.88em; color:#5c4a1f;}
.override-note .icon{color:var(--gold); margin-top:.1em;}

/* ---------------------------- APP LOCK SCREEN ---------------------------------- */
.lock-screen{
  position:fixed; inset:0; z-index:500; background:linear-gradient(180deg,var(--navy) 0%, var(--navy-deep) 100%);
  display:flex; align-items:center; justify-content:center; padding:1.2em;
}
.lock-screen.hidden{display:none;}
.lock-card{background:#fff; border-radius:20px; padding:2.2em 1.9em; max-width:340px; width:100%; box-shadow:0 20px 60px -20px rgba(0,0,0,.6); text-align:center;}
.lock-card .wordmark{font-size:1.7em; color:var(--navy); justify-content:center;}
.lock-card .wordmark .helm{color:var(--gold);}
.lock-card .lock-sub{font-size:.78em; color:var(--muted); letter-spacing:.05em; margin:.3em 0 1.5em;}
.lock-card .field{text-align:left;}
</style>

<script>
/* =========================================================================
   MSR GATE SECURITY MANAGEMENT SYSTEM
   Single-file, offline-first, vanilla JS. Data lives in localStorage only.
   ========================================================================= */

/* Bump this when a future update changes how data is stored, so the app (or a human) can
   tell which shape a given backup file or browser's localStorage is in. Backups always
   record the version they were exported from; nothing currently branches on it, but it's
   here so an upgrade never has to guess. */
const APP_DATA_VERSION = 1;

/* ---------------------------- DB LAYER ---------------------------------- */
const DB = {
  get(key, fallback){
    try{ const v = localStorage.getItem('gsms_'+key); return v===null? fallback : JSON.parse(v); }
    catch(e){ return fallback; }
  },
  set(key, val){
    try{ localStorage.setItem('gsms_'+key, JSON.stringify(val)); return true; }
    catch(e){ toast('Storage error — data may not have saved.', 'err'); return false; }
  }
};

/* ---------------------------- ICONS (inline SVG, stroke-style) ---------------------------------- */
const ICONS = {

  trash: '<path d="M5 7h14"/><path d="M9 7V5.5A1.5 1.5 0 0 1 10.5 4h3A1.5 1.5 0 0 1 15 5.5V7"/><path d="M7 7l1 13.5A1.5 1.5 0 0 0 9.5 22h5a1.5 1.5 0 0 0 1.5-1.5L17 7"/>',

function ic(name, cls){
  return `<svg class="icon${cls?' '+cls:''}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICONS[name]||''}</svg>`;
}

const DEFAULT_ACCESS_LEVELS = [
  {name:'Visitor', zone:'Office / admin areas (escorted only)'},
  {name:'Contractor', zone:'Assigned work zone + shop floor'},
  {name:'Vendor / Delivery', zone:'Dock & warehouse only'},
  {name:'Inspector / Regulator', zone:'Vessel + full yard (USCG, ABS, owner\u2019s rep)'},
  {name:'VIP / Tour', zone:'Public areas only'}
];
const DEFAULT_PURPOSES = ['Repair / Maintenance','Delivery','Inspection / Audit','Meeting','Tour','Other'];

function defaultSettings(){
  return {
    companyName:'Mehreen Ship Recycling',
    hotline:'09611336887',
    accessLevels: DEFAULT_ACCESS_LEVELS,
    purposes: DEFAULT_PURPOSES,
    adminKey:'msr2026',
    securityKey:'2026',
    staffAddKey:'staff2026',
    whatsappNumber:'8801319001751',
    workStartHour:8, // for late-arrival calc
    workEndHour:17,  // for early-departure / overtime calc
    overdueAlertsEnabled:true,   // pop up + sound when a visitor's time is up and they haven't checked out
    overdueAlertSoundEnabled:true,
    overdueAlertSnoozeMins:10,   // how long "Ignore" silences a given visitor for
    badgeWidthMm:54, badgeHeightMm:85.6,   // CR80 card size \u2014 overridable in Settings > Printing
    badgeFoldBack:true,                    // print a rotated back panel (V/S + hotline) below the front
    badgeFields:{photo:true, hostedBy:true, areaAccess:true, purpose:true, escort:true, checkIn:true, expiry:true, subline:true, nid:true},
    printMarginIn:0.5,                     // page margin used by every print job (badge sheet, history, reports), in inches
    reportOrientation:'landscape',         // orientation for History and Reports prints \u2014 badges are always portrait (fixed card shape)
  };
}

function ensureInit(){
  if(DB.get('settings',null)===null) DB.set('settings', defaultSettings());
  if(DB.get('visitors',null)===null) DB.set('visitors', []);
  if(DB.get('staff',null)===null) DB.set('staff', []);
  if(DB.get('staffAttendance',null)===null) DB.set('staffAttendance', []);
  if(DB.get('auditLog',null)===null) DB.set('auditLog', []);
}
ensureInit();

/* Always layer saved settings on top of the current defaults (never the other way round).
   This means a browser that saved its settings under an older version of this tool will
   automatically pick up any new settings fields added by a later version, instead of
   ending up with them undefined and breaking. */
function S(){ return Object.assign({}, defaultSettings(), DB.get('settings', {})); }
function saveS(s){ DB.set('settings', s); }

/* ---------------------------- UTILITIES ---------------------------------- */
function uid(){ return Math.random().toString(36).slice(2,9); }
function pad(n,len){ return String(n).padStart(len,'0'); }
function nowISO(){ return new Date().toISOString(); }
function fmtDT(iso){ if(!iso) return '\u2014'; const d=new Date(iso); return d.toLocaleDateString(undefined,{month:'short',day:'2-digit',year:'numeric'})+' '+d.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'}); }
function fmtDateOnly(iso){ if(!iso) return '\u2014'; const d=new Date(iso); return d.toLocaleDateString(undefined,{month:'short',day:'2-digit',year:'numeric'}); }
function fmtTimeOnly(iso){ if(!iso) return '\u2014'; const d=new Date(iso); return d.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'}); }
function escapeHtml(str){ return String(str==null?'':str).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function minutesBetween(a,b){ return Math.round((new Date(b)-new Date(a))/60000); }
function durationLabel(mins){
  if(mins==null) return '\u2014';
  const h=Math.floor(mins/60), m=mins%60;
  if(h<=0) return m+'m';
  if(m===0) return h+'h';
  return h+'h '+m+'m';
}
/* There is no separate visitor/staff number, not even internally — the NID number itself
   IS the person's record id everywhere in this app. idFromNid() just normalizes it (trim,
   uppercase, strip internal whitespace) so lookups are consistent regardless of how the
   digits were typed at the gate. */
function idFromNid(nid){ return (nid||'').toString().trim().toUpperCase().replace(/\s+/g,''); }
/* ---------------------------- AREA ACCESS (visitor + staff share this shape) ---------------------------- */
function defaultAreaAccess(){ return {office:false, ship:false, shipName:'', walkway:false, outdoorStorage:false, indoorStorage:false, other:false, otherText:''}; }
function areaAccessAny(aa){ return !!(aa && (aa.office||aa.ship||aa.walkway||aa.outdoorStorage||aa.indoorStorage||aa.other)); }
function formatAreaAccess(aa){
  if(!aa) return '';
  const parts = [];
  if(aa.office) parts.push('Office');
  if(aa.ship) parts.push('Ship'+(aa.shipName?' ('+aa.shipName+')':''));
  if(aa.walkway) parts.push('Walkway');
  if(aa.outdoorStorage) parts.push('Outdoor Open Storage');
  if(aa.indoorStorage) parts.push('Indoor Storage');
  if(aa.other) parts.push(aa.otherText? 'Other: '+aa.otherText : 'Other');
  return parts.join(', ');
}
/* Renders the shared Area Access checkbox block. varPath is the literal JS path the inline
   onchange handlers write to (e.g. "VW.details.areaAccess" or "window.__staffAA"), rerenderFn
   is the literal JS call used to redraw after a checkbox toggle (so conditional Ship Name /
   Other subfields appear immediately). */
function areaAccessFieldsHtml(aa, varPath, rerenderFn){
  return `
    <div class="chip-grid">
      <label class="chip-toggle"><input type="checkbox" ${aa.office?'checked':''} onchange="${varPath}.office=this.checked; ${rerenderFn}"> Office</label>
      <label class="chip-toggle"><input type="checkbox" ${aa.ship?'checked':''} onchange="${varPath}.ship=this.checked; ${rerenderFn}"> Ship</label>
      <label class="chip-toggle"><input type="checkbox" ${aa.walkway?'checked':''} onchange="${varPath}.walkway=this.checked; ${rerenderFn}"> Walkway</label>
      <label class="chip-toggle"><input type="checkbox" ${aa.outdoorStorage?'checked':''} onchange="${varPath}.outdoorStorage=this.checked; ${rerenderFn}"> Outdoor Open Storage</label>
      <label class="chip-toggle"><input type="checkbox" ${aa.indoorStorage?'checked':''} onchange="${varPath}.indoorStorage=this.checked; ${rerenderFn}"> Indoor Storage</label>
      <label class="chip-toggle"><input type="checkbox" ${aa.other?'checked':''} onchange="${varPath}.other=this.checked; ${rerenderFn}"> Other</label>
    </div>
    ${aa.ship ? `<div class="field" style="grid-column:1/-1; margin-top:.6em;"><label>Ship Name *</label><input value="${escapeHtml(aa.shipName)}" oninput="${varPath}.shipName=this.value"></div>`:''}
    ${aa.other ? `<div class="field" style="grid-column:1/-1; margin-top:.6em;"><label>Specify other area *</label><input value="${escapeHtml(aa.otherText)}" oninput="${varPath}.otherText=this.value" placeholder="e.g. Crane Bay B"></div>`:''}
  `;
}
function logAudit(action, recordId, role){
  const log = DB.get('auditLog',[]);
  log.unshift({ts: nowISO(), action, recordId: recordId||'', role: role||'Officer'});
  if(log.length>5000) log.length=5000;
  DB.set('auditLog', log);
}

/* ---------------------------- TOASTS ---------------------------------- */
function toast(msg, type){
  const host = document.getElementById('toastHost');
  const el = document.createElement('div');
  el.className = 'toast'+(type==='err'?' err':type==='ok'?' ok':'');
  el.textContent = msg;
  host.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .25s'; setTimeout(()=>el.remove(),260); }, 3200);
}

/* ---------------------------- MODALS ---------------------------------- */
let modalStack = [];
function openModal(innerHtml, opts){
  opts = opts||{};
  const host = document.getElementById('modalHost');
  const wrap = document.createElement('div');
  wrap.className = 'modal-backdrop';
  wrap.innerHTML = `<div class="modal ${opts.wide?'wide':''} ${opts.narrow?'narrow':''}">${innerHtml}</div>`;
  wrap.addEventListener('mousedown', (e)=>{ if(e.target===wrap && !opts.persistent) closeModal(); });
  host.appendChild(wrap);
  modalStack.push(wrap);
  return wrap;
}
function closeModal(){
  const el = modalStack.pop();
  if(el) el.remove();
  stopAllCameraStreams();
}
function modalHeader(title){
  return `<div class="modal-head"><h3>${title}</h3><button class="close-x" onclick="closeModal()">&times;</button></div>`;
}

/* ---------------------------- SECURITY KEY PROMPTS ---------------------------------- */
function askKey(kind){
  // kind: 'admin' | 'security' | 'staffAdd'
  return new Promise((resolve)=>{
    const label = kind==='admin' ? 'Admin Security Code' : kind==='staffAdd' ? 'Add Staff Security Code' : 'Security Code';
    const desc = kind==='admin' ? 'Required to override this section \u2014 settings, staff management, backups and deletions.'
      : kind==='staffAdd' ? 'Held by the person designated to register new staff. This does not grant access to Settings, editing, or deleting staff.'
      : 'Required to override this section and confirm this checkout.';
    const m = openModal(`
      ${modalHeader('Enter '+label)}
      <div class="modal-body">
        <p class="small" style="margin-top:0;">${desc}</p>
        <div class="field">
          <label>${label}</label>
          <input type="password" id="keyInput" autocomplete="off" onkeydown="if(event.key==='Enter')document.getElementById('keySubmitBtn').click();">
        </div>
        <div id="keyErr" class="small" style="color:var(--red); display:none;">Incorrect code. Try again.</div>
      </div>
      <div class="modal-foot">
        <button class="btn" onclick="__keyResolve(false)">Cancel</button>
        <button class="btn btn-primary" id="keySubmitBtn" onclick="__keyCheck('${kind}')">Confirm</button>
      </div>
    `, {narrow:true});
    setTimeout(()=>{ const i=document.getElementById('keyInput'); if(i) i.focus(); }, 60);
    window.__keyResolve = (ok)=>{ closeModal(); resolve(ok); delete window.__keyResolve; delete window.__keyCheck; };
    window.__keyCheck = (k)=>{
      const val = document.getElementById('keyInput').value;
      const settings = S();
      const correct = k==='admin' ? val===settings.adminKey
        : k==='staffAdd' ? (val===settings.staffAddKey || val===settings.adminKey)
        : (val===settings.securityKey || val===settings.adminKey);
      if(correct){ window.__keyResolve(true); }
      else { document.getElementById('keyErr').style.display='block'; document.getElementById('keyInput').value=''; document.getElementById('keyInput').focus(); }
    };
  });
}

function confirmDialog(title, body, okLabel, danger){
  return new Promise((resolve)=>{
    openModal(`
      ${modalHeader(title)}
      <div class="modal-body"><p style="margin:0;">${body}</p></div>
      <div class="modal-foot">
        <button class="btn" onclick="__confResolve(false)">Cancel</button>
        <button class="btn ${danger?'btn-danger':'btn-primary'}" onclick="__confResolve(true)">${okLabel||'Confirm'}</button>
      </div>
    `, {narrow:true});
    window.__confResolve = (v)=>{ closeModal(); resolve(v); delete window.__confResolve; };
  });
}

/* ---------------------------- CAMERA ---------------------------------- */
const activeStreams = {};
async function startCamera(videoEl, key){
  try{
    const stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}, audio:false});
    activeStreams[key] = stream;
    videoEl.srcObject = stream;
    await videoEl.play();
    return true;
  }catch(e){
    toast('Camera unavailable: '+e.message, 'err');
    return false;
  }
}
function stopCamera(key){
  const s = activeStreams[key];
  if(s){ s.getTracks().forEach(t=>t.stop()); delete activeStreams[key]; }
}
function stopAllCameraStreams(){ Object.keys(activeStreams).forEach(stopCamera); }
function snapFromVideo(videoEl){
  const c = document.createElement('canvas');
  c.width = videoEl.videoWidth||640; c.height = videoEl.videoHeight||480;
  c.getContext('2d').drawImage(videoEl,0,0,c.width,c.height);
  return c.toDataURL('image/jpeg', 0.85);
}
function fileToDataUrl(file){
  return new Promise((resolve,reject)=>{
    const r = new FileReader();
    r.onload = ()=>resolve(r.result);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}



/* ---------------------------- BADGE HTML BUILDER ---------------------------------- */
function buildBadgeHtml(rec, kind){
  // rec: visitor or staff record ; kind: 'VISITOR' or 'STAFF'
  // No QR code, no scanning \u2014 the visible NID number IS this person's ID number.
  // Security reads it (or the gate clerk types it into Home Scan Console) to check
  // someone in or out. Every field below is a full, plainly-labeled row \u2014 nothing
  // is abbreviated away or hidden behind a scan.
  const settings = S();
  const bf = settings.badgeFields || defaultSettings().badgeFields;
  const photo = rec.facePhoto || rec.photo || '';
  const name = rec.name || '\u2014';
  const idStr = rec.id;
  const isVisitor = kind==='VISITOR';
  const subLine = bf.subline ? (isVisitor ? (rec.company||'') : (rec.designation||'')) : '';
  const rows = [];
  if(isVisitor){
    if(bf.hostedBy) rows.push({l:'HOSTED BY', v:rec.hostName||'\u2014'});
    rows.push({l:'VISITOR TYPE', v:rec.accessLevel||'\u2014'});
    if(bf.areaAccess) rows.push({l:'AREA ACCESS', v:formatAreaAccess(rec.areaAccess)||'\u2014', wide:true});
    if(bf.purpose) rows.push({l:'PURPOSE', v:rec.purpose||'\u2014'});
    if(bf.escort && rec.escort) rows.push({l:'ESCORT', v:rec.escort});
    if(bf.checkIn) rows.push({l:'CHECK-IN', v:fmtDT(rec.checkIn)});
    if(bf.expiry) rows.push({l:'EXPIRY', v:fmtDT(rec.expiry)});
  } else {
    rows.push({l:'UNIT', v:rec.department||'\u2014'});
    if(bf.areaAccess) rows.push({l:'AREA ACCESS', v:formatAreaAccess(rec.areaAccess)||'\u2014', wide:true});
  }
  const wMm = settings.badgeWidthMm || 54;
  const hMm = settings.badgeHeightMm || 85.6;
  const cardStyle = ` style="width:${wMm}mm; height:${hMm}mm;"`;
  return `
  <div class="badge-card" data-badge-id="${escapeHtml(idStr)}"${cardStyle}>
    <div class="badge-head">
      <div class="wm"><span class="wheel">&#9096;</span>MSR</div>
      <div class="full">${escapeHtml(settings.companyName||'Mehreen Ship Recycling')}</div>
    </div>
    <div class="badge-kindbar ${isVisitor?'kb-v':'kb-s'}">
      <span class="kb-letter">${isVisitor?'V':'S'}</span>
      <span class="kb-word">${isVisitor?'VISITOR':'STAFF'}</span>
    </div>
    ${bf.photo!==false ? `<div class="badge-photo-wrap">
      ${photo ? `<img src="${photo}">` : `<div class="no-photo">No Photo</div>`}
    </div>` : ''}
    <div class="badge-info">
      <div class="nm">${escapeHtml(name)}</div>
      ${subLine? `<div class="sub">${escapeHtml(subLine)}</div>`:''}
      <div class="badge-table">
        ${rows.map(r=>`<div class="row-field${r.wide?' row-wide':''}"><span class="lab">${escapeHtml(r.l)}</span><span class="val">${escapeHtml(r.v)}</span></div>`).join('')}
      </div>
    </div>
    <div class="badge-nidbox">
      <div class="nid-lab">NID NUMBER</div>
      <div class="nid-val">${escapeHtml(rec.nid||'\u2014')}</div>
    </div>
    <div class="badge-foot">Hotline: ${escapeHtml(settings.hotline||'')}</div>
  </div>`;
}
/* Back panel of the fold-over badge \u2014 sparse and bold on purpose (the "flip it over and
   glance at it" panel): a large V/S visible at a glance, the company wordmark, and the hotline.
   Prints normal/readable, same orientation as the front \u2014 no rotation, no mirroring, since both
   panels land on the same side of the same printed page. */
function buildBadgeBackHtml(rec, kind){
  const settings = S();
  const isVisitor = kind==='VISITOR';
  const wMm = settings.badgeWidthMm || 54;
  const hMm = settings.badgeHeightMm || 85.6;
  return `
  <div class="badge-back" style="width:${wMm}mm; height:${hMm}mm;">
    <div class="bb-letter">${isVisitor?'V':'S'}</div>
    <div class="bb-word">${isVisitor?'VISITOR':'STAFF'}</div>
    <div class="bb-company">${escapeHtml(settings.companyName||'Mehreen Ship Recycling')}</div>
    <div class="bb-hotline">Hotline: ${escapeHtml(settings.hotline||'')}</div>
  </div>`;
}
/* One printed fold-over pair \u2014 front + back, side by side, touching at a vertical fold seam
   (front on the left, back on the right, card size locked \u2014 no resizing, no rotating the card
   itself). When settings.badgeFoldBack is off, prints the front panel alone (no seam, no back). */
function buildBadgeUnitHtml(rec, kind){
  const settings = S();
  const foldBack = settings.badgeFoldBack !== false;
  if(!foldBack){
    return `<div class="badge-pair">${buildBadgeHtml(rec, kind)}</div>`;
  }
  return `
  <div class="badge-pair">
    ${buildBadgeHtml(rec, kind)}
    <div class="fold-seam"><span class="fold-tag">&#9986; fold</span></div>
    ${buildBadgeBackHtml(rec, kind)}
  </div>`;
}

let VW = null; // visitor wizard state
function newVisitorWizard(){
  VW = {
    step: 1,
    editingId: null, // set when we've pulled up an existing NID's profile — finalizeVisitor() updates that record in place instead of creating a new one
    fields: {hostName:'', name:'', nid:'', phone:''},
    face: {photo:null, override:false, overrideReason:''},
    details: {company:'', escort:'', accessLevel:'', areaAccess: defaultAreaAccess(), purpose:'', purposeOther:'', durationH:1, durationM:0, ppe:false, safety:false, notes:'', vehicleType:'', plateNumber:''}
  };
}
function openVisitorWizard(){
  newVisitorWizard();
  openModal(`<div id="wizardRoot"></div>`, {wide:true, persistent:true});
  renderWizard();
}
function wizardShell(bodyHtml, footHtml, title){
  const total = 4;
  const cur = VW.step;
  let dots='';
  for(let i=1;i<=total;i++) dots += `<div class="step ${i<=cur?'on':''}"></div>`;
  document.getElementById('wizardRoot').innerHTML = `
    ${modalHeader(title||'New Visitor')}
    <div class="modal-body">
      <div class="steps">${dots}</div>
      ${bodyHtml}
    </div>
    <div class="modal-foot">${footHtml}</div>
  `;
}
function renderWizard(){
  if(VW.step===1) return wizardStepIdentity();
  if(VW.step===2) return wizardStepFace();
  if(VW.step===3) return wizardStepDetails();
  if(VW.step===4) return wizardStepReview();
}
function wizardBack(){ stopAllCameraStreams(); VW.step--; renderWizard(); }
function wizardNext(){ stopAllCameraStreams(); VW.step++; renderWizard(); }

function wizardStepIdentity(){
  const f = VW.fields;
  wizardShell(`
    <p class="small" style="margin-top:0;">NIDs are taken and photocopied at the gate \u2014 just record the basics here.</p>
    <div class="grid grid-2">
      <div class="field" style="grid-column:1/-1;"><label>Hosted By (who is this visitor here to see) *</label><input value="${escapeHtml(f.hostName)}" oninput="VW.fields.hostName=this.value"></div>
      <div class="field"><label>Full Name *</label><input value="${escapeHtml(f.name)}" oninput="VW.fields.name=this.value"></div>
      <div class="field"><label>Phone Number *</label><input value="${escapeHtml(f.phone)}" oninput="VW.fields.phone=this.value"></div>
      <div class="field" style="grid-column:1/-1;"><label>NID Number *</label><input value="${escapeHtml(f.nid)}" oninput="VW.fields.nid=this.value"></div>
    </div>
  `, `
    <button class="btn" onclick="closeModal()">Cancel</button>
    <button class="btn btn-primary" onclick="submitIdentity()">Continue</button>
  `, 'New Visitor \u2014 Details');
}
function submitIdentity(){
  if(!VW.fields.hostName.trim()){ toast('Hosted By is required \u2014 enter who the visitor is here to see.','err'); return; }
  if(!VW.fields.name.trim() || !VW.fields.phone.trim() || !VW.fields.nid.trim()){ toast('Name, phone number and NID number are required.','err'); return; }
  VW.editingId = null; // always re-derive fresh from whatever NID is currently in the field
  const nidKey = idFromNid(VW.fields.nid);
  const visitors = DB.get('visitors',[]);
  const existing = visitors.find(v=>v.id===nidKey);
  if(existing){
    if(existing.status==='onsite'){
      toast(existing.name+' is already checked in with this NID. Use Check Out from their record instead of registering again.','err');
      closeModal();
      openLookupModal('VISITOR', existing);
      return;
    }
    // Returning visitor, currently checked out — pull up their profile instead of creating a duplicate.
    // Jump straight to the Details step so security can review/update access & purpose for this visit.
    VW.editingId = existing.id;
    VW.fields = {hostName: VW.fields.hostName||existing.hostName||'', name: existing.name, nid: existing.nid, phone: existing.phone};
    VW.face.photo = existing.facePhoto || null;
    VW.face.override = existing.faceOverride || false;
    VW.face.overrideReason = existing.faceOverrideReason || '';
    VW.details = {
      company: existing.company||'', escort: existing.escort||'', accessLevel: existing.accessLevel||'',
      areaAccess: existing.areaAccess ? {...defaultAreaAccess(), ...existing.areaAccess} : defaultAreaAccess(),
      purpose:'', purposeOther:'', durationH:1, durationM:0, ppe:existing.ppe||false, safety:existing.safety||false,
      notes:'', vehicleType: existing.vehicleType||'', plateNumber: existing.plateNumber||''
    };
    toast('Returning visitor found \u2014 profile loaded. Review and update access & purpose for this visit.', 'ok');
    VW.step = 3;
    renderWizard();
    return;
  }
  const staffMatch = DB.get('staff',[]).find(s=>s.id===nidKey);
  if(staffMatch) toast('Note: this NID belongs to a registered staff member ('+staffMatch.name+').', 'err');
  const phoneNorm = normPhone(VW.fields.phone);
  const phoneMatch = phoneNorm.length>=7 ? visitors.find(v=>normPhone(v.phone)===phoneNorm) : null;
  if(phoneMatch) toast('Note: this phone number is already on file for '+phoneMatch.name+' (NID '+(phoneMatch.nid||'\u2014')+').', 'err');
  wizardNext();
}

async function captureFace(){
  const v = document.getElementById('videoFace');
  if(!v || !v.srcObject){ toast('Start the camera first.','err'); return; }
  VW.face.photo = snapFromVideo(v);
  stopCamera('face');
  renderWizard();
}
async function toggleOverride(checked){
  if(checked){
    const ok = await askKey('security');
    if(!ok){ renderWizard(); return; }
  }
  VW.face.override = checked;
  renderWizard();
}
function wizardNextFromFace(){
  if(!VW.face.photo && !VW.face.override){ toast('Face photo is required (or use the security override).','err'); return; }
  if(VW.face.override && !VW.face.overrideReason.trim()){ toast('Please enter a reason for the override.','err'); return; }
  wizardNext();
}

function wizardNextFromDetails(){
  const d = VW.details;
  if(!d.accessLevel){ toast('Select a visitor type.','err'); return; }
  if(!areaAccessAny(d.areaAccess)){ toast('Select at least one area access.','err'); return; }

async function finalizeVisitor(){
  const f = VW.fields, d = VW.details;
  if(VW.editingId){
    const ok = await askKey('security');
    if(!ok) return;
  }
  const id = VW.editingId || idFromNid(f.nid);
  const now = nowISO();
  const durMins = d.durationH*60 + d.durationM;
  const expiry = new Date(Date.now()+durMins*60000).toISOString();
  const rec = {
    id, type:'visitor',
    hostName: f.hostName, name: f.name, nid: f.nid, phone: f.phone,
    facePhoto: VW.face.photo||'', faceOverride: VW.face.override, faceOverrideReason: VW.face.overrideReason||'',
    company: d.company||'', escort: d.escort||'', accessLevel: d.accessLevel, areaAccess: {...d.areaAccess},
    purpose: d.purpose==='Other'?d.purposeOther:d.purpose,
    vehicleType: d.vehicleType||'', plateNumber: d.plateNumber||'',
    durationMins: durMins, ppe: d.ppe, safety: d.safety, notes: d.notes||'',
    checkIn: now, expiry, checkOut: null, status: 'onsite'
  };
  const visitors = DB.get('visitors',[]);
  if(VW.editingId){
    const idx = visitors.findIndex(v=>v.id===VW.editingId);
    if(idx>=0) visitors[idx] = rec; else visitors.unshift(rec);
    logAudit('Visitor re-checked in (profile updated)', id, 'Officer');
  } else {
    visitors.unshift(rec);
    logAudit('Visitor checked in', id, 'Officer');
  }
  DB.set('visitors', visitors);
  if(VW.face.override) logAudit('Face photo override used: '+VW.face.overrideReason, id, 'Security');
  closeModal();
  showBadgeModal(rec, 'VISITOR', true);
  renderRoute();
}

function visitorStatusInfo(rec){
  if(rec.status==='checked_out') return {label:'Checked Out', cls:'gray'};
  const now = Date.now(), exp = new Date(rec.expiry).getTime();
  if(now > exp) return {label:'Overdue', cls:'red'};
  if(exp - now < 15*60000) return {label:'Near Expiry', cls:'amber'};
  return {label:'On Site', cls:'green'};
}

/* ========================================================================
   OVERDUE CHECKOUT ALERTS \u2014 pop-up + sound when a visitor's time is up
   and they still haven't checked out. Runs on a timer; if more than one
   visitor is overdue at once it lists them all and lets security decide,
   per visitor, whether to check them out, view their details, or ignore
   them for a while. "Ignore" only snoozes that one visitor \u2014 it never
   turns the feature off, and the alert keeps re-checking in the background.
   ======================================================================== */
let overdueAlertOpen = false;
let overdueSnoozeUntil = {}; // visitor id -> timestamp (ms) until which we won't re-alert
function getOverdueVisitors(){
  const now = Date.now();
  return DB.get('visitors',[]).filter(v=>
    v.status==='onsite' &&
    new Date(v.expiry).getTime() < now &&
    !(overdueSnoozeUntil[v.id] && overdueSnoozeUntil[v.id] > now)
  );
}
function playOverdueAlertSound(){
  try{
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if(!Ctx) return;
    const ctx = new Ctx();
    let t = ctx.currentTime;
    for(let i=0;i<3;i++){
      const osc = ctx.createOscillator(), gain = ctx.createGain();
      osc.type = 'sine'; osc.frequency.setValueAtTime(880, t);
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.exponentialRampToValueAtTime(0.35, t+0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, t+0.3);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(t); osc.stop(t+0.32);
      t += 0.42;
    }
    setTimeout(()=>{ try{ ctx.close(); }catch(e){} }, 1500);
  }catch(e){}
}
function checkOverdueAlerts(){
  if(!sessionUnlocked || overdueAlertOpen) return;
  const settings = S();
  if(settings.overdueAlertsEnabled===false) return;
  const list = getOverdueVisitors();
  if(!list.length) return;
  overdueAlertOpen = true;
  if(settings.overdueAlertSoundEnabled!==false) playOverdueAlertSound();
  renderOverdueAlertModal();
}
function renderOverdueAlertModal(){
  const list = getOverdueVisitors();
  if(!list.length){ overdueAlertOpen = false; closeModal(); return; }
  const rows = list.map(v=>{
    const mins = Math.max(0, Math.round((Date.now() - new Date(v.expiry).getTime())/60000));
    return `<tr>
      <td><b>${escapeHtml(v.name)}</b><div class="small mono">${escapeHtml(v.id)}</div></td>
      <td>${escapeHtml(v.company||'\u2014')}</td>
      <td><span class="badge-pill pill-red">${mins} min over</span></td>
      <td>
        <div class="row" style="gap:.35em; flex-wrap:nowrap;">
          <button class="btn btn-sm" onclick="overdueViewInfo('${v.id}')">Info</button>
          <button class="btn btn-sm btn-primary" onclick="overdueCheckOut('${v.id}')">Check Out</button>
          <button class="btn btn-sm btn-ghost" onclick="overdueSnooze('${v.id}')">Ignore</button>
        </div>
      </td>
    </tr>`;
  }).join('');
  openModal(`
    ${modalHeader(ic('alert')+' Time\u2019s Up \u2014 '+list.length+' Visitor'+(list.length>1?'s':'')+' Not Checked Out')}
    <div class="modal-body">
      <p class="small" style="margin-top:0;">${list.length>1?'These visitors have':'This visitor has'} passed their expected checkout time and ${list.length>1?'are':'is'} still on site. Decide per visitor below, or ignore all for now.</p>
      <div class="table-wrap"><table class="hist-print-table" style="width:100%;">
        <thead><tr><th>Visitor</th><th>Company</th><th>Overdue</th><th></th></tr></thead>
        <tbody>${rows}</tbody>
      </table></div>
    </div>
    <div class="modal-foot">
      <button class="btn" onclick="overdueSnoozeAll()">Ignore All (${S().overdueAlertSnoozeMins||10} min)</button>
      <button class="btn btn-ghost" onclick="overdueAlertOpen=false; closeModal();">Close</button>
    </div>
  `, {wide:true, persistent:true});
}
function overdueViewInfo(id){
  overdueAlertOpen = false;
  closeModal();
  openLookupFromRecord('VISITOR', id);
}
async function overdueCheckOut(id){
  overdueAlertOpen = false;
  closeModal();
  await checkoutVisitor(id);
}
function overdueSnooze(id){
  const mins = S().overdueAlertSnoozeMins||10;
  overdueSnoozeUntil[id] = Date.now() + mins*60000;
  closeModal();
  renderOverdueAlertModal();
}
function overdueSnoozeAll(){
  const mins = S().overdueAlertSnoozeMins||10;
  const now = Date.now();
  getOverdueVisitors().forEach(v=>{ overdueSnoozeUntil[v.id] = now + mins*60000; });
  overdueAlertOpen = false;
  closeModal();
}

async function saveStaff(existingId){
  const name = document.getElementById('stName').value.trim();
  const nid = document.getElementById('stNid').value.trim();
  const dept = document.getElementById('stDept').value.trim();
  const desig = document.getElementById('stDesig').value.trim();
  const phone = document.getElementById('stPhone').value.trim();
  const aa = window.__staffAA || defaultAreaAccess();
  if(!name||!nid||!dept||!desig||!phone){ toast('Please fill all required fields (NID number is mandatory).','err'); return; }
  if(!areaAccessAny(aa)){ toast('Select at least one area access.','err'); return; }
  if(aa.ship && !aa.shipName.trim()){ toast('Enter the ship name.','err'); return; }
  if(aa.other && !aa.otherText.trim()){ toast('Specify the other area access.','err'); return; }
  const staff = DB.get('staff',[]);
  const nidKey = idFromNid(nid);
  if(!existingId){
    const dup = staff.find(s=>s.id===nidKey);
    if(dup){
      toast('A staff member is already registered with this NID: '+dup.name+' ('+dup.id+'). Opening their record instead.','err');
      closeModal();
      openStaffForm(dup.id);
      return;
    }
    const visitorMatch = DB.get('visitors',[]).find(v=>v.id===nidKey);
    if(visitorMatch) toast('Note: this NID is already registered as a visitor ('+visitorMatch.name+').', 'err');
  }
  const phoneNorm = normPhone(phone);
  const phoneDup = phoneNorm.length>=7 ? staff.find(s=>s.id!==nidKey && normPhone(s.phone)===phoneNorm) : null;
  if(phoneDup) toast('Note: this phone number is already on file for '+phoneDup.name+' ('+phoneDup.id+').', 'err');
  const ok = await askKey(existingId ? 'admin' : 'staffAdd');
  if(!ok) return;
  let newRec = null;
  if(existingId){
    const rec = staff.find(s=>s.id===existingId);
    if(nidKey !== existingId){
      const collide = staff.find(s=>s.id===nidKey && s!==rec);
      if(collide){ toast('Another staff member already uses this NID: '+collide.name+' ('+collide.id+').','err'); return; }
      DB.set('staffAttendance', DB.get('staffAttendance',[]).map(a=> a.staffId===existingId ? {...a, staffId:nidKey} : a));
      rec.id = nidKey;
    }
    Object.assign(rec, {name, nid, department:dept, designation:desig, areaAccess:{...aa}, phone,
      bloodGroup:document.getElementById('stBg').value.trim(), email:document.getElementById('stEmail').value.trim(),
      emergencyContact:document.getElementById('stEc').value.trim(), joiningDate:document.getElementById('stJoin').value,
      status:document.getElementById('stStatus').value, photo: window.__staffPhotoTemp||rec.photo||''});
    logAudit('Staff edited', rec.id, 'Admin');
    toast('Staff record updated.','ok');
  } else {
    const rec = {id:nidKey, type:'staff', nid, name, department:dept, designation:desig, areaAccess:{...aa}, phone,
      bloodGroup:document.getElementById('stBg').value.trim(), email:document.getElementById('stEmail').value.trim(),
      emergencyContact:document.getElementById('stEc').value.trim(), joiningDate:document.getElementById('stJoin').value,
      status:document.getElementById('stStatus').value, photo: window.__staffPhotoTemp||''};
    staff.unshift(rec);
    logAudit('Staff added', rec.id, 'Admin');
    toast('Staff added: '+rec.id,'ok');
    newRec = rec;
  }
  DB.set('staff', staff);
  closeModal();
  renderRoute();
  if(newRec) showBadgeModal(newRec, 'STAFF', 'registered');
}

function staffCurrentlyOnsite(id){
  const att = DB.get('staffAttendance',[]);
  return att.find(a=>a.staffId===id && !a.checkOut) || null;
}
async function staffCheckIn(id){
  const staff = DB.get('staff',[]);
  const rec = staff.find(s=>s.id===id || s.nid===id);
  if(!rec){ toast('Staff ID not found.','err'); return; }
  if(staffCurrentlyOnsite(rec.id)){ toast(rec.name+' is already checked in.','err'); return; }
  const settings = S();
  const now = new Date();
  const isLate = now.getHours() > settings.workStartHour || (now.getHours()===settings.workStartHour && now.getMinutes()>0);
  const att = DB.get('staffAttendance',[]);
  const entry = {id: uid(), staffId: rec.id, name: rec.name, department: rec.department, checkIn: nowISO(), checkOut:null, late: isLate, earlyDeparture:false, overtimeMins:0, workedMins:0};
  att.unshift(entry);
  DB.set('staffAttendance', att);
  logAudit('Staff checked in', rec.id, 'Officer');
  toast(rec.name+' checked in.', 'ok');
  renderRoute();
  showBadgeModal(rec, 'STAFF', true);
}
async function staffCheckOut(id){
  const staff = DB.get('staff',[]);
  const rec = staff.find(s=>s.id===id || s.nid===id);
  if(!rec){ toast('Staff ID not found.','err'); return; }
  const entry = staffCurrentlyOnsite(rec.id);
  if(!entry){ toast(rec.name+' is not currently checked in.','err'); return; }
  const ok = await askKey('security');
  if(!ok) return;
  const settings = S();
  const now = new Date();
  entry.checkOut = nowISO();
  entry.workedMins = minutesBetween(entry.checkIn, entry.checkOut);
  entry.earlyDeparture = now.getHours() < settings.workEndHour;
  const expectedEnd = new Date(entry.checkIn);
  expectedEnd.setHours(settings.workEndHour,0,0,0);
  entry.overtimeMins = Math.max(0, minutesBetween(expectedEnd.toISOString(), entry.checkOut));
  DB.set('staffAttendance', DB.get('staffAttendance',[]).map(a=>a.id===entry.id?entry:a));
  logAudit('Staff checked out', rec.id, 'Security');
  toast(rec.name+' checked out.', 'ok');
  renderRoute();
  showCheckoutInfoModal({...rec, checkIn: entry.checkIn, checkOut: entry.checkOut}, 'STAFF');
}

function downloadFile(filename, content, mime){
  const blob = new Blob([content], {type:mime||'text/plain'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 3000);
}
/* ========================================================================
   BULK STAFF IMPORT \u2014 CSV or JSON. Matches existing staff by NID (updates
   in place); a new NID creates a new record. No external library required
   (this app stays fully offline), so XLSX isn't supported directly \u2014 the
   template and instructions ask for CSV, which any spreadsheet program
   (Excel/Sheets/LibreOffice) can save to via "Save As \u2192 CSV".
   ======================================================================== */
function parseAreaAccessString(str){
  const aa = defaultAreaAccess();
  if(!str) return aa;
  String(str).split(/[;|]/).map(s=>s.trim()).filter(Boolean).forEach(tok=>{
    let m;
    if(/^office$/i.test(tok)) aa.office = true;
    else if((m = tok.match(/^ship\s*[:\-]?\s*\(?([^)]*)\)?$/i))){ aa.ship = true; aa.shipName = (m[1]||'').trim(); }
    else if(/^walkway$/i.test(tok)) aa.walkway = true;
    else if(/^outdoor/i.test(tok)) aa.outdoorStorage = true;
    else if(/^indoor/i.test(tok)) aa.indoorStorage = true;
    else if((m = tok.match(/^other\s*[:\-]?\s*(.*)$/i))){ aa.other = true; aa.otherText = (m[1]||'').trim(); }
  });
  return aa;
}
/* Minimal RFC4180-ish CSV parser \u2014 handles quoted fields, escaped quotes, and commas inside quotes. */
function parseCsv(text){
  const rows = []; let field='', row=[], inQuotes=false, i=0;
  const pushField=()=>{ row.push(field); field=''; };
  const pushRow=()=>{ rows.push(row); row=[]; };
  while(i<text.length){
    const c = text[i];
    if(inQuotes){
      if(c==='"'){ if(text[i+1]==='"'){ field+='"'; i+=2; continue; } inQuotes=false; i++; continue; }
      field+=c; i++; continue;
    } else {
      if(c==='"'){ inQuotes=true; i++; continue; }
      if(c===','){ pushField(); i++; continue; }
      if(c==='\r'){ i++; continue; }
      if(c==='\n'){ pushField(); pushRow(); i++; continue; }
      field+=c; i++; continue;
    }
  }
  if(field.length || row.length){ pushField(); pushRow(); }
  if(!rows.length) return [];
  const headers = rows[0].map(h=>h.trim().toLowerCase());
  return rows.slice(1).filter(r=>r.some(c=>(c||'').trim()!=='')).map(r=>{
    const obj = {}; headers.forEach((h,idx)=>obj[h]=(r[idx]||'').trim()); return obj;
  });
}
function normalizeImportRow(obj){
  const get = (...keys)=>{ for(const k of keys){ if(obj[k]!=null && String(obj[k]).trim()!=='') return String(obj[k]).trim(); } return ''; };
  const status = get('status').toLowerCase()==='inactive' ? 'inactive' : 'active';
  return {
    name: get('name','fullname','full name'),
    nid: get('nid','nid number','national id'),
    phone: get('phone','phone number','mobile'),
    department: get('unit','department','dept'),
    designation: get('designation','title','position'),
    areaAccess: get('areaaccess','area access'),
    bloodGroup: get('bloodgroup','blood group'),
    email: get('email'),
    emergencyContact: get('emergencycontact','emergency contact'),
    joiningDate: get('joiningdate','joining date'),
    status
  };
}

      <button class="btn btn-sm" onclick="bulkImportStaffTemplate()">Download CSV Template</button>

      <p class="hint">JSON files should be an array of objects using the same field names (case-insensitive), e.g. <code>[{"name":"...","nid":"...","phone":"...","unit":"...","designation":"...","areaAccess":"Office;Walkway"}]</code>.</p>
    </div>
    <div class="modal-foot">
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="runBulkImportStaff()">Import</button>
    </div>
  `, {wide:true});
}
async function runBulkImportStaff(){
  const input = document.getElementById('bulkImportFile');
  const file = input && input.files[0];
  if(!file){ toast('Choose a CSV or JSON file first.','err'); return; }
  const text = await file.text();
  let rows = [];
  try{
    if(/\.json$/i.test(file.name) || text.trim().startsWith('[')){
      const data = JSON.parse(text);
      rows = (Array.isArray(data)?data:[]).map(o=>{
        const lower = {}; Object.keys(o).forEach(k=>lower[k.toLowerCase()]=o[k]);
        return normalizeImportRow(lower);
      });
    } else {
      rows = parseCsv(text).map(normalizeImportRow);
    }
  }catch(e){ toast('Could not parse the file: '+e.message,'err'); return; }
  rows = rows.filter(r=>r.name && r.nid && r.phone && r.department && r.designation);
  if(!rows.length){ toast('No valid rows found \u2014 Name, NID, Phone, Unit and Designation are required in every row.','err'); return; }
  const ok = await askKey('admin');
  if(!ok) return;
  const staff = DB.get('staff',[]);
  let added=0, updated=0;
  rows.forEach(r=>{
    const id = idFromNid(r.nid);
    const areaAccess = parseAreaAccessString(r.areaAccess);
    const existing = staff.find(s=>s.id===id);
    if(existing){
      Object.assign(existing, {name:r.name, nid:r.nid, department:r.department, designation:r.designation,
        areaAccess, phone:r.phone, bloodGroup:r.bloodGroup||existing.bloodGroup||'', email:r.email||existing.email||'',
        emergencyContact:r.emergencyContact||existing.emergencyContact||'', joiningDate:r.joiningDate||existing.joiningDate||'',
        status:r.status||existing.status||'active'});
      updated++;
    } else {
      staff.unshift({id, type:'staff', nid:r.nid, name:r.name, department:r.department, designation:r.designation,
        areaAccess, phone:r.phone, bloodGroup:r.bloodGroup||'', email:r.email||'', emergencyContact:r.emergencyContact||'',
        joiningDate:r.joiningDate||'', status:r.status||'active', photo:''});
      added++;
    }
  });
  DB.set('staff', staff);
  logAudit('Bulk staff import: '+added+' added, '+updated+' updated', '', 'Admin');
  toast('Bulk import complete \u2014 '+added+' added, '+updated+' updated.', 'ok');
  closeModal();
  renderRoute();
}

/* ========================================================================
   HOME SCAN CONSOLE
   Two simple flows \u2014 no QR codes, no camera scanning, just typed numbers:
   - Type a National ID that isn't a known record -> start visitor registration
   - Type a Staff ID, Visitor ID, or NID that's already in the system -> check-in / check-out
   ======================================================================== */
function homeStartVisitorWithNid(prefillNid){
  newVisitorWizard();
  if(prefillNid) VW.fields.nid = prefillNid;
  openModal(`<div id="wizardRoot"></div>`, {wide:true, persistent:true});
  renderWizard();
}
/* Normalizes a phone number for comparison \u2014 strips everything but digits, and drops a
   leading country/trunk prefix ("+880", "880", or a leading "0") so "01712345678",
   "+8801712345678" and "8801712345678" all match the same stored number. */
function normPhone(p){
  let d = (p||'').replace(/\D/g,'');
  if(d.startsWith('880')) d = d.slice(3);
  else if(d.startsWith('0')) d = d.slice(1);
  return d;
}
async function homeManualSubmit(){
  const input = document.getElementById('homeScanInput');
  const raw = (input.value||'').trim();
  if(!raw){ toast('Scan or type an ID.','err'); return; }
  input.value = '';
  const id = raw.toUpperCase();
  const rawPhone = normPhone(raw);
  const isPhoneLike = rawPhone.length>=7;
  const staff = DB.get('staff',[]).find(s=>s.id===id || (s.nid||'').toUpperCase()===id
    || (isPhoneLike && normPhone(s.phone)===rawPhone));
  if(staff){
    openLookupModal('STAFF', staff);
    return;
  }
  const visitor = DB.get('visitors',[]).find(v=>v.id===id || (v.nid||'').toUpperCase()===id
    || (isPhoneLike && normPhone(v.phone)===rawPhone));
  if(visitor){
    openLookupModal('VISITOR', visitor);
    return;
  }
  const ok = await confirmDialog('No record found', 'No staff or visitor is registered with \u201c'+escapeHtml(raw)+'\u201d. Start a new visitor registration using this as the NID number?', 'Register Visitor');
  if(ok) homeStartVisitorWithNid(raw);
}

    ...visitors.map(v=>({...v, _kind:'Visitor', _status:visitorStatusInfo(v)})),

  ].sort((a,b)=> new Date(a.checkIn)-new Date(b.checkIn));

function historyFilteredVisitors(){
  const {from,to,q} = historyState;
  return DB.get('visitors',[]).filter(v=>{
    const d = v.checkIn.slice(0,10);
    if(from && d<from) return false;
    if(to && d>to) return false;
    if(q){
      const hay = [v.id,v.name,v.phone,v.nid,v.company,v.hostName,v.accessLevel].join(' ').toLowerCase();
      if(!hay.includes(q.toLowerCase())) return false;
    }
    return true;
  }).sort((a,b)=> new Date(b.checkIn)-new Date(a.checkIn));
}
function historyFilteredStaffAtt(){
  const {from,to,q} = historyState;
  return DB.get('staffAttendance',[]).filter(a=>{
    const d = a.checkIn.slice(0,10);
    if(from && d<from) return false;
    if(to && d>to) return false;
    if(q){
      const hay = [a.staffId,a.name,a.department].join(' ').toLowerCase();
      if(!hay.includes(q.toLowerCase())) return false;
    }
    return true;
  }).sort((a,b)=> new Date(b.checkIn)-new Date(a.checkIn));
}

/* Rewrites (never appends) a single dynamic @page rule right before every print job, so a
   report printed in landscape can never leak into the next badge print (which needs portrait).
   Margin and orientation both come from Settings > Printing so any user can tune them. */
function applyPrintPageStyle(orientation){
  const s = S();
  const marginIn = parseFloat(s.printMarginIn);
  const marginMm = ((isFinite(marginIn) && marginIn>0) ? marginIn : 0.5) * 25.4;
  let el = document.getElementById('dynamicPrintPageStyle');
  if(!el){ el = document.createElement('style'); el.id = 'dynamicPrintPageStyle'; document.head.appendChild(el); }
  el.textContent = `@media print{ @page{ size:A4 ${orientation}; margin:${marginMm.toFixed(2)}mm; } }`;
}
function exportHistory(fmt){
  const isV = historyState.tab==='visitor';
  const rows = isV ? historyFilteredVisitors() : historyFilteredStaffAtt();
  const fname = (isV?'visitor_history_':'staff_attendance_')+historyState.from+'_to_'+historyState.to;
  if(fmt==='json'){ downloadFile(fname+'.json', JSON.stringify(rows,null,2), 'application/json'); }
  else if(fmt==='csv'){ downloadFile(fname+'.csv', toCsv(rows), 'text/csv'); }
  else if(fmt==='xlsx'){
    const ws = XLSX.utils.json_to_sheet(rows.map(stripPhotosForExport));
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, isV?'Visitor History':'Staff Attendance');
    XLSX.writeFile(wb, fname+'.xlsx');
  }
  logAudit((isV?'Visitor history':'Staff attendance')+' exported ('+fmt+')', '', 'Officer');
}
function stripPhotosForExport(rec){
  const {facePhoto, frontPhoto, backPhoto, photo, ...rest} = rec;
  return rest;
}
function toCsv(rows){
  if(!rows.length) return '';
  const clean = rows.map(stripPhotosForExport);
  const cols = Object.keys(clean[0]);
  const esc = v=>{ const s = v==null?'':String(v); return /[",\n]/.test(s)? '"'+s.replace(/"/g,'""')+'"': s; };
  return cols.join(',')+'\n'+clean.map(r=>cols.map(c=>esc(r[c])).join(',')).join('\n');
}

function reportRows(){

  if(type==='staff-attendance') return DB.get('staffAttendance',[]).filter(a=>a.checkIn.slice(0,10)===date);
  if(type==='gate-summary') return [
    ...DB.get('visitors',[]).filter(v=>v.checkIn.slice(0,10)===date).map(v=>({time:v.checkIn, event:'Visitor Check-in', who:v.name, detail:v.accessLevel})),
    ...DB.get('visitors',[]).filter(v=>v.checkOut && v.checkOut.slice(0,10)===date).map(v=>({time:v.checkOut, event:'Visitor Check-out', who:v.name, detail:v.accessLevel})),
    ...DB.get('staffAttendance',[]).filter(a=>a.checkIn.slice(0,10)===date).map(a=>({time:a.checkIn, event:'Staff Check-in', who:a.name, detail:a.department})),

  }

    return `<div class="table-wrap"><table><thead><tr><th>Staff ID</th><th>Name</th><th>Unit</th><th>Check In</th><th>Check Out</th><th>Worked</th><th>Late</th><th>Overtime</th></tr></thead>

  }

function monthlyDailyBreakdown(visitors, staffAtt){
  const days = {};
  visitors.forEach(v=>{ const d=v.checkIn.slice(0,10); days[d]=days[d]||{v:0,s:0}; days[d].v++; });
  staffAtt.forEach(a=>{ const d=a.checkIn.slice(0,10); days[d]=days[d]||{v:0,s:0}; days[d].s++; });
  return Object.keys(days).sort().map(d=>({date:d, v:days[d].v, s:days[d].s}));
}

  setTimeout(()=>{ applyPrintPageStyle(settings.reportOrientation||'landscape'); window.print(); }, 50);
}
function exportReport(fmt){
  const rowsRaw = reportState.type==='monthly' ? reportRows().visitors.concat(reportRows().staffAtt) : reportRows();
  const rows = Array.isArray(rowsRaw) ? rowsRaw : [];
  const fname = 'report_'+reportState.type+'_'+(reportState.type==='monthly'?reportState.month:reportState.date);
  if(fmt==='json') downloadFile(fname+'.json', JSON.stringify(rows,null,2), 'application/json');

  const tabs = [['general','General'],['visitor','Visitor Settings'],['staff','Staff Management'],['printing','Printing'],['security','Security'],['backup','Backup'],['offline','Offline & Sync'],['audit','Audit Log']];
  const needsAdmin = settingsTab !== 'printing';
  if(needsAdmin && !adminUnlocked){
    return `
      <div class="subtabs">${tabs.map(t=>`<button class="subtab ${settingsTab===t[0]?'active':''}" onclick="settingsTab='${t[0]}'; renderRoute();">${t[1]}</button>`).join('')}</div>
      <div class="card card-pad center" style="max-width:420px; margin:2em auto;">
        <div style="margin-bottom:.3em;">${ic('lock','icon-lg')}</div>
        <div class="section-title" style="justify-content:center;">Admin Access Required</div>
        <p class="small">Staff management, security codes and backups are restricted to Admin. Enter the Admin Security Code to override. Printing options (page margin, orientation, badge layout) are open to every access level \u2014 use the Printing tab above, no code needed.</p>
        <button class="btn btn-primary btn-block" onclick="unlockSettings()">${ic('shield')} Enter Admin Security Code</button>
      </div>`;
  }
  return `
    <div class="subtabs">${tabs.map(t=>`<button class="subtab ${settingsTab===t[0]?'active':''}" onclick="settingsTab='${t[0]}'; renderRoute();">${t[1]}</button>`).join('')}</div>
    <div class="card card-pad">${settingsTabBody()}</div>
  `;
}
async function unlockSettings(){
  const ok = await askKey('admin');
  if(ok){ adminUnlocked = true; renderRoute(); }
}

let s_accessLevels = null, s_purposes = null, s_badgeFields = null;
function refreshAccessLevelsEditor(){ settingsTab='visitor'; renderRoute(); }
function refreshPurposesEditor(){ settingsTab='visitor'; renderRoute(); }
function saveGeneralSettings(){
  const s = S();
  s.companyName = document.getElementById('setCompany').value.trim() || s.companyName;
  s.hotline = document.getElementById('setHotline').value.trim();
  s.whatsappNumber = document.getElementById('setWhatsapp').value.trim().replace(/[^\d]/g,'') || s.whatsappNumber;
  s.overdueAlertsEnabled = document.getElementById('setOverdueAlerts').checked;
  s.overdueAlertSoundEnabled = document.getElementById('setOverdueSound').checked;
  s.overdueAlertSnoozeMins = Math.max(1, parseInt(document.getElementById('setOverdueSnooze').value,10) || 10);
  saveS(s);
  logAudit('Settings changed (general)', '', 'Admin');
  toast('General settings saved.', 'ok');
  renderRoute();
}
function saveVisitorSettings(){
  const s = S();
  if(s_accessLevels) s.accessLevels = s_accessLevels.filter(l=>l.name.trim());
  if(s_purposes) s.purposes = s_purposes.filter(p=>p.trim());
  saveS(s);
  s_accessLevels = null; s_purposes = null;
  logAudit('Settings changed (visitor)', '', 'Admin');
  toast('Visitor settings saved.', 'ok');
  renderRoute();
}
function savePrintingSettings(){
  const s = S();
  const w = parseFloat(document.getElementById('setBadgeW').value) || s.badgeWidthMm || 54;
  const h = parseFloat(document.getElementById('setBadgeH').value) || s.badgeHeightMm || 85.6;
  s.badgeWidthMm = w;
  s.badgeHeightMm = h;
  s.badgeFoldBack = document.getElementById('setFoldBack').checked;
  if(s_badgeFields){ s_badgeFields.nid = true; s.badgeFields = {...s_badgeFields}; }
  const marginVal = parseFloat(document.getElementById('setPrintMargin').value);
  s.printMarginIn = (isFinite(marginVal) && marginVal>0) ? marginVal : 0.5;
  s.reportOrientation = document.getElementById('setReportOrientation').value==='portrait' ? 'portrait' : 'landscape';
  saveS(s);
  s_badgeFields = null;
  logAudit('Settings changed (printing)', '', 'Officer');
  toast('Printing settings saved.', 'ok');
  renderRoute();
}
function saveSecuritySettings(){
  const s = S();
  s.adminKey = document.getElementById('setAdminKey').value.trim() || s.adminKey;
  s.securityKey = document.getElementById('setSecKey').value.trim() || s.securityKey;
  s.staffAddKey = document.getElementById('setStaffAddKey').value.trim() || s.staffAddKey;
  saveS(s);
  logAudit('Security keys changed', '', 'Admin');
  toast('Security keys updated.', 'ok');
  renderRoute();
}
